<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&amp;family=Schibsted+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light;
    --bg: #ececea; --panel: #f5f5f3; --hover: #e0e0dd; --placeholder: #dcdcd9; --line: #cfcfcb;
    --ink: #131313; --muted: #6b6b67; --on-ink: #ececea;
    --warn: #8a5a00; --ok: #1d6b45; --danger: #b3261e;
    --font: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --display: "Bricolage Grotesque", var(--font);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e0e0e; --panel: #151515; --hover: #1d1d1d; --placeholder: #1a1a1a; --line: #2a2a2a;
    --ink: #f1f1ee; --muted: #9a9a95; --on-ink: #0e0e0e;
    --warn: #e3b341; --ok: #5fd39a; --danger: #ff7b6b;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* ---------- bar ---------- */
  .bar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--bg); }
  .brand { display: flex; align-items: center; gap: 10px; margin: 0; font: 800 22px/1 var(--display); letter-spacing: -.03em; }
  .pill { padding: 3px 9px 4px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font: 700 11px/1.2 var(--font); letter-spacing: .08em; text-transform: uppercase; }
  .status { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; }
  .status::before { content: ""; width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--ok); }
  .status.saving::before { background: var(--warn); animation: pulse 1s ease-in-out infinite; }
  .status.off::before { background: var(--warn); }
  @keyframes pulse { 50% { opacity: .3; } }
  .spacer { flex: 1; }

  .b { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 7px 16px; border: 1px solid var(--line); border-radius: 999px; background: transparent; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; transition: border-color .15s ease; }
  .b:hover:not(:disabled) { border-color: var(--ink); }
  .b:disabled { opacity: .5; cursor: not-allowed; }
  .b.primary { border-color: var(--ink); background: var(--ink); color: var(--on-ink); }
  .b.danger { color: var(--danger); }
  .b.small { min-height: 32px; padding: 4px 12px; font-size: 13px; }
  .ib { position: relative; display: grid; place-items: center; width: 38px; height: 38px; padding: 0; border: 0; border-radius: 50%; background: transparent; cursor: pointer; }
  .ib:hover { background: var(--hover); }
  .ib.danger:hover { color: var(--danger); }
  .ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
  .dot { position: absolute; top: -2px; right: -2px; width: 9px; height: 9px; border: 2px solid var(--bg); border-radius: 50%; background: #d79a00; box-sizing: content-box; }

  /* ---------- toolbar ---------- */
  .wrap { max-width: 1240px; margin: 0 auto; padding: 16px 16px 90px; }
  .toolbar { position: sticky; top: 59px; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 0; background: var(--bg); }
  .search { position: relative; flex: 1 1 260px; max-width: 460px; }
  .search .ic { position: absolute; left: 12px; top: 50%; width: 18px; height: 18px; color: var(--muted); transform: translateY(-50%); pointer-events: none; }
  .search input { width: 100%; min-height: 40px; padding: 8px 14px 8px 38px; border: 1px solid transparent; border-radius: 999px; background: var(--hover); }
  .search input:focus { border-color: var(--ink); outline: none; background: var(--bg); }
  select { min-height: 40px; max-width: 190px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); cursor: pointer; }
  .bulk { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 4px 0 10px; padding: 8px 12px; border: 1px solid var(--ink); border-radius: 12px; background: var(--panel); font-size: 14px; font-weight: 600; }

  /* ---------- list ---------- */
  .list { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: clip; }
  table { width: 100%; border-collapse: collapse; }
  th { position: sticky; top: 109px; z-index: 5; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .04em; text-align: left; text-transform: uppercase; }
  th:first-child { border-top-left-radius: 11px; }
  th:last-child { border-top-right-radius: 11px; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 14px; }
  tr.row { cursor: pointer; transition: background .12s ease; }
  tr.row:hover, tr.row.sel { background: var(--hover); }
  tr.row.bad td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
  tr.row:last-child td { border-bottom: 0; }
  td.chk, th.chk { width: 44px; padding-right: 0; }
  td.chk input, th.chk input { width: 18px; height: 18px; margin: 0; accent-color: var(--ink); cursor: pointer; }
  td.thumb { width: 136px; }
  .th, .ph { display: block; width: 112px; aspect-ratio: 16 / 9; border-radius: 6px; }
  .th { object-fit: contain; background: #000; }
  .ph { display: grid; place-items: center; border: 1px dashed var(--line); color: var(--muted); font-size: 11px; }
  td.code { font-weight: 700; }
  .tag { display: inline-block; margin-left: 6px; padding: 1px 7px 2px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 11px; font-weight: 600; vertical-align: 1px; }
  .tag.warn { border-color: var(--warn); color: var(--warn); }
  td.muted { color: var(--muted); }
  td.actions { width: 104px; white-space: nowrap; text-align: right; }
  td.actions .ib { display: inline-grid; vertical-align: middle; }
  td.meta { display: none; }
  .empty { padding: 56px 16px; color: var(--muted); text-align: center; }
  .empty b { display: block; margin-bottom: 4px; color: var(--ink); font: 800 20px var(--display); letter-spacing: -.02em; }
  .more { display: flex; justify-content: center; padding: 14px; border-top: 1px solid var(--line); }

  @media (max-width: 760px) {
    .bar { flex-wrap: wrap; gap: 8px; }
    .status { order: 5; flex: 0 0 100%; }
    .toolbar { position: static; }
    th { top: 0; }
    thead { display: none; }
    table, tbody { display: block; }
    tr.row { display: grid; grid-template-columns: 24px 104px 1fr auto; gap: 2px 12px; align-items: start; padding: 12px; border-bottom: 1px solid var(--line); }
    tr.row td { display: block; padding: 0; border: 0; }
    td.chk { grid-row: 1 / 3; padding-top: 2px; } td.thumb { grid-row: 1 / 3; width: auto; }
    td.thumb .th, td.thumb .ph { width: 104px; }
    td.code { grid-column: 3; } td.actions { grid-column: 4; grid-row: 1; width: auto; margin: -8px -8px 0 0; }
    td.meta { display: block; grid-column: 3 / 5; grid-row: 2; color: var(--muted); font-size: 13px; }
    tr.row td.genre, tr.row td.cats, tr.row td.cast, tr.row td.dur { display: none; }
    #btn-download { display: none; }
    .search { max-width: none; flex-basis: 100%; }
    select { flex: 1 1 140px; max-width: none; }
    .spacer { display: none; }
    .toolbar #btn-add { flex: 1 0 100%; }
  }

  /* ---------- dialogs ---------- */
  dialog { width: min(760px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); padding: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--ink); }
  dialog.narrow { width: min(440px, calc(100vw - 24px)); }
  dialog::backdrop { background: rgb(0 0 0 / .55); }
  .body { padding: 20px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .head h2 { margin: 0; font: 800 21px/1.15 var(--display); letter-spacing: -.025em; }
  .cols { display: grid; gap: 20px; }
  @media (min-width: 720px) { .cols { grid-template-columns: 230px 1fr; } .pvcol { position: sticky; top: 0; align-self: start; } }
  .pv .cover { position: relative; display: grid; place-items: center; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 4px; background: #000; }
  .pv img, .pv video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .pv .ph2 { padding: 8px; color: #aaa; font-size: 13px; text-align: center; }
  .pv .dur { position: absolute; right: 8px; bottom: 8px; padding: 4px 7px 5px; border-radius: 4px; background: rgb(0 0 0 / .82); color: #fff; font-size: 12.5px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .pv .pcode { margin-top: 10px; font-weight: 600; }
  .note { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  .field { display: block; margin: 0 0 12px; font-size: 13px; font-weight: 600; }
  .field input, .field select { width: 100%; max-width: none; margin-top: 4px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-size: 15px; font-weight: 400; }
  .field input:focus, .field select:focus { border-color: var(--ink); outline: none; }
  .field small { display: block; margin-top: 3px; color: var(--muted); font-weight: 400; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 460px) { .row2 { grid-template-columns: 1fr; } }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; max-height: 140px; margin-top: 6px; overflow: auto; }
  .chip { min-height: 34px; padding: 5px 13px; border: 1px solid var(--line); border-radius: 999px; background: transparent; font-size: 13px; font-weight: 500; cursor: pointer; }
  .chip:hover { border-color: var(--ink); }
  .chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--on-ink); }
  .addcat { display: flex; gap: 8px; margin-top: 8px; }
  .addcat input { flex: 1; margin: 0; }
  .acts { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .errors { margin: 4px 0 0; padding-left: 18px; color: var(--danger); font-size: 14px; }
  .p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  details.conn { margin-bottom: 14px; border: 1px solid var(--line); border-radius: 10px; }
  details.conn > summary { padding: 11px 14px; font-weight: 700; cursor: pointer; }
  details.conn > div { padding: 0 14px 6px; }
  .check { display: flex; align-items: center; gap: 8px; margin: 4px 0 10px; font-size: 13px; font-weight: 400; }
  .check input { width: auto; margin: 0; }
  .diff h3 { margin: 14px 0 4px; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }
  .diff h3.add { color: var(--ok); } .diff h3.edit { color: var(--warn); } .diff h3.del { color: var(--danger); }
  .diff ul { margin: 0; padding-left: 18px; font-size: 14px; }

  #toast { position: fixed; left: 50%; bottom: 20px; z-index: 80; display: flex; align-items: center; gap: 14px; max-width: min(540px, calc(100vw - 24px)); padding: 11px 14px 11px 16px; border-radius: 12px; background: var(--ink); color: var(--on-ink); font-size: 14px; transform: translateX(-50%); box-shadow: 0 16px 40px -16px rgb(0 0 0 / .5); }
  #toast.err { background: var(--danger); color: var(--bg); }
  #toast a { color: inherit; }
  #toast button { padding: 2px 6px; border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { .status.saving::before { animation: none; } }
</style>
</head>
<body>

<header class="bar">
  <h1 class="brand"><span id="site-name">Galeri SB99</span><span class="pill">Admin</span></h1>
  <span id="status" class="status">Loading…</span>
  <span class="spacer"></span>
  <button id="btn-theme" class="ib" type="button" aria-label="Toggle theme" title="Toggle theme">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z" /></svg>
  </button>
  <button id="btn-download" class="b" type="button">Download</button>
  <button id="btn-publish" class="b primary" type="button">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M12 16V4" /><path d="M7 9l5-5 5 5" /><path d="M5 20h14" /></svg>Publish<span id="dot" class="dot" hidden></span>
  </button>
</header>

<main class="wrap">
  <div class="toolbar">
    <div class="search">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
      <input id="q" type="search" placeholder="Search videos…  ( / )" aria-label="Search videos" autocomplete="off" />
    </div>
    <select id="f-genre" aria-label="Filter by genre"><option value="">All genres</option></select>
    <select id="f-cat" aria-label="Filter by category"><option value="">All categories</option></select>
    <select id="f-sort" aria-label="Sort">
      <option value="new">Newest first</option><option value="old">Oldest first</option><option value="code">Title A–Z</option>
    </select>
    <button id="f-bad" class="b small" type="button" aria-pressed="false" hidden></button>
    <span class="spacer"></span>
    <button id="btn-add" class="b primary" type="button">+ Add video</button>
  </div>

  <div id="bulk" class="bulk" hidden>
    <span id="bulk-n"></span>
    <button id="bulk-del" class="b small danger" type="button">Delete selected</button>
    <button id="bulk-clear" class="b small" type="button">Clear</button>
  </div>

  <div class="list">
    <table>
      <thead><tr>
        <th class="chk"><input id="sel-all" type="checkbox" aria-label="Select all shown" /></th>
        <th>Cover</th><th>Title</th><th>Genres</th><th>Categories</th><th>Cast</th><th>Duration</th><th></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" hidden></div>
    <div id="more" class="more" hidden><button id="btn-more" class="b" type="button"></button></div>
  </div>
</main>

<dialog id="dlg-form">
  <form id="form" class="body" method="dialog" novalidate>
    <div class="head"><h2 id="form-title">Add video</h2><button type="button" class="ib" data-close aria-label="Close"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12" /><path d="M18 6L6 18" /></svg></button></div>
    <div class="cols">
      <aside class="pvcol" aria-label="Live preview">
        <div class="pv" aria-hidden="true">
          <div class="cover"><video id="pv-vid" muted playsinline preload="metadata" hidden></video><img id="pv-img" alt="" hidden /><div id="pv-ph" class="ph2">Cover preview</div><span id="pv-dur" class="dur" hidden></span></div>
          <div id="pv-code" class="pcode">TITLE</div>
        </div>
        <p id="pv-meta" class="note"></p>
        <p class="note">Live preview of the card on the site.</p>
      </aside>
      <div>
        <div class="row2">
          <label class="field">Title *<input id="f-code" autocomplete="off" /></label>
          <label class="field">Type *<select id="f-type"><option value="">Video file</option><option value="embed">Embed</option></select></label>
        </div>
        <label class="field">URL *<input id="f-url" type="url" autocomplete="off" placeholder="https://…" /></label>
        <label class="field">Cover image URL <b id="cover-req" hidden>*</b><input id="f-cover" type="url" autocomplete="off" placeholder="https://…" /><small id="cover-hint">Optional. Leave empty to use a frame from the video automatically.</small></label>
        <label class="field">Duration *<input id="f-duration" autocomplete="off" placeholder="12:34 or 754" /></label>
        <div class="field">
          <span>Genres *</span><small>Pick one or more, or type a new one.</small>
          <div id="genres" class="chips"></div>
          <div class="addcat"><input id="f-newgenre" aria-label="New genre" autocomplete="off" placeholder="New genre, then Enter" /><button type="button" class="b" id="btn-addgenre">Add</button></div>
        </div>
        <div class="field">
          <span>Categories *</span><small>Tap to pick existing ones, or type a new one.</small>
          <div id="cats" class="chips"></div>
          <div class="addcat"><input id="f-newcat" aria-label="New category" autocomplete="off" placeholder="New category, then Enter" /><button type="button" class="b" id="btn-addcat">Add</button></div>
        </div>
        <label class="field">Cast *<input id="f-cast" autocomplete="off" placeholder="Name One, Name Two" /><small>Separate with commas.</small></label>
      </div>
    </div>
    <ul id="errors" class="errors" hidden></ul>
    <div class="acts"><button type="button" class="b" data-close>Cancel</button><button type="submit" class="b primary">Save</button></div>
  </form>
</dialog>

<dialog id="dlg-confirm" class="narrow">
  <form class="body" method="dialog">
    <div class="head"><h2 id="cf-title">Confirm</h2></div>
    <p id="cf-msg" class="p"></p>
    <div class="acts"><button value="cancel" class="b">Cancel</button><button value="ok" id="cf-ok" class="b primary">OK</button></div>
  </form>
</dialog>

<dialog id="dlg-publish">
  <div class="body">
    <div class="head"><h2>Publish to GitHub</h2><button type="button" class="ib" data-close aria-label="Close"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12" /><path d="M18 6L6 18" /></svg></button></div>
    <details id="conn" class="conn">
      <summary>Connection</summary>
      <div>
        <div class="row2">
          <label class="field">Owner<input id="s-owner" autocomplete="off" placeholder="your-username" /></label>
          <label class="field">Repository<input id="s-repo" autocomplete="off" placeholder="my-gallery" /></label>
        </div>
        <div class="row2">
          <label class="field">Branch<input id="s-branch" autocomplete="off" placeholder="e.g. main" /></label>
          <label class="field">File path in repo<input id="s-path" autocomplete="off" placeholder="e.g. url.json" /></label>
        </div>
        <label class="field">Personal access token<input id="s-token" type="password" autocomplete="off" placeholder="github_pat_…" /><small>Fine-grained token, one repo only, "Contents: Read and write". Never saved to disk.</small></label>
        <label class="check"><input id="s-remember" type="checkbox" /> Remember the token for this tab only</label>
      </div>
    </details>
    <div class="acts" style="justify-content:flex-start;margin-top:0">
      <button type="button" class="b" id="btn-pull">Pull from GitHub</button>
      <button type="button" class="b primary" id="btn-check">Review changes</button>
      <button type="button" class="b" id="btn-download2">Download url.json</button>
    </div>
    <div id="review" hidden>
      <p class="p" id="rv-sub" style="margin-top:16px"></p>
      <div id="rv-diff" class="diff"></div>
      <p class="p" id="rv-warn" hidden></p>
      <label class="field" style="margin-top:14px">Commit message<input id="rv-msg" /></label>
      <div class="acts"><button type="button" class="b" data-close>Cancel</button><button type="button" class="b primary" id="btn-push">Confirm push</button></div>
    </div>
  </div>
</dialog>

<div id="toast" role="status" hidden></div>

<script>
(() => {
  'use strict';

  const SITE_TITLE = 'Galeri SB99'; // same name as the gallery; change both together
  const $ = (s) => document.querySelector(s);
  const PAGE = 60;
  const KNOWN = ['title', 'url', 'type', 'cover', 'genre', 'category', 'cast', 'duration'];
  const DURATION_RE = /^\d+$|^\d{1,3}(:\d{1,2}){1,2}$/;
  const SETTINGS_KEY = 'sb99-admin-settings', TOKEN_KEY = 'sb99-admin-token', THEME_KEY = 'sb99-theme';

  const st = {
    genres: [], raw: [], wrapper: null, saveOn: false, file: 'url.json', timer: 0, running: false, again: false,
    unpushed: false, sha: null, editing: -1, cats: [], pending: null, selected: new Set(), shown: PAGE, undo: null,
    f: { q: '', genre: '', cat: '', bad: false, sort: 'new' }, status: ''
  };

  // ---------- helpers ----------
  const text = (v) => (typeof v === 'string' ? v.trim() : typeof v === 'number' ? String(v) : '');
  const list = (v) => (Array.isArray(v) ? v : typeof v === 'string' ? v.split(',') : []).map(text).filter(Boolean);
  const isHttp = (u) => /^https?:\/\/\S+$/i.test(u);
  const codeOf = (o) => text(o && o.title) || text(o && o.code); // "title" (older files may still use "code")
  const isVideoFile = (u) => /\.(mp4|webm|ogv|mov|m4v|mkv)(\?[^#]*)?(#.*)?$/i.test(u);
  const isEmbedLike = (o) => text(o.type).toLowerCase() === 'embed' || (isHttp(text(o.url)) && !isVideoFile(text(o.url)));
  const norm = (v) => v.toLowerCase();
  const toB64 = (s) => { let b = ''; new TextEncoder().encode(s).forEach((x) => { b += String.fromCharCode(x); }); return btoa(b); };
  const fromB64 = (b) => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g, '')), (c) => c.charCodeAt(0)));
  const el = (tag, props, ...kids) => { const e = Object.assign(document.createElement(tag), props || {}); e.append(...kids); return e; };

  const toDuration = (value) => {
    let total = NaN;
    const t = typeof value === 'number' ? String(Math.round(value)) : typeof value === 'string' ? value.trim() : '';
    if (/^\d+$/.test(t)) total = Number(t);
    else if (/^\d{1,3}(:\d{1,2}){1,2}$/.test(t)) total = t.split(':').reduce((sum, part) => sum * 60 + Number(part), 0);
    if (!Number.isFinite(total) || total <= 0) return '';
    const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
    const pad = (n) => String(n).padStart(2, '0');

    const url = repoPath(s) + '?ref=' + encodeURIComponent(s.branch);
    const meta = await (await gh(url)).json();
    const raw = meta.content && meta.encoding === 'base64' ? fromB64(meta.content) : await (await gh(url, { headers: { Accept: 'application/vnd.github.raw+json' } })).text();
    return { sha: meta.sha, raw };
  };
  const remoteList = (t) => { const d = JSON.parse(t); const a = Array.isArray(d) ? d : d && typeof d === 'object' ? d[Object.keys(d).find((k) => Array.isArray(d[k]))] || [] : []; return a.filter((o) => o && typeof o === 'object'); };
  const keyOf = (o, i) => (codeOf(o) ? norm(codeOf(o)) : '#' + i);
  const diffLists = (remote, local) => {
    const r = new Map(remote.map((e, i) => [keyOf(e, i), e])), l = new Map(local.map((e, i) => [keyOf(e, i), e]));
    const added = [], edited = [], removed = [];
    l.forEach((e, k) => { if (!r.has(k)) added.push(codeOf(e) || k); else if (JSON.stringify(r.get(k)) !== JSON.stringify(e)) edited.push(codeOf(e) || k); });
    r.forEach((e, k) => { if (!l.has(k)) removed.push(codeOf(e) || k); });
    return { added, edited, removed };
  };
  const diffGroup = (title, cls, items) => {
    const fr = document.createDocumentFragment(); if (!items.length) return fr;
    fr.append(el('h3', { className: cls, textContent: title + ' (' + items.length + ')' }));
    const ul = el('ul'); items.slice(0, 30).forEach((c) => ul.append(el('li', { textContent: c })));
    if (items.length > 30) ul.append(el('li', { textContent: '\u2026 and ' + (items.length - 30) + ' more' }));
    fr.append(ul); return fr;
  };
  const busy = async (btn, label, fn) => { const o = btn.textContent; btn.disabled = true; btn.textContent = label; try { return await fn(); } finally { btn.disabled = false; btn.textContent = o; } };

  $('#btn-publish').addEventListener('click', () => { $('#review').hidden = true; if (!sf('owner').value) $('#conn').open = true; $('#dlg-publish').showModal(); });

  $('#btn-pull').addEventListener('click', async () => {
    const s = settings(); if (!needRepo(s)) return;
    if (st.unpushed && !(await confirmDlg('Replace your list?', 'You have changes that are not pushed. Pulling replaces the whole list with the version on GitHub.', 'Pull and replace', true))) return;
    try {
      await busy($('#btn-pull'), 'Pulling\u2026', async () => {
        const remote = await fetchRemote(s);
        setData(JSON.parse(remote.raw)); st.sha = remote.sha; st.unpushed = false; render(); queueSave();
        $('#dlg-publish').close(); toast('Pulled ' + st.raw.length + ' videos from GitHub');
      });
    } catch (err) { toast(err.message, 'err'); }
  });

  $('#btn-check').addEventListener('click', async () => {
    const s = settings(); if (!needRepo(s)) return;
    if (!s.token) { $('#conn').open = true; sf('token').focus(); toast('Enter your GitHub token first.', 'err'); return; }
    try {
      await busy($('#btn-check'), 'Checking\u2026', async () => {
        let remote = null;
        try { remote = await fetchRemote(s); } catch (err) { if (err.status !== 404) throw err; }
        const d = diffLists(remote ? remoteList(remote.raw) : [], st.raw);
        if (remote && d.added.length + d.edited.length + d.removed.length === 0) { toast('Nothing to push. GitHub already matches your list.'); return; }
        st.pending = { sha: remote ? remote.sha : null };
        $('#rv-sub').textContent = (remote ? 'Compared with ' + s.branch + ':' + s.path + ' on GitHub.' : 'This file does not exist on GitHub yet and will be created.') + ' After the push the site will have ' + st.raw.length + ' entries.';
        $('#rv-diff').replaceChildren(diffGroup('Added', 'add', d.added), diffGroup('Edited', 'edit', d.edited), diffGroup('Removed', 'del', d.removed));
        const notes = []; const hidden = st.raw.filter((o) => problemsOf(o).length).length;
        if (hidden) notes.push(hidden + ' entries are hidden from the site because required fields are missing. They are still pushed.');
        if (remote && st.sha && remote.sha !== st.sha) notes.push('The file on GitHub changed after you pulled it. The lists above are compared with its current version.');
        const w = $('#rv-warn'); w.textContent = notes.join(' '); w.hidden = notes.length === 0;
        const parts = [d.added.length && 'add ' + d.added.length, d.edited.length && 'edit ' + d.edited.length, d.removed.length && 'remove ' + d.removed.length].filter(Boolean);
        $('#rv-msg').value = parts.length ? parts.join(', ').replace(/^./, (c) => c.toUpperCase()) + ' video(s)' : 'Update videos';
        $('#review').hidden = false; $('#rv-msg').focus();
      });
    } catch (err) { toast(err.message, 'err'); }
  });

  $('#btn-push').addEventListener('click', async () => {
    const s = settings();
    try {
      await busy($('#btn-push'), 'Pushing\u2026', async () => {
        const body = { message: $('#rv-msg').value.trim() || 'Update videos', content: toB64(serialize()), branch: s.branch };
        if (st.pending && st.pending.sha) body.sha = st.pending.sha;
        const out = await (await gh(repoPath(s), { method: 'PUT', body: JSON.stringify(body) })).json();
        st.sha = out.content.sha; st.unpushed = false; setStatus(); $('#dlg-publish').close();
        toast('', '', { html: 'Pushed. <a href="' + out.commit.html_url + '" target="_blank" rel="noopener">View commit</a>. GitHub Pages updates in 1\u20132 minutes.' });
      });
    } catch (err) { toast(err.message, 'err'); }
  });

  const download = () => {
    const a = el('a', { href: URL.createObjectURL(new Blob([serialize()], { type: 'application/json' })), download: 'url.json' });
    a.click(); URL.revokeObjectURL(a.href);
  };
  $('#btn-download').addEventListener('click', download);
  $('#btn-download2').addEventListener('click', download);
  window.addEventListener('beforeunload', (ev) => { if (st.timer || st.running || (!st.saveOn && st.unpushed)) { ev.preventDefault(); ev.returnValue = ''; } });

  // ---------- start ----------
  (async () => {
    try {
      const res = await fetch('url.json?t=' + Date.now(), { cache: 'no-store' });
      if (res.ok) setData(await res.json()); else if (res.status !== 404) throw new Error('HTTP ' + res.status);
    } catch (err) { toast('Could not load url.json (' + err.message + '). Open this page through server.py, or pull from GitHub.', 'err'); }
    render();
    fetch('__admin/ping', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : Promise.reject())).then((j) => { st.saveOn = !!j.ok; st.file = j.file || 'url.json'; setStatus(); }).catch(() => {});
  })();
})();
</script>
</body>
</html>
