<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#fff4f8" />
<title>Galeri SB99</title>
<script>
  /* Apply the saved theme before the first paint (prevents a light flash in dark mode).
     The storage key and colors must match THEME_KEY / THEME_COLORS in the main script. */
  (function () {
    var theme = 'light';
    try { if (localStorage.getItem('sb99-theme') === 'dark') theme = 'dark'; } catch (e) { /* storage blocked */ }
    document.documentElement.dataset.theme = theme;
    if (theme === 'dark') document.querySelector('meta[name="theme-color"]').content = '#2a1421';
  })();
</script>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ================= Design tokens =================
     Palette is taken from the "Property of SB99" sticker:
     candy pink fills, a deep raspberry outline, soft cream background. */
  :root {
    color-scheme: light;

    --gap: 16px;
    --radius: 14px;

    --cream:     #fff4f8;   /* page background */
    --pink-100:  #ffe1ec;   /* soft fills, hover */
    --pink-200:  #ffc9dc;   /* dots, image placeholder */
    --pink:      #ff74a8;   /* main brand pink (SB99 letters) */
    --outline:   #8e1a4a;   /* raspberry outline */
    --ink:       #4a0f2b;   /* text */
    --ink-muted: #8a4a66;   /* secondary text */

    --surface:   #fff;      /* buttons and cards */
    --bar:       #fff4f8;   /* navbar + footer background */
    --backing:   #ff74a8;   /* hard offset "backing" shadow of every sticker */
    --frame:     #fff4f8;   /* ring around the lightbox image */
    --on-pink:   #4a0f2b;   /* text and icons on a pink fill (same in both themes) */

    --overlay:   rgba(52, 10, 32, .93);

    --nav-h:     60px;      /* height of the fixed navbar (safe area is added on top) */
    --footer-h:  44px;      /* height of the fixed footer (safe area is added on top) */

    --font: "Fredoka", ui-rounded, "SF Pro Rounded", "Varela Round", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    /* sticker look: outline ring + hard offset "backing" (no blur anywhere) */
    --tile-shadow:       0 0 0 3px var(--outline), 5px 6px 0 3px var(--backing);
    --tile-shadow-hover: 0 0 0 3px var(--outline), 8px 9px 0 3px var(--backing);
  }

  /* Dark theme: same sticker look, inverted. Light pink outline, raspberry backing, plum paper. */
  :root[data-theme="dark"] {
    color-scheme: dark;

    --cream:     #1f1019;
    --pink-100:  #3b1b2c;
    --pink-200:  #44203a;
    --outline:   #ffb8d2;
    --ink:       #ffe8f1;
    --ink-muted: #d9a0ba;

    --surface:   #2c1523;
    --bar:       #2a1421;
    --backing:   #b32a66;
    --frame:     #ffd6e5;

    --overlay:   rgba(12, 4, 9, .94);
  }

  @media (max-width: 600px) {
    :root {
      --gap: 12px;
      --radius: 12px;
      --nav-h: 54px;
      --footer-h: 40px;
    }
  }

  /* ================= Base ================= */
  *,
  *::before,
  *::after { box-sizing: border-box; }

  [hidden] { display: none !important; }

  html {
    background: var(--cream);
    /* prevent layout shift when the scrollbar disappears (lightbox open) */
    scrollbar-gutter: stable;
    scrollbar-color: var(--pink) var(--pink-100);
  }

  html,
  body {
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    color: var(--ink);
    font-family: var(--font);
    font-weight: 500;
    -webkit-font-smoothing: antialiased;
    /* keep the content clear of the fixed navbar and footer */
    padding-top: calc(var(--nav-h) + env(safe-area-inset-top));
    padding-bottom: calc(var(--footer-h) + env(safe-area-inset-bottom));
  }

  /* staggered polka dots, flat and quiet */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-image:
      radial-gradient(var(--pink-200) 2px, transparent 2.5px),
      radial-gradient(var(--pink-200) 2px, transparent 2.5px);
    background-size: 28px 28px;
    background-position: 0 0, 14px 14px;
  }

  ::selection {
    background: var(--pink);
    color: var(--on-pink);
  }

  body.no-scroll { overflow: hidden; }

  /* ================= Icon sprite (see <symbol> list in the HTML) ================= */
  .ico-line  { stroke: var(--outline); stroke-linejoin: round; stroke-linecap: round; }
  .ico-pink  { fill: var(--pink); }
  .ico-none  { fill: none; }

  /* ================= Navbar (fixed top, same sticker style as the footer) ================= */
  .site-nav {
    position: fixed;
    top: 0;
    right: 0;
    left: 0;
    z-index: 35;
    display: flex;
    align-items: center;
    gap: 12px;
    height: calc(var(--nav-h) + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) max(var(--gap), env(safe-area-inset-right)) 0 max(var(--gap), env(safe-area-inset-left));
    background: var(--bar);
    border-bottom: 3px solid var(--outline);
    box-shadow: 0 4px 0 var(--backing);
  }

  .nav-menu {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .nav-link {
    display: inline-flex;
    align-items: center;
    height: 42px;
    padding: 0 16px;
    border: 2.5px solid transparent;
    border-radius: 14px;
    color: var(--ink);
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: background .1s ease, border-color .1s ease, transform .1s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .nav-link:hover {
    background: var(--pink-100);
    border-color: var(--outline);
  }

  .nav-link:active { transform: translateY(2px); }
  .nav-link:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  .nav-link[aria-current="page"] {
    background: var(--pink);
    border-color: var(--outline);
    box-shadow: 0 3px 0 var(--outline);
    color: var(--on-pink);
  }

  /* square sticker buttons (hamburger + theme toggle) */
  .nav-btn {
    display: inline-flex;
    flex: none;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 2.5px solid var(--outline);
    border-radius: 14px;
    background: var(--surface);
    box-shadow: 0 3px 0 var(--outline);
    color: var(--outline);
    cursor: pointer;
    transition: transform .1s ease, box-shadow .1s ease, background .1s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .nav-btn:hover { background: var(--pink-100); }

  .nav-btn:active {
    transform: translateY(3px);
    box-shadow: 0 0 0 var(--outline);
  }

  .nav-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  .nav-btn svg { display: block; }

  .nav-toggle { display: none; }          /* hamburger: small screens only */
  .nav-toggle .icon-x { display: none; }
  .site-nav.is-open .nav-toggle .icon-burger { display: none; }
  .site-nav.is-open .nav-toggle .icon-x { display: block; }

  .theme-toggle { margin-left: auto; }    /* pinned to the right corner */
  .theme-toggle .icon-sun { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }

  /* small screens: hamburger on the left, links in a dropdown panel under it */
  @media (max-width: 720px) {
    .nav-toggle { display: inline-flex; }

    .nav-menu {
      position: fixed;
      top: calc(var(--nav-h) + env(safe-area-inset-top) + 14px);
      left: max(var(--gap), env(safe-area-inset-left));
      z-index: 36;
      display: none;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
      width: min(260px, calc(100vw - 2 * var(--gap)));
      padding: 10px;
      background: var(--bar);
      border: 3px solid var(--outline);
      border-radius: 18px;
      box-shadow: 5px 6px 0 var(--backing);
      transform-origin: top left;
    }

    .site-nav.is-open .nav-menu {
      display: flex;
      animation: menu-pop .22s cubic-bezier(.34, 1.56, .64, 1) backwards;
    }

    .nav-link {
      height: 48px;
      font-size: 16px;
    }
  }

  @keyframes menu-pop {
    from {
      opacity: 0;
      transform: translateY(-6px) scale(.94);
    }
  }

  /* visible to screen readers and search engines only */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ================= Footer (fixed) ================= */
  .site-footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    height: calc(var(--footer-h) + env(safe-area-inset-bottom));
    padding: 0 var(--gap) env(safe-area-inset-bottom);
    background: var(--bar);
    border-top: 3px solid var(--outline);
    box-shadow: 0 -4px 0 var(--backing);
  }

  .footer-text {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    color: var(--ink);
    font-size: 13px;
    font-weight: 600;
  }

  .footer-heart {
    flex: none;
    width: 16px;
    height: auto;
  }

  /* ================= Loading bar ================= */
  .progress {
    position: fixed;
    top: calc(var(--nav-h) + env(safe-area-inset-top));
    left: 0;
    right: 0;
    z-index: 40;
    height: 5px;
    overflow: hidden;
    background: var(--pink-100);
    pointer-events: none;
  }

  .progress::before {
    content: "";
    position: absolute;
    inset: 0;
    width: 35%;
    border-radius: 0 5px 5px 0;
    background: var(--pink);
    animation: progress-slide 1.1s ease-in-out infinite;
  }

  @keyframes progress-slide {
    from { transform: translateX(-100%); }
    to   { transform: translateX(290%); }
  }

  /* ================= Gallery (masonry) ================= */
  #gallery {
    display: flex;
    align-items: flex-start;
    gap: var(--gap);
    width: 100%;
    padding: var(--gap);
  }

  .col {
    display: flex;
    flex: 1 1 0;
    flex-direction: column;
    gap: var(--gap);
    min-width: 0;
  }

  /* ================= Tile (sticker) ================= */
  .tile {
    position: relative;
    display: block;
    flex: 0 0 auto;
    margin: 0;
    overflow: hidden;
    background: var(--pink-200);
    border-radius: var(--radius);
    box-shadow: var(--tile-shadow);
    outline: none;
    cursor: zoom-in;
    /* "backwards": the animation must not keep holding `transform` after it ends,
       otherwise the hover lift below would be overridden */
    animation: tile-pop .5s cubic-bezier(.34, 1.56, .64, 1) backwards;
    transition: transform .16s ease, box-shadow .16s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .tile img,
  .tile video {
    display: block;
    width: 100%;
    height: auto; /* aspect ratio comes from the img width/height attributes */
    background: var(--pink-200);
    border-radius: inherit;
  }

  /* the video cover is only a still frame: clicks go to the tile, not the <video> */
  .tile video { pointer-events: none; }

  /* "Image" / "Video" label on every cover */
  .badge {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 1;
    padding: 5px 10px;
    border: 2px solid var(--outline);
    border-radius: 999px;
    background: var(--bar);
    box-shadow: 0 2px 0 var(--outline);
    color: var(--ink);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .07em;
    line-height: 1;
    text-transform: uppercase;
    pointer-events: none;
  }

  .badge-video {
    background: var(--pink);
    color: var(--on-pink);
  }

  /* round play button in the middle of a video cover */
  .play {
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 1;
    display: grid;
    place-items: center;
    width: 54px;
    height: 54px;
    transform: translate(-50%, -50%);
    border: 3px solid var(--outline);
    border-radius: 50%;
    background: var(--pink);
    box-shadow: 0 4px 0 var(--outline);
    color: var(--on-pink);
    pointer-events: none;
  }

  .play svg { margin-left: 3px; } /* a triangle looks centered when nudged right */

  @media (hover: hover) {
    .tile:hover {
      transform: translate(-2px, -3px);
      box-shadow: var(--tile-shadow-hover);
    }
  }

  .tile:active { transform: translate(2px, 3px); box-shadow: 0 0 0 3px var(--outline), 2px 3px 0 3px var(--backing); }

  .tile:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 6px;
  }

  @keyframes tile-pop {
    from {
      opacity: 0;
      transform: translateY(10px) scale(.92);
    }
  }

  /* ================= Category filter ================= */
  .filters {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    padding: 22px var(--gap) 6px;
  }

  .filter-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 44px;
    padding: 0 12px 0 18px;
    border: 2.5px solid var(--outline);
    border-radius: 14px;
    background: var(--surface);
    box-shadow: 0 3px 0 var(--outline);
    color: var(--ink);
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .1s ease, box-shadow .1s ease, background .1s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .filter-btn:hover {
    background: var(--pink-100);
    transform: translateY(-1px);
    box-shadow: 0 4px 0 var(--outline);
  }

  .filter-btn:active {
    transform: translateY(3px);
    box-shadow: 0 0 0 var(--outline);
  }

  .filter-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  /* selected category (declared after :hover so it wins) */
  .filter-btn[aria-pressed="true"] {
    background: var(--pink);
    color: var(--on-pink);
  }

  .filter-count {
    min-width: 28px;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--pink-100);
    color: var(--ink);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    line-height: 1.25;
    text-align: center;
  }

  .filter-btn[aria-pressed="true"] .filter-count { background: var(--surface); }

  /* ================= Pagination ================= */
  .pagination {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 28px var(--gap) 36px;
  }

  .page-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }

  .page-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 44px;
    height: 44px;
    padding: 0 16px;
    border: 2.5px solid var(--outline);
    border-radius: 14px;
    background: var(--surface);
    box-shadow: 0 3px 0 var(--outline);
    color: var(--ink);
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    text-decoration: none;
    transition: transform .1s ease, box-shadow .1s ease, background .1s ease;
    -webkit-tap-highlight-color: transparent;
  }

  a.page-btn:hover {
    background: var(--pink-100);
    transform: translateY(-1px);
    box-shadow: 0 4px 0 var(--outline);
  }

  /* pressed: the button sinks into its own shadow */
  a.page-btn:active {
    transform: translateY(3px);
    box-shadow: 0 0 0 var(--outline);
  }

  a.page-btn:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 3px;
  }

  .page-btn[aria-current="page"] {
    color: var(--on-pink);
    background: var(--pink);
  }

  .page-btn[aria-disabled="true"] {
    background: var(--pink-100);
    opacity: .5;
    pointer-events: none;
  }

  .page-gap {
    align-self: center;
    min-width: 22px;
    color: var(--ink-muted);
    font-weight: 600;
    text-align: center;
  }

  .page-info {
    margin: 0;
    color: var(--ink-muted);
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }

  /* ================= Lightbox ================= */
  #lightbox {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(14px, 4vmin, 48px);
    background: var(--overlay);
    outline: none;
    cursor: zoom-out;
    overscroll-behavior: contain;
    container-type: size; /* lets the image use cqw/cqh units (see .lb-stage img) */
  }

  /* wide screens: reserve room on both sides so the arrows sit beside the image */
  @media (min-width: 700px) {
    #lightbox { padding-inline: 84px; }
  }

  /* wrapper that shrink-wraps the image exactly */
  .lb-stage {
    position: relative;
    display: flex;
    cursor: default;
  }

  .lb-stage img,
  .lb-stage video {
    display: block;
    width: auto;
    height: auto;
    /* limit = content box of the lightbox (inside its padding).
       Percentages do not work here: the wrapper height is "auto",
       so max-height: 100% would be ignored. */
    max-width: 100cqw;
    max-height: 100cqh;
    object-fit: contain;
    border-radius: 12px;
    box-shadow: 0 0 0 4px var(--frame), 8px 9px 0 4px var(--backing);
  }

  .lb-stage video { background: #000; }

  /* videos have their own controls along the bottom, so the download button moves to the top */
  .lb-stage.is-video .lb-download {
    top: 12px;
    bottom: auto;
  }

  /* round buttons (download, close, prev, next) */
  .lb-btn {
    z-index: 2;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 46px;
    padding: 0;
    border: 2.5px solid var(--outline);
    border-radius: 50%;
    background: var(--bar);
    box-shadow: 0 3px 0 var(--outline);
    color: var(--outline);
    cursor: pointer;
    transition: transform .1s ease, box-shadow .1s ease, background .1s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .lb-btn:hover { background: var(--pink-100); }

  .lb-btn:active {
    transform: translateY(3px);
    box-shadow: 0 0 0 var(--outline);
  }

  .lb-btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .lb-btn[aria-busy="true"] { opacity: .55; cursor: progress; }

  /* download: inside the image, bottom-right corner */
  .lb-download {
    position: absolute;
    right: 12px;
    bottom: 12px;
    background: var(--pink);
    color: var(--on-pink);
  }

  .lb-download:hover { background: #ff8db7; }

  /* close: top-right corner of the screen (important on mobile) */
  .lb-close {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
  }

  /* prev / next: vertically centered on the left and right edges */
  .lb-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
  }

  .lb-nav:active { transform: translateY(calc(-50% + 3px)); }

  .lb-prev { left: max(14px, env(safe-area-inset-left)); }
  .lb-next { right: max(14px, env(safe-area-inset-right)); }

  /* "3 / 30" counter, top-left corner */
  .lb-counter {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    left: max(14px, env(safe-area-inset-left));
    z-index: 2;
    padding: 11px 16px;
    border: 2.5px solid var(--outline);
    border-radius: 999px;
    background: var(--bar);
    box-shadow: 0 3px 0 var(--outline);
    color: var(--ink);
    font-size: 14px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    pointer-events: none;
  }

  /* ================= Error / info message ================= */
  .message {
    width: min(560px, calc(100% - 2 * var(--gap)));
    margin: 6vh auto 0;
    padding: 24px 26px;
    background: var(--surface);
    border: 3px solid var(--outline);
    border-radius: 20px;
    box-shadow: 6px 7px 0 var(--backing);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.75;
    text-align: center;
  }

  .message code {
    display: inline-block;
    padding: 1px 8px;
    background: var(--pink-100);
    border: 1.5px solid var(--outline);
    border-radius: 8px;
    color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
  }

  @media (prefers-reduced-motion: reduce) {
    .tile,
    .page-btn,
    .filter-btn,
    .nav-btn,
    .nav-link,
    .lb-btn { transition: none; }

    .tile,
    .site-nav.is-open .nav-menu { animation: none; }
    .progress::before { animation-duration: 2.4s; }
  }
</style>
</head>
<body>

<!-- Icon sprite: drawn once, reused with <use href="#id"> (colors come from the .ico-* classes) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-heart" viewBox="-1.5 -1.5 27 25">
      <path class="ico-pink ico-line" stroke-width="2"
            d="M12 20.5S2 14 2 7.8C2 4.6 4.4 2.5 7.2 2.5c2 0 3.6 1.1 4.8 2.9 1.2-1.8 2.8-2.9 4.8-2.9 2.8 0 5.2 2.1 5.2 5.3C22 14 12 20.5 12 20.5z"/>
      <path class="ico-none" stroke="#fff6fa" stroke-width="1.6" stroke-linecap="round" d="M6 7.5c.4-1.4 1.4-2 2.6-2"/>
    </symbol>
  </defs>
</svg>

<script>
(() => {
  'use strict';

  /* ==========================================================
   * Configuration
   * ========================================================== */
  const CONFIG = Object.freeze({
    urlListFile:  'url.txt',
    perPage:      30,      // images per page; a new page is created when this is full
    minColWidth:  250,     // ideal column width (px), drives the column count
    minCols:      2,
    maxCols:      9,
    concurrency:  6,       // simultaneous image loads
    fetchTimeout: 10000,   // ms, for url.txt
    imageTimeout: 15000,   // ms, per preview image
    videoTimeout: 20000,   // ms, per video (waiting for its first frame)
    maxVideoBlob: 150 * 1024 * 1024, // bytes; larger videos open in a new tab instead of downloading through memory
    swipeDistance: 50      // px, minimum horizontal swipe to change image
  });

  /* Static strings only (safe to render with innerHTML: no user input). */
  const MESSAGES = Object.freeze({
    fetchFailed:
      'Could not load <code>url.txt</code>.<br>' +
      'If you opened this file via <code>file://</code> (double-click), ' +
      'the browser blocks <code>fetch()</code>. Serve it from localhost instead:<br><br>' +
      '<code>python3 -m http.server 8000</code><br>' +
      'then open <code>http://localhost:8000</code>',
    noUrls:
      '<code>url.txt</code> contains no valid URLs.<br>' +
      'One entry per line:<br>' +
      '<code>image_preview_url download_url</code> for an image<br>' +
      '<code>video_url</code> for a video (.mp4, .webm, .mov &hellip;)',
    emptyType:
      'Nothing in this category yet.',
    allFailed:
      'All items on this page failed to load. Check <code>url.txt</code> &mdash; every URL must ' +
      'point directly to an image or video file (not a web page) and be publicly accessible.'
  });

  const EXTENSION_BY_MIME = Object.freeze({
    'image/jpeg':    'jpg',
    'image/png':     'png',
    'image/webp':    'webp',
    'image/gif':     'gif',
    'image/avif':    'avif',
    'image/bmp':     'bmp',
    'image/svg+xml': 'svg',
    'video/mp4':     'mp4',
    'video/webm':    'webm',
    'video/ogg':     'ogv',
    'video/quicktime': 'mov',
    'video/x-matroska': 'mkv'
  });

  /* A URL whose path ends like this is treated as a video (query string and #hash are ignored). */
  const VIDEO_PATH = /\.(mp4|m4v|webm|ogv|ogg|mov|mkv)$/i;

  const FILTERS = Object.freeze(['all', 'image', 'video']);

  const PAGE_PARAM = 'page';
  const TYPE_PARAM = 'type';
  const BASE_TITLE = document.title;

  /* ==========================================================
   * DOM elements
   * ========================================================== */
  const gallery     = document.getElementById('gallery');
  const progressBar = document.getElementById('progress');
  const messageEl   = document.getElementById('message');
  const pagination  = document.getElementById('pagination');
  const pageList    = document.getElementById('page-list');
  const pageInfo    = document.getElementById('page-info');
  const yearEl      = document.getElementById('year');
  const lightbox    = document.getElementById('lightbox');
  const lightboxImg = lightbox.querySelector('.lb-stage img');
  const lbClose     = document.getElementById('lb-close');
  const lbPrev      = document.getElementById('lb-prev');
  const lbNext      = document.getElementById('lb-next');
  const lbCounter   = document.getElementById('lb-counter');
  const lbDownload  = document.getElementById('lb-download');
  const siteNav     = document.getElementById('site-nav');
  const navToggle   = document.getElementById('nav-toggle');
  const navMenu     = document.getElementById('nav-menu');
  const themeToggle = document.getElementById('theme-toggle');
  const siteFooter  = document.querySelector('.site-footer');
  const themeColorMeta = document.querySelector('meta[name="theme-color"]');
  const filterBar   = document.getElementById('filters');
  const filterButtons = [...filterBar.querySelectorAll('.filter-btn')];
  const lbStage     = lightbox.querySelector('.lb-stage');
  const lightboxVideo = document.getElementById('lb-video');

  /* ==========================================================
   * State
   * ========================================================== */
  const state = {
    allEntries: [],    // every entry of url.txt, in file order: { type, preview, download }
    entries: [],       // entries of the selected category (this is what gets paginated)
    filter: 'all',     // 'all' | 'image' | 'video'
    counts: { all: 0, image: 0, video: 0 },
    page: 0,           // current page (1-based); 0 = nothing rendered yet
    totalPages: 1,
    pageEntries: [],   // entries of the current page
    loadToken: 0,      // bumped on every page render; results from older renders are discarded

    items: [],         // loaded tiles of the current page: { el, ratio, col, index, preview, download }
    columns: [],       // .col elements
    heights: [],       // estimated height of each column
    colWidth: 1,
    gap: 10,
    galleryWidth: 0,

    activeItem: null   // item currently shown in the lightbox
  };

  const itemByElement = new WeakMap(); // tile element -> item

  /* ==========================================================
   * General utilities
   * ========================================================== */
  const clamp = (n, min, max) => Math.max(min, Math.min(max, n));

  const isHttpUrl = (value) => {
    try {
      const { protocol } = new URL(value);
      return protocol === 'http:' || protocol === 'https:';
    } catch {
      return false;
    }
  };

  const isVideoUrl = (value) => {
    try {
      return VIDEO_PATH.test(new URL(value).pathname);
    } catch {
      return false;
    }
  };

  /**
   * Parses url.txt. One entry per line.
   *
   *   image:  <preview_url> <download_url>     (separated by whitespace or "|")
   *   video:  <video_url>                      (a single URL, used for cover, player and download)
   *
   * - A video is recognised by its file extension (.mp4, .webm, .mov ...).
   *   For a URL without an extension, start the line with the word "video" or "image":
   *       video https://cdn.example.com/stream/123
   * - The image download URL is optional; if missing or invalid, the preview URL is used.
   * - Blank lines and lines starting with "#" are ignored.
   * - Duplicate first URLs are dropped.
   * - The order of the file is kept, so every page is stable across refreshes.
   */
  const parseEntries = (text) => {
    const entries = new Map();

    for (const rawLine of text.split(/\r?\n/)) {
      const line = rawLine.trim();
      if (!line || line.startsWith('#')) continue;

      const tokens = line.split(/[\s|]+/).filter(Boolean);
      const forced = /^(image|video)$/i.test(tokens[0]) ? tokens.shift().toLowerCase() : null;
      const [first, second] = tokens;
      if (!isHttpUrl(first) || entries.has(first)) continue;

      const type = forced || (isVideoUrl(first) ? 'video' : 'image');

      entries.set(first, {
        type,
        preview: first,
        download: type === 'video' || !isHttpUrl(second) ? first : second
      });
    }

    return [...entries.values()];
  };

  const fetchWithTimeout = async (url, timeoutMs) => {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      return await fetch(url, { cache: 'no-cache', signal: controller.signal });
    } finally {
      clearTimeout(timer);
    }
  };

  /** Runs `worker` for every item with at most `limit` running in parallel. */
  const runPool = async (list, limit, worker) => {
    let cursor = 0;
    const run = async () => {
      while (cursor < list.length) {
        const item = list[cursor++];
        try {
          await worker(item);
        } catch {
          /* one failing item must not stop the others */
        }
      }
    };
    await Promise.all(Array.from({ length: Math.min(limit, list.length) }, run));
  };

  const showMessage = (html) => {
    messageEl.innerHTML = html;
    messageEl.hidden = false;
  };

  const setLoading = (isLoading) => {
    progressBar.hidden = !isLoading;
    gallery.setAttribute('aria-busy', String(isLoading));
  };

  /* ==========================================================
   * Masonry layout
   * ========================================================== */
  const readGap = () => {
    const value = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap'));
    return Number.isFinite(value) ? value : 10;
  };

  const columnCountFor = (width) =>
    clamp(Math.round(width / CONFIG.minColWidth), CONFIG.minCols, CONFIG.maxCols);

  const measureColumnWidth = (count, gap) => {
    const style = getComputedStyle(gallery);
    const padding = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
    const inner = gallery.clientWidth - padding;
    return Math.max(1, (inner - gap * (count - 1)) / count);
  };

  const itemHeight = (item) => state.colWidth / item.ratio;

  const shortestColumnIndex = () => state.heights.indexOf(Math.min(...state.heights));

  const addToColumn = (item, index) => {
    const column = state.columns[index];
    if (column.childElementCount > 0) state.heights[index] += state.gap;
    state.heights[index] += itemHeight(item);
    item.col = index;
    column.appendChild(item.el);
  };

  const place = (item) => addToColumn(item, shortestColumnIndex());

  /** Re-reads the gap, column width and gallery width. */
  const syncMetrics = (columnCount) => {
    state.gap = readGap();
    state.colWidth = measureColumnWidth(columnCount, state.gap);
    state.galleryWidth = gallery.clientWidth;
  };

  /** Rebuilds every column and re-places all tiles (used on a new page or when the column count changes). */
  const rebuildLayout = () => {
    const count = columnCountFor(gallery.clientWidth);

    state.columns = Array.from({ length: count }, () => {
      const column = document.createElement('div');
      column.className = 'col';
      return column;
    });
    state.heights = new Array(count).fill(0);
    syncMetrics(count);

    state.items.forEach((item) => place(item));

    // single replace -> no empty frame, scroll position stays intact
    gallery.replaceChildren(...state.columns);
  };

  /** Same column count, only the width changed: recompute height estimates without moving tiles. */
  const refreshMetrics = () => {
    syncMetrics(state.columns.length);
    state.heights.fill(0);

    const hasItem = new Array(state.columns.length).fill(false);
    for (const item of state.items) {
      if (hasItem[item.col]) state.heights[item.col] += state.gap;
      hasItem[item.col] = true;
      state.heights[item.col] += itemHeight(item);
    }
  };

  const handleResize = () => {
    const width = gallery.clientWidth;
    if (width === state.galleryWidth) return; // height-only changes (e.g. mobile address bar) are ignored

    if (columnCountFor(width) !== state.columns.length) rebuildLayout();
    else refreshMetrics();
  };

  /* ==========================================================
   * Media loading (images and videos)
   * ========================================================== */
  /**
   * Loads the cover of one entry: the image itself, or the first frame of a video.
   * Resolves to the <img> / <video> element, or null on failure/timeout.
   */
  const loadMedia = (entry) => new Promise((resolve) => {
    const isVideo = entry.type === 'video';
    const el = isVideo ? document.createElement('video') : new Image();
    const dimensions = () => (isVideo
      ? { width: el.videoWidth, height: el.videoHeight }
      : { width: el.naturalWidth, height: el.naturalHeight });

    let frameTimer = 0;

    const settle = (loaded) => {
      clearTimeout(timer);
      clearTimeout(frameTimer);
      el.onload = el.onerror = el.onloadedmetadata = el.onloadeddata = null;

      const { width, height } = dimensions();
      const valid = loaded && width > 0 && height > 0;
      if (!valid) {
        el.removeAttribute('src'); // cancel a download that is still running
        if (isVideo) el.load();
      }
      resolve(valid ? el : null);
    };

    const timer = setTimeout(() => settle(false), isVideo ? CONFIG.videoTimeout : CONFIG.imageTimeout);
    el.onerror = () => settle(false);
    el.draggable = false;

    if (isVideo) {
      el.muted = true;
      el.setAttribute('muted', '');
      el.playsInline = true;
      el.preload = 'metadata';
      el.disablePictureInPicture = true;
      // some browsers never fire "loadeddata" without playback: accept the metadata after a short wait
      el.onloadedmetadata = () => { frameTimer = setTimeout(() => settle(true), 1500); };
      el.onloadeddata = () => settle(true);
      // "#t=0.1" makes the browser show a real frame instead of a black rectangle
      el.src = entry.preview + (entry.preview.includes('#') ? '' : '#t=0.1');
    } else {
      el.alt = '';
      el.decoding = 'async';
      el.referrerPolicy = 'no-referrer';
      el.onload = () => settle(true);
      el.src = entry.preview;
    }
  });

  const createBadge = (isVideo) => {
    const badge = document.createElement('span');
    badge.className = 'badge' + (isVideo ? ' badge-video' : '');
    badge.textContent = isVideo ? 'Video' : 'Image';
    return badge;
  };

  const createPlayIcon = () => {
    const icon = document.createElement('span');
    icon.className = 'play';
    icon.setAttribute('aria-hidden', 'true');
    icon.innerHTML =
      '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">' +
      '<path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
    return icon;
  };

  const createTile = (media, entry, index) => {
    const isVideo = entry.type === 'video';
    const width = isVideo ? media.videoWidth : media.naturalWidth;
    const height = isVideo ? media.videoHeight : media.naturalHeight;

    // intrinsic width/height -> the browser derives the aspect ratio (no layout shift)
    media.width = width;
    media.height = height;

    const el = document.createElement('figure');
    el.className = 'tile';
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', isVideo ? 'Play video' : 'Enlarge image');
    el.appendChild(media);
    el.appendChild(createBadge(isVideo));
    if (isVideo) el.appendChild(createPlayIcon());

    const item = {
      el,
      type: entry.type,
      ratio: width / height,
      col: -1,
      index,                      // position inside the page (url.txt order)
      preview: entry.preview,
      download: entry.download
    };
    itemByElement.set(el, item);
    return item;
  };

  /* ==========================================================
   * Category, pages & URL (?type=video&page=N)
   * ========================================================== */
  const getPageFromUrl = () => {
    const value = parseInt(new URLSearchParams(location.search).get(PAGE_PARAM), 10);
    return Number.isFinite(value) ? value : 1;
  };

  const getFilterFromUrl = () => {
    const value = new URLSearchParams(location.search).get(TYPE_PARAM);
    return FILTERS.includes(value) ? value : 'all';
  };

  /** Builds the URL for a view while keeping any other query parameters. Defaults get a clean URL. */
  const buildPageUrl = (page, filter = state.filter) => {
    const params = new URLSearchParams(location.search);
    if (page <= 1) params.delete(PAGE_PARAM);
    else params.set(PAGE_PARAM, String(page));
    if (filter === 'all') params.delete(TYPE_PARAM);
    else params.set(TYPE_PARAM, filter);

    const query = params.toString();
    return location.pathname + (query ? '?' + query : '') + location.hash;
  };

  /** Page numbers to display, with `null` marking a gap ("..."). Example: 1 2 ... 9 10 11 ... 19 20 */
  const buildPageList = (current, total) => {
    const wanted = new Set([1, 2, current - 1, current, current + 1, total - 1, total]);
    const pages = [...wanted].filter((p) => p >= 1 && p <= total).sort((a, b) => a - b);

    const result = [];
    pages.forEach((page, i) => {
      if (i > 0) {
        const diff = page - pages[i - 1];
        if (diff === 2) result.push(page - 1); // a single hidden page is shown instead of "..."
        else if (diff > 2) result.push(null);
      }
      result.push(page);
    });
    return result;
  };

  const createPageControl = ({ page, text, label, current = false, disabled = false }) => {
    const el = document.createElement(disabled ? 'span' : 'a');
    el.className = 'page-btn';
    el.textContent = text;
    if (label) el.setAttribute('aria-label', label);

    if (disabled) {
      el.setAttribute('aria-disabled', 'true');
      return el;
    }

    el.href = buildPageUrl(page); // real URL: middle-click / "open in new tab" works
    el.dataset.page = String(page);
    if (current) el.setAttribute('aria-current', 'page');
    return el;
  };

  const renderPagination = () => {
    const { page, totalPages } = state;

    pagination.hidden = totalPages <= 1;
    if (totalPages <= 1) return;

    const controls = [
      createPageControl({
        page: page - 1, text: 'Prev', label: 'Previous page', disabled: page === 1
      })
    ];

    for (const entry of buildPageList(page, totalPages)) {
      if (entry === null) {
        const gap = document.createElement('span');
        gap.className = 'page-gap';
        gap.setAttribute('aria-hidden', 'true');
        gap.textContent = '…';
        controls.push(gap);
      } else {
        controls.push(createPageControl({
          page: entry, text: String(entry), label: 'Page ' + entry, current: entry === page
        }));
      }
    }

    controls.push(createPageControl({
      page: page + 1, text: 'Next', label: 'Next page', disabled: page === totalPages
    }));

    pageList.replaceChildren(...controls);
    pageInfo.textContent =
      'Page ' + page + ' of ' + totalPages + ' · ' + state.entries.length + ' items';
  };

  const updateTitle = () => {
    document.title = state.page > 1 ? BASE_TITLE + ' - Page ' + state.page : BASE_TITLE;
  };

  /** Clears the gallery and loads every image of the current page. */
  const renderPage = async () => {
    const token = ++state.loadToken;
    if (isLightboxOpen()) closeLightbox();

    const start = (state.page - 1) * CONFIG.perPage;
    state.pageEntries = state.entries.slice(start, start + CONFIG.perPage);
    state.items = [];

    messageEl.hidden = true;
    rebuildLayout();
    renderPagination();
    updateTitle();
    window.scrollTo(0, 0);

    if (state.entries.length === 0) {
      setLoading(false);
      showMessage(MESSAGES.emptyType);
      return;
    }

    setLoading(true);

    const queue = state.pageEntries.map((entry, index) => ({ entry, index }));

    await runPool(queue, CONFIG.concurrency, async ({ entry, index }) => {
      if (token !== state.loadToken) return; // the user already moved to another page

      const media = await loadMedia(entry);
      if (!media || token !== state.loadToken) return;

      const item = createTile(media, entry, index);
      state.items.push(item);
      place(item);
    });

    if (token !== state.loadToken) return;

    setLoading(false);
    if (state.items.length === 0) showMessage(MESSAGES.allFailed);
  };

  const updateFilters = () => {
    for (const button of filterButtons) {
      const type = button.dataset.type;
      button.setAttribute('aria-pressed', String(type === state.filter));
      button.querySelector('.filter-count').textContent = String(state.counts[type]);
    }
  };

  /**
   * Shows one page of one category.
   * mode: 'push'    -> add a history entry (normal navigation, Back button works)
   *       'replace' -> rewrite the current history entry (first load: also fixes an invalid URL)
   *       'pop'     -> browser Back / Forward: the URL is already set, only normalise it
   */
  const showView = (filter, requestedPage, mode) => {
    const entries = state.allEntries.filter((entry) => filter === 'all' || entry.type === filter);
    const totalPages = Math.max(1, Math.ceil(entries.length / CONFIG.perPage));
    const page = clamp(requestedPage, 1, totalPages);

    if (mode !== 'replace' && filter === state.filter && page === state.page) return;

    state.filter = filter;
    state.entries = entries;
    state.totalPages = totalPages;
    state.page = page;

    const url = buildPageUrl(page, filter);
    if (mode === 'push') history.pushState(null, '', url);
    else history.replaceState(null, '', url);

    updateFilters();
    renderPage();
  };

  const goToPage = (page, mode) => showView(state.filter, page, mode);

  /** Browser Back / Forward. */
  const handlePopState = () => {
    if (state.allEntries.length === 0) return;
    showView(getFilterFromUrl(), getPageFromUrl(), 'pop');
  };

  /* ==========================================================
   * Download
   * ========================================================== */
  const buildFilename = (url, mimeType, type) => {
    let name = 'image';
    try {
      const last = new URL(url).pathname.split('/').filter(Boolean).pop();
      if (last) name = decodeURIComponent(last);
    } catch {
      /* fall back to the default name */
    }

    name = name.replace(/[\\/:*?"<>|]+/g, '_');
    if (!/\.[a-z0-9]{2,5}$/i.test(name)) {
      name += '.' + (EXTENSION_BY_MIME[mimeType] || (type === 'video' ? 'mp4' : 'jpg'));
    }
    return name;
  };

  const clickLink = (href, props) => {
    const a = document.createElement('a');
    Object.assign(a, props);
    a.href = href;
    document.body.appendChild(a);
    a.click();
    a.remove();
  };

  const downloadFile = async (url, type) => {
    try {
      const res = await fetch(url, { mode: 'cors', credentials: 'omit', referrerPolicy: 'no-referrer' });
      if (!res.ok) throw new Error('HTTP ' + res.status);

      // a huge video would have to sit in memory: let the browser handle it in a new tab instead
      if (type === 'video' && Number(res.headers.get('content-length')) > CONFIG.maxVideoBlob) {
        if (res.body) res.body.cancel();
        throw new Error('too large');
      }

      const blob = await res.blob();
      const objectUrl = URL.createObjectURL(blob);
      clickLink(objectUrl, { download: buildFilename(url, blob.type, type), rel: 'noopener' });
      setTimeout(() => URL.revokeObjectURL(objectUrl), 15000);
    } catch {
      // CORS blocked / network error / too large -> open the file in a new tab as a fallback
      clickLink(url, { target: '_blank', rel: 'noopener noreferrer' });
    }
  };

  /* ==========================================================
   * Navbar & theme
   * ========================================================== */
  const THEME_KEY = 'sb99-theme';
  const THEME_COLORS = Object.freeze({ light: '#fff4f8', dark: '#2a1421' });
  const MOBILE_NAV_QUERY = '(max-width: 720px)'; // keep in sync with the CSS breakpoint

  const currentTheme = () =>
    document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';

  /** Updates everything that depends on the active theme (button label, browser UI color). */
  const syncThemeControls = () => {
    const theme = currentTheme();
    themeToggle.setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
    themeColorMeta.content = THEME_COLORS[theme];
  };

  const setTheme = (theme) => {
    document.documentElement.dataset.theme = theme;
    try {
      localStorage.setItem(THEME_KEY, theme);
    } catch {
      /* storage blocked (private mode): the theme still works for this visit */
    }
    syncThemeControls();
  };

  const isMenuOpen = () => siteNav.classList.contains('is-open');

  const setMenuOpen = (open) => {
    siteNav.classList.toggle('is-open', open);
    navToggle.setAttribute('aria-expanded', String(open));
    navToggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  };

  const bindNavbar = () => {
    navToggle.addEventListener('click', () => setMenuOpen(!isMenuOpen()));
    themeToggle.addEventListener('click', () => setTheme(currentTheme() === 'dark' ? 'light' : 'dark'));

    navMenu.addEventListener('click', (event) => {
      const link = event.target instanceof Element ? event.target.closest('a') : null;
      if (!link) return;

      const plainClick = event.button === 0 && !event.metaKey && !event.ctrlKey && !event.shiftKey && !event.altKey;

      if (link.getAttribute('href') === '#') {
        event.preventDefault(); // placeholder page (About, Support Me): stay where we are
      } else if (link.hasAttribute('data-home') && plainClick && state.allEntries.length > 0) {
        event.preventDefault(); // Home: back to page 1 without a full reload
        if (state.filter === 'all' && state.page === 1) window.scrollTo({ top: 0, behavior: 'smooth' });
        else showView('all', 1, 'push');
      }

      setMenuOpen(false);
    });

    // tap outside the navbar / Escape closes the dropdown; leaving the small layout resets it.
    // Capture phase + stopPropagation: the outside tap only dismisses the menu, it does not
    // also open the image underneath.
    document.addEventListener('click', (event) => {
      if (!isMenuOpen() || siteNav.contains(event.target)) return;
      event.preventDefault();
      event.stopPropagation();
      setMenuOpen(false);
    }, true);

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && isMenuOpen()) {
        setMenuOpen(false);
        navToggle.focus();
      }
    });

    window.matchMedia(MOBILE_NAV_QUERY).addEventListener('change', () => setMenuOpen(false));
  };

  /* ==========================================================
   * Lightbox
   * ========================================================== */
  /** Everything behind the lightbox: keep keyboard focus and screen readers out of it. */
  const backgroundEls = [siteNav, filterBar, gallery, pagination, siteFooter];
  const setBackgroundInert = (inert) => backgroundEls.forEach((el) => { el.inert = inert; });

  let lastFocused = null;

  const isLightboxOpen = () => !lightbox.hidden;

  /** Loaded items of the current page in url.txt order (not in load-completion order). */
  const orderedItems = () => state.items.slice().sort((a, b) => a.index - b.index);

  const neighborOf = (item, offset) => {
    const list = orderedItems();
    return list[list.indexOf(item) + offset] || null;
  };

  const updateLightboxControls = () => {
    const item = state.activeItem;
    if (!item) return;

    lbPrev.hidden = !neighborOf(item, -1);
    lbNext.hidden = !neighborOf(item, 1);
    lbCounter.textContent = (item.index + 1) + ' / ' + state.pageEntries.length;

    // an arrow that just disappeared may have held the focus: keep it inside the dialog
    if (!lightbox.contains(document.activeElement)) lightbox.focus();
  };

  const stopVideo = () => {
    lightboxVideo.pause();
    lightboxVideo.removeAttribute('src');
    lightboxVideo.load();
  };

  const showItem = (item) => {
    const isVideo = item.type === 'video';

    state.activeItem = item;
    lbStage.classList.toggle('is-video', isVideo);
    lightboxImg.hidden = isVideo;
    lightboxVideo.hidden = !isVideo;

    if (isVideo) {
      lightboxImg.removeAttribute('src');
      lightboxVideo.src = item.preview;
      const playing = lightboxVideo.play();
      if (playing) playing.catch(() => { /* autoplay blocked: the controls still work */ });
    } else {
      stopVideo();
      lightboxImg.src = item.preview;
    }

    updateLightboxControls();
  };

  const showNeighbor = (offset) => {
    if (!state.activeItem) return;
    const next = neighborOf(state.activeItem, offset);
    if (next) showItem(next);
  };

  const openLightbox = (item) => {
    lastFocused = document.activeElement;
    lightbox.hidden = false;
    setMenuOpen(false);
    setBackgroundInert(true);
    document.body.classList.add('no-scroll');
    lightbox.focus();
    showItem(item);
  };

  const closeLightbox = () => {
    const returnTo = state.activeItem && state.activeItem.el.isConnected
      ? state.activeItem.el   // the tile of the image that was viewed last
      : lastFocused;

    lightbox.hidden = true;
    lightboxImg.removeAttribute('src');
    stopVideo();
    state.activeItem = null;
    setBackgroundInert(false);
    document.body.classList.remove('no-scroll');

    if (returnTo && typeof returnTo.focus === 'function') returnTo.focus();
    lastFocused = null;
  };

  const tileFromEvent = (event) =>
    event.target instanceof Element ? event.target.closest('.tile') : null;

  const openTile = (tile) => {
    const item = itemByElement.get(tile);
    if (item) openLightbox(item);
  };

  /* ==========================================================
   * Event binding
   * ========================================================== */
  const bindEvents = () => {
    bindNavbar();

    // click / keyboard on a tile -> open lightbox (event delegation)
    gallery.addEventListener('click', (event) => {
      const tile = tileFromEvent(event);
      if (tile) openTile(tile);
    });

    gallery.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      const tile = tileFromEvent(event);
      if (!tile) return;
      event.preventDefault();
      openTile(tile);
    });

    // pagination links: navigate without a full reload (modified clicks keep the default behavior)
    pagination.addEventListener('click', (event) => {
      const link = event.target instanceof Element ? event.target.closest('a[data-page]') : null;
      if (!link) return;
      if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;

      event.preventDefault();
      goToPage(Number(link.dataset.page), 'push');
    });

    // category buttons
    filterBar.addEventListener('click', (event) => {
      const button = event.target instanceof Element ? event.target.closest('.filter-btn') : null;
      if (button) showView(button.dataset.type, 1, 'push');
    });

    window.addEventListener('popstate', handlePopState);

    // dark area outside the image / close button -> close
    lightbox.addEventListener('click', (event) => {
      if (event.target === lightbox) closeLightbox();
    });
    lbClose.addEventListener('click', closeLightbox);

    // previous / next image
    lbPrev.addEventListener('click', () => showNeighbor(-1));
    lbNext.addEventListener('click', () => showNeighbor(1));

    // keyboard: Escape closes, arrow keys navigate
    document.addEventListener('keydown', (event) => {
      if (!isLightboxOpen() || event.altKey || event.ctrlKey || event.metaKey) return;

      // while the video player has focus, the arrow keys seek inside the video
      const onPlayer = event.target === lightboxVideo;

      if (event.key === 'Escape') closeLightbox();
      else if (event.key === 'ArrowLeft' && !onPlayer) showNeighbor(-1);
      else if (event.key === 'ArrowRight' && !onPlayer) showNeighbor(1);
    });

    // touch: swipe left = next image, swipe right = previous image
    let touchStart = null;

    lightbox.addEventListener('touchstart', (event) => {
      // a drag on the video's seek bar must not change the item
      touchStart = event.touches.length === 1 && event.target !== lightboxVideo
        ? { x: event.touches[0].clientX, y: event.touches[0].clientY }
        : null;
    }, { passive: true });

    lightbox.addEventListener('touchend', (event) => {
      if (!touchStart) return;

      const touch = event.changedTouches[0];
      const dx = touch.clientX - touchStart.x;
      const dy = touch.clientY - touchStart.y;
      touchStart = null;

      if (Math.abs(dx) >= CONFIG.swipeDistance && Math.abs(dx) > Math.abs(dy) * 1.5) {
        showNeighbor(dx < 0 ? 1 : -1);
      }
    }, { passive: true });

    // download button (saves the full-size URL, not the preview)
    lbDownload.addEventListener('click', async () => {
      const item = state.activeItem;
      if (!item || lbDownload.getAttribute('aria-busy') === 'true') return;

      lbDownload.setAttribute('aria-busy', 'true');
      try {
        await downloadFile(item.download, item.type);
      } finally {
        lbDownload.removeAttribute('aria-busy');
      }
    });

    // responsive layout: watch the gallery width (also catches scrollbar changes)
    new ResizeObserver(handleResize).observe(gallery);
  };

  /* ==========================================================
   * Init
   * ========================================================== */
  const loadEntries = async () => {
    const res = await fetchWithTimeout(CONFIG.urlListFile, CONFIG.fetchTimeout);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return parseEntries(await res.text());
  };

  const init = async () => {
    yearEl.textContent = String(new Date().getFullYear()); // footer copyright year
    syncThemeControls();

    // we restore the scroll position ourselves (always the top of a freshly loaded page)
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

    rebuildLayout();
    bindEvents();

    let entries;
    try {
      entries = await loadEntries();
    } catch {
      showMessage(MESSAGES.fetchFailed);
      return;
    }

    if (entries.length === 0) {
      showMessage(MESSAGES.noUrls);
      return;
    }

    state.allEntries = entries;
    state.counts = {
      all: entries.length,
      image: entries.filter((entry) => entry.type === 'image').length,
      video: entries.filter((entry) => entry.type === 'video').length
    };
    filterBar.hidden = false;

    // open the view from the URL (?type=video&page=N); 'replace' also cleans up invalid values
    showView(getFilterFromUrl(), getPageFromUrl(), 'replace');
  };

  init();
})();
</script>
</body>
</html>
