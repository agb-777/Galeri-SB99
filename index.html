<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#fff4f8" />
<title>Galeri SB99</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet" />
<style>
  /* ================= Design tokens =================
     Palette is taken from the "Property of SB99" sticker:
     candy pink fills, a deep raspberry outline, soft cream background. */
  :root {
    color-scheme: light;

    --gap: 16px;
    --radius: 14px;

    --cream:     #fff4f8;   /* page background */
    --pink-100:  #ffe1ec;   /* soft fills, hover */
    --pink-200:  #ffc9dc;   /* dots, image placeholder */
    --pink:      #ff74a8;   /* main brand pink (SB99 letters) */
    --outline:   #8e1a4a;   /* raspberry outline */
    --ink:       #4a0f2b;   /* text */
    --ink-muted: #8a4a66;   /* secondary text */

    --overlay:   rgba(52, 10, 32, .93);

    --font: "Fredoka", ui-rounded, "SF Pro Rounded", "Varela Round", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    /* sticker look: outline ring + hard offset "backing" (no blur anywhere) */
    --tile-shadow:       0 0 0 3px var(--outline), 5px 6px 0 3px var(--pink);
    --tile-shadow-hover: 0 0 0 3px var(--outline), 8px 9px 0 3px var(--pink);
  }

  @media (max-width: 600px) {
    :root {
      --gap: 12px;
      --radius: 12px;
    }
  }

  /* ================= Base ================= */
  *,
  *::before,
  *::after { box-sizing: border-box; }

  [hidden] { display: none !important; }

  html {
    background: var(--cream);
    /* prevent layout shift when the scrollbar disappears (lightbox open) */
    scrollbar-gutter: stable;
    scrollbar-color: var(--pink) var(--pink-100);
  }

  html,
  body {
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    color: var(--ink);
    font-family: var(--font);
    font-weight: 500;
    -webkit-font-smoothing: antialiased;
  }

  /* staggered polka dots, flat and quiet */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-image:
      radial-gradient(var(--pink-200) 2px, transparent 2.5px),
      radial-gradient(var(--pink-200) 2px, transparent 2.5px);
    background-size: 28px 28px;
    background-position: 0 0, 14px 14px;
  }

  ::selection {
    background: var(--pink);
    color: var(--ink);
  }

  body.no-scroll { overflow: hidden; }

  /* ================= Loading bar ================= */
  .progress {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 40;
    height: 5px;
    overflow: hidden;
    background: var(--pink-100);
    pointer-events: none;
  }

  .progress::before {
    content: "";
    position: absolute;
    inset: 0;
    width: 35%;
    border-radius: 0 5px 5px 0;
    background: var(--pink);
    animation: progress-slide 1.1s ease-in-out infinite;
  }

  @keyframes progress-slide {
    from { transform: translateX(-100%); }
    to   { transform: translateX(290%); }
  }

  /* ================= Gallery (masonry) ================= */
  #gallery {
    display: flex;
    align-items: flex-start;
    gap: var(--gap);
    width: 100%;
    padding: var(--gap);
  }

  .col {
    display: flex;
    flex: 1 1 0;
    flex-direction: column;
    gap: var(--gap);
    min-width: 0;
  }

  /* ================= Tile (sticker) ================= */
  .tile {
    display: block;
    flex: 0 0 auto;
    margin: 0;
    overflow: hidden;
    background: var(--pink-200);
    border-radius: var(--radius);
    box-shadow: var(--tile-shadow);
    outline: none;
    cursor: zoom-in;
    /* "backwards": the animation must not keep holding `transform` after it ends,
       otherwise the hover lift below would be overridden */
    animation: tile-pop .5s cubic-bezier(.34, 1.56, .64, 1) backwards;
    transition: transform .16s ease, box-shadow .16s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .tile img {
    display: block;
    width: 100%;
    height: auto; /* aspect ratio comes from the img width/height attributes */
    background: var(--pink-200);
    border-radius: inherit;
  }

  @media (hover: hover) {
    .tile:hover {
      transform: translate(-2px, -3px);
      box-shadow: var(--tile-shadow-hover);
    }
  }

  .tile:active { transform: translate(2px, 3px); box-shadow: 0 0 0 3px var(--outline), 2px 3px 0 3px var(--pink); }

  .tile:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 6px;
  }

  @keyframes tile-pop {
    from {
      opacity: 0;
      transform: translateY(10px) scale(.92);
    }
  }

  /* ================= Pagination ================= */
  .pagination {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 28px var(--gap) calc(48px + env(safe-area-inset-bottom));
  }

  .page-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }

  .page-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 44px;
    height: 44px;
    padding: 0 16px;
    border: 2.5px solid var(--outline);
    border-radius: 14px;
    background: #fff;
    box-shadow: 0 3px 0 var(--outline);
    color: var(--ink);
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    text-decoration: none;
    transition: transform .1s ease, box-shadow .1s ease, background .1s ease;
    -webkit-tap-highlight-color: transparent;
  }

  a.page-btn:hover {
    background: var(--pink-100);
    transform: translateY(-1px);
    box-shadow: 0 4px 0 var(--outline);
  }

  /* pressed: the button sinks into its own shadow */
  a.page-btn:active {
    transform: translateY(3px);
    box-shadow: 0 0 0 var(--outline);
  }

  a.page-btn:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 3px;
  }

  .page-btn[aria-current="page"] {
    background: var(--pink);
  }

  .page-btn[aria-disabled="true"] {
    background: var(--pink-100);
    opacity: .5;
    pointer-events: none;
  }

  .page-gap {
    align-self: center;
    min-width: 22px;
    color: var(--ink-muted);
    font-weight: 600;
    text-align: center;
  }

  .page-info {
    margin: 0;
    color: var(--ink-muted);
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }

  /* ================= Lightbox ================= */
  #lightbox {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(14px, 4vmin, 48px);
    background: var(--overlay);
    outline: none;
    cursor: zoom-out;
    overscroll-behavior: contain;
    container-type: size; /* lets the image use cqw/cqh units (see .lb-stage img) */
  }

  /* wide screens: reserve room on both sides so the arrows sit beside the image */
  @media (min-width: 700px) {
    #lightbox { padding-inline: 84px; }
  }

  /* wrapper that shrink-wraps the image exactly */
  .lb-stage {
    position: relative;
    display: flex;
    cursor: default;
  }

  .lb-stage img {
    display: block;
    width: auto;
    height: auto;
    /* limit = content box of the lightbox (inside its padding).
       Percentages do not work here: the wrapper height is "auto",
       so max-height: 100% would be ignored. */
    max-width: 100cqw;
    max-height: 100cqh;
    object-fit: contain;
    border-radius: 12px;
    box-shadow: 0 0 0 4px var(--cream), 8px 9px 0 4px var(--pink);
  }

  /* round buttons (download, close, prev, next) */
  .lb-btn {
    z-index: 2;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 46px;
    padding: 0;
    border: 2.5px solid var(--outline);
    border-radius: 50%;
    background: var(--cream);
    box-shadow: 0 3px 0 var(--outline);
    color: var(--outline);
    cursor: pointer;
    transition: transform .1s ease, box-shadow .1s ease, background .1s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .lb-btn:hover { background: var(--pink-100); }

  .lb-btn:active {
    transform: translateY(3px);
    box-shadow: 0 0 0 var(--outline);
  }

  .lb-btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .lb-btn[aria-busy="true"] { opacity: .55; cursor: progress; }

  /* download: inside the image, bottom-right corner */
  .lb-download {
    position: absolute;
    right: 12px;
    bottom: 12px;
    background: var(--pink);
    color: var(--ink);
  }

  .lb-download:hover { background: #ff8db7; }

  /* close: top-right corner of the screen (important on mobile) */
  .lb-close {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
  }

  /* prev / next: vertically centered on the left and right edges */
  .lb-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
  }

  .lb-nav:active { transform: translateY(calc(-50% + 3px)); }

  .lb-prev { left: max(14px, env(safe-area-inset-left)); }
  .lb-next { right: max(14px, env(safe-area-inset-right)); }

  /* "3 / 30" counter, top-left corner */
  .lb-counter {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    left: max(14px, env(safe-area-inset-left));
    z-index: 2;
    padding: 11px 16px;
    border: 2.5px solid var(--outline);
    border-radius: 999px;
    background: var(--cream);
    box-shadow: 0 3px 0 var(--outline);
    color: var(--ink);
    font-size: 14px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    pointer-events: none;
  }

  /* ================= Error / info message ================= */
  .message {
    width: min(560px, calc(100% - 2 * var(--gap)));
    margin: 18vh auto 0;
    padding: 24px 26px;
    background: #fff;
    border: 3px solid var(--outline);
    border-radius: 20px;
    box-shadow: 6px 7px 0 var(--pink);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.75;
    text-align: center;
  }

  .message code {
    display: inline-block;
    padding: 1px 8px;
    background: var(--pink-100);
    border: 1.5px solid var(--outline);
    border-radius: 8px;
    color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
  }

  @media (prefers-reduced-motion: reduce) {
    .tile,
    .page-btn,
    .lb-btn { transition: none; }

    .tile { animation: none; }
    .progress::before { animation-duration: 2.4s; }
  }
</style>
</head>
<body>

<div id="progress" class="progress" aria-hidden="true" hidden></div>

<main id="gallery" aria-label="Image gallery" aria-busy="false"></main>

<nav id="pagination" class="pagination" aria-label="Pagination" hidden>
  <div id="page-list" class="page-list"></div>
  <p id="page-info" class="page-info"></p>
</nav>

<p id="message" class="message" role="alert" hidden></p>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="Image preview" tabindex="-1" hidden>
  <div id="lb-counter" class="lb-counter" aria-live="polite"></div>

  <button id="lb-close" class="lb-btn lb-close" type="button" aria-label="Close preview" title="Close">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M6 6l12 12"/><path d="M18 6L6 18"/>
    </svg>
  </button>

  <button id="lb-prev" class="lb-btn lb-nav lb-prev" type="button" aria-label="Previous image" title="Previous">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 5l-7 7 7 7"/>
    </svg>
  </button>

  <button id="lb-next" class="lb-btn lb-nav lb-next" type="button" aria-label="Next image" title="Next">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 5l7 7-7 7"/>
    </svg>
  </button>

  <div class="lb-stage">
    <img alt="" referrerpolicy="no-referrer" />
    <button id="lb-download" class="lb-btn lb-download" type="button" aria-label="Download image" title="Download">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/>
      </svg>
    </button>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* ==========================================================
   * Configuration
   * ========================================================== */
  const CONFIG = Object.freeze({
    urlListFile:  'url.txt',
    perPage:      30,      // images per page; a new page is created when this is full
    minColWidth:  250,     // ideal column width (px), drives the column count
    minCols:      2,
    maxCols:      9,
    concurrency:  6,       // simultaneous image loads
    fetchTimeout: 10000,   // ms, for url.txt
    imageTimeout: 15000,   // ms, per preview image
    swipeDistance: 50      // px, minimum horizontal swipe to change image
  });

  /* Static strings only (safe to render with innerHTML: no user input). */
  const MESSAGES = Object.freeze({
    fetchFailed:
      'Could not load <code>url.txt</code>.<br>' +
      'If you opened this file via <code>file://</code> (double-click), ' +
      'the browser blocks <code>fetch()</code>. Serve it from localhost instead:<br><br>' +
      '<code>python3 -m http.server 8000</code><br>' +
      'then open <code>http://localhost:8000</code>',
    noUrls:
      '<code>url.txt</code> contains no valid image URLs.<br>' +
      'Format: one entry per line &mdash; <code>preview_url download_url</code><br>' +
      'separated by a space or <code>|</code>. The download URL is optional.',
    allFailed:
      'All images on this page failed to load. Check <code>url.txt</code> &mdash; every preview URL must ' +
      'point directly to an image file (not a web page) and be publicly accessible.'
  });

  const EXTENSION_BY_MIME = Object.freeze({
    'image/jpeg':    'jpg',
    'image/png':     'png',
    'image/webp':    'webp',
    'image/gif':     'gif',
    'image/avif':    'avif',
    'image/bmp':     'bmp',
    'image/svg+xml': 'svg'
  });

  const PAGE_PARAM = 'page';
  const BASE_TITLE = document.title;

  /* ==========================================================
   * DOM elements
   * ========================================================== */
  const gallery     = document.getElementById('gallery');
  const progressBar = document.getElementById('progress');
  const messageEl   = document.getElementById('message');
  const pagination  = document.getElementById('pagination');
  const pageList    = document.getElementById('page-list');
  const pageInfo    = document.getElementById('page-info');
  const lightbox    = document.getElementById('lightbox');
  const lightboxImg = lightbox.querySelector('.lb-stage img');
  const lbClose     = document.getElementById('lb-close');
  const lbPrev      = document.getElementById('lb-prev');
  const lbNext      = document.getElementById('lb-next');
  const lbCounter   = document.getElementById('lb-counter');
  const lbDownload  = document.getElementById('lb-download');

  /* ==========================================================
   * State
   * ========================================================== */
  const state = {
    entries: [],       // [{ preview, download }] in url.txt order
    page: 0,           // current page (1-based); 0 = nothing rendered yet
    totalPages: 1,
    pageEntries: [],   // entries of the current page
    loadToken: 0,      // bumped on every page render; results from older renders are discarded

    items: [],         // loaded tiles of the current page: { el, ratio, col, index, preview, download }
    columns: [],       // .col elements
    heights: [],       // estimated height of each column
    colWidth: 1,
    gap: 10,
    galleryWidth: 0,

    activeItem: null   // item currently shown in the lightbox
  };

  const itemByElement = new WeakMap(); // tile element -> item

  /* ==========================================================
   * General utilities
   * ========================================================== */
  const clamp = (n, min, max) => Math.max(min, Math.min(max, n));

  const isHttpUrl = (value) => {
    try {
      const { protocol } = new URL(value);
      return protocol === 'http:' || protocol === 'https:';
    } catch {
      return false;
    }
  };

  /**
   * Parses url.txt. One entry per line:
   *
   *   <preview_url> <download_url>     (separated by whitespace or "|")
   *
   * - The download URL is optional; if missing or invalid, the preview URL is used.
   * - Blank lines and lines starting with "#" are ignored.
   * - Duplicate preview URLs are dropped.
   * - The order of the file is kept, so every page is stable across refreshes.
   */
  const parseEntries = (text) => {
    const entries = new Map();

    for (const rawLine of text.split(/\r?\n/)) {
      const line = rawLine.trim();
      if (!line || line.startsWith('#')) continue;

      const [preview, download] = line.split(/[\s|]+/).filter(Boolean);
      if (!isHttpUrl(preview) || entries.has(preview)) continue;

      entries.set(preview, {
        preview,
        download: isHttpUrl(download) ? download : preview
      });
    }

    return [...entries.values()];
  };

  const fetchWithTimeout = async (url, timeoutMs) => {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      return await fetch(url, { cache: 'no-cache', signal: controller.signal });
    } finally {
      clearTimeout(timer);
    }
  };

  /** Runs `worker` for every item with at most `limit` running in parallel. */
  const runPool = async (list, limit, worker) => {
    let cursor = 0;
    const run = async () => {
      while (cursor < list.length) {
        const item = list[cursor++];
        try {
          await worker(item);
        } catch {
          /* one failing item must not stop the others */
        }
      }
    };
    await Promise.all(Array.from({ length: Math.min(limit, list.length) }, run));
  };

  const showMessage = (html) => {
    messageEl.innerHTML = html;
    messageEl.hidden = false;
  };

  const setLoading = (isLoading) => {
    progressBar.hidden = !isLoading;
    gallery.setAttribute('aria-busy', String(isLoading));
  };

  /* ==========================================================
   * Masonry layout
   * ========================================================== */
  const readGap = () => {
    const value = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap'));
    return Number.isFinite(value) ? value : 10;
  };

  const columnCountFor = (width) =>
    clamp(Math.round(width / CONFIG.minColWidth), CONFIG.minCols, CONFIG.maxCols);

  const measureColumnWidth = (count, gap) => {
    const style = getComputedStyle(gallery);
    const padding = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
    const inner = gallery.clientWidth - padding;
    return Math.max(1, (inner - gap * (count - 1)) / count);
  };

  const itemHeight = (item) => state.colWidth / item.ratio;

  const shortestColumnIndex = () => state.heights.indexOf(Math.min(...state.heights));

  const addToColumn = (item, index) => {
    const column = state.columns[index];
    if (column.childElementCount > 0) state.heights[index] += state.gap;
    state.heights[index] += itemHeight(item);
    item.col = index;
    column.appendChild(item.el);
  };

  const place = (item) => addToColumn(item, shortestColumnIndex());

  /** Re-reads the gap, column width and gallery width. */
  const syncMetrics = (columnCount) => {
    state.gap = readGap();
    state.colWidth = measureColumnWidth(columnCount, state.gap);
    state.galleryWidth = gallery.clientWidth;
  };

  /** Rebuilds every column and re-places all tiles (used on a new page or when the column count changes). */
  const rebuildLayout = () => {
    const count = columnCountFor(gallery.clientWidth);

    state.columns = Array.from({ length: count }, () => {
      const column = document.createElement('div');
      column.className = 'col';
      return column;
    });
    state.heights = new Array(count).fill(0);
    syncMetrics(count);

    state.items.forEach((item) => place(item));

    // single replace -> no empty frame, scroll position stays intact
    gallery.replaceChildren(...state.columns);
  };

  /** Same column count, only the width changed: recompute height estimates without moving tiles. */
  const refreshMetrics = () => {
    syncMetrics(state.columns.length);
    state.heights.fill(0);

    const hasItem = new Array(state.columns.length).fill(false);
    for (const item of state.items) {
      if (hasItem[item.col]) state.heights[item.col] += state.gap;
      hasItem[item.col] = true;
      state.heights[item.col] += itemHeight(item);
    }
  };

  const handleResize = () => {
    const width = gallery.clientWidth;
    if (width === state.galleryWidth) return; // height-only changes (e.g. mobile address bar) are ignored

    if (columnCountFor(width) !== state.columns.length) rebuildLayout();
    else refreshMetrics();
  };

  /* ==========================================================
   * Image loading
   * ========================================================== */
  /** Loads one preview image. Resolves to the <img> element, or null on failure/timeout. */
  const loadImage = (url) => new Promise((resolve) => {
    const img = new Image();
    img.alt = '';
    img.decoding = 'async';
    img.referrerPolicy = 'no-referrer';
    img.draggable = false;

    const settle = (loaded) => {
      clearTimeout(timer);
      img.onload = null;
      img.onerror = null;

      const valid = loaded && img.naturalWidth > 0 && img.naturalHeight > 0;
      if (!valid) img.removeAttribute('src'); // cancel a download that is still running
      resolve(valid ? img : null);
    };

    const timer = setTimeout(() => settle(false), CONFIG.imageTimeout);
    img.onload = () => settle(true);
    img.onerror = () => settle(false);
    img.src = url;
  });

  const createTile = (img, entry, index) => {
    // intrinsic width/height -> the browser derives the aspect ratio (no layout shift)
    img.width = img.naturalWidth;
    img.height = img.naturalHeight;

    const el = document.createElement('figure');
    el.className = 'tile';
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', 'Enlarge image');
    el.appendChild(img);

    const item = {
      el,
      ratio: img.naturalWidth / img.naturalHeight,
      col: -1,
      index,                      // position inside the page (url.txt order)
      preview: entry.preview,
      download: entry.download
    };
    itemByElement.set(el, item);
    return item;
  };

  /* ==========================================================
   * Pages & URL (?page=N)
   * ========================================================== */
  const getPageFromUrl = () => {
    const value = parseInt(new URLSearchParams(location.search).get(PAGE_PARAM), 10);
    return Number.isFinite(value) ? value : 1;
  };

  /** Builds the URL for a page while keeping any other query parameters. Page 1 gets a clean URL. */
  const buildPageUrl = (page) => {
    const params = new URLSearchParams(location.search);
    if (page <= 1) params.delete(PAGE_PARAM);
    else params.set(PAGE_PARAM, String(page));

    const query = params.toString();
    return location.pathname + (query ? '?' + query : '') + location.hash;
  };

  /** Page numbers to display, with `null` marking a gap ("..."). Example: 1 2 ... 9 10 11 ... 19 20 */
  const buildPageList = (current, total) => {
    const wanted = new Set([1, 2, current - 1, current, current + 1, total - 1, total]);
    const pages = [...wanted].filter((p) => p >= 1 && p <= total).sort((a, b) => a - b);

    const result = [];
    pages.forEach((page, i) => {
      if (i > 0) {
        const diff = page - pages[i - 1];
        if (diff === 2) result.push(page - 1); // a single hidden page is shown instead of "..."
        else if (diff > 2) result.push(null);
      }
      result.push(page);
    });
    return result;
  };

  const createPageControl = ({ page, text, label, current = false, disabled = false }) => {
    const el = document.createElement(disabled ? 'span' : 'a');
    el.className = 'page-btn';
    el.textContent = text;
    if (label) el.setAttribute('aria-label', label);

    if (disabled) {
      el.setAttribute('aria-disabled', 'true');
      return el;
    }

    el.href = buildPageUrl(page); // real URL: middle-click / "open in new tab" works
    el.dataset.page = String(page);
    if (current) el.setAttribute('aria-current', 'page');
    return el;
  };

  const renderPagination = () => {
    const { page, totalPages } = state;

    pagination.hidden = totalPages <= 1;
    if (totalPages <= 1) return;

    const controls = [
      createPageControl({
        page: page - 1, text: 'Prev', label: 'Previous page', disabled: page === 1
      })
    ];

    for (const entry of buildPageList(page, totalPages)) {
      if (entry === null) {
        const gap = document.createElement('span');
        gap.className = 'page-gap';
        gap.setAttribute('aria-hidden', 'true');
        gap.textContent = '…';
        controls.push(gap);
      } else {
        controls.push(createPageControl({
          page: entry, text: String(entry), label: 'Page ' + entry, current: entry === page
        }));
      }
    }

    controls.push(createPageControl({
      page: page + 1, text: 'Next', label: 'Next page', disabled: page === totalPages
    }));

    pageList.replaceChildren(...controls);
    pageInfo.textContent =
      'Page ' + page + ' of ' + totalPages + ' · ' + state.entries.length + ' images';
  };

  const updateTitle = () => {
    document.title = state.page > 1 ? BASE_TITLE + ' - Page ' + state.page : BASE_TITLE;
  };

  /** Clears the gallery and loads every image of the current page. */
  const renderPage = async () => {
    const token = ++state.loadToken;
    if (isLightboxOpen()) closeLightbox();

    const start = (state.page - 1) * CONFIG.perPage;
    state.pageEntries = state.entries.slice(start, start + CONFIG.perPage);
    state.items = [];

    messageEl.hidden = true;
    rebuildLayout();
    renderPagination();
    updateTitle();
    window.scrollTo(0, 0);
    setLoading(true);

    const queue = state.pageEntries.map((entry, index) => ({ entry, index }));

    await runPool(queue, CONFIG.concurrency, async ({ entry, index }) => {
      if (token !== state.loadToken) return; // the user already moved to another page

      const img = await loadImage(entry.preview);
      if (!img || token !== state.loadToken) return;

      const item = createTile(img, entry, index);
      state.items.push(item);
      place(item);
    });

    if (token !== state.loadToken) return;

    setLoading(false);
    if (state.items.length === 0) showMessage(MESSAGES.allFailed);
  };

  /**
   * Switches to a page.
   * mode: 'push'    -> add a history entry (normal navigation, Back button works)
   *       'replace' -> rewrite the current history entry (fixing an invalid URL)
   *       'none'    -> the URL is already correct (browser Back / Forward)
   */
  const goToPage = (requested, mode) => {
    const page = clamp(requested, 1, state.totalPages);

    if (mode === 'push') {
      if (page === state.page) return;
      history.pushState(null, '', buildPageUrl(page));
    } else if (mode === 'replace') {
      history.replaceState(null, '', buildPageUrl(page));
    }

    state.page = page;
    renderPage();
  };

  /** Browser Back / Forward. */
  const handlePopState = () => {
    if (state.entries.length === 0) return;

    const requested = getPageFromUrl();
    const page = clamp(requested, 1, state.totalPages);
    if (page === state.page) return;

    goToPage(page, page === requested ? 'none' : 'replace');
  };

  /* ==========================================================
   * Download
   * ========================================================== */
  const buildFilename = (url, mimeType) => {
    let name = 'image';
    try {
      const last = new URL(url).pathname.split('/').filter(Boolean).pop();
      if (last) name = decodeURIComponent(last);
    } catch {
      /* fall back to the default name */
    }

    name = name.replace(/[\\/:*?"<>|]+/g, '_');
    if (!/\.[a-z0-9]{2,5}$/i.test(name)) {
      name += '.' + (EXTENSION_BY_MIME[mimeType] || 'jpg');
    }
    return name;
  };

  const clickLink = (href, props) => {
    const a = document.createElement('a');
    Object.assign(a, props);
    a.href = href;
    document.body.appendChild(a);
    a.click();
    a.remove();
  };

  const downloadImage = async (url) => {
    try {
      const res = await fetch(url, { mode: 'cors', credentials: 'omit', referrerPolicy: 'no-referrer' });
      if (!res.ok) throw new Error('HTTP ' + res.status);

      const blob = await res.blob();
      const objectUrl = URL.createObjectURL(blob);
      clickLink(objectUrl, { download: buildFilename(url, blob.type), rel: 'noopener' });
      setTimeout(() => URL.revokeObjectURL(objectUrl), 15000);
    } catch {
      // CORS blocked / network error -> open the image in a new tab as a fallback
      clickLink(url, { target: '_blank', rel: 'noopener noreferrer' });
    }
  };

  /* ==========================================================
   * Lightbox
   * ========================================================== */
  let lastFocused = null;

  const isLightboxOpen = () => !lightbox.hidden;

  /** Loaded items of the current page in url.txt order (not in load-completion order). */
  const orderedItems = () => state.items.slice().sort((a, b) => a.index - b.index);

  const neighborOf = (item, offset) => {
    const list = orderedItems();
    return list[list.indexOf(item) + offset] || null;
  };

  const updateLightboxControls = () => {
    const item = state.activeItem;
    if (!item) return;

    lbPrev.hidden = !neighborOf(item, -1);
    lbNext.hidden = !neighborOf(item, 1);
    lbCounter.textContent = (item.index + 1) + ' / ' + state.pageEntries.length;

    // an arrow that just disappeared may have held the focus: keep it inside the dialog
    if (!lightbox.contains(document.activeElement)) lightbox.focus();
  };

  const showItem = (item) => {
    state.activeItem = item;
    lightboxImg.src = item.preview;
    updateLightboxControls();
  };

  const showNeighbor = (offset) => {
    if (!state.activeItem) return;
    const next = neighborOf(state.activeItem, offset);
    if (next) showItem(next);
  };

  const openLightbox = (item) => {
    lastFocused = document.activeElement;
    lightbox.hidden = false;
    gallery.inert = true; // keep keyboard focus out of the gallery behind the lightbox
    document.body.classList.add('no-scroll');
    lightbox.focus();
    showItem(item);
  };

  const closeLightbox = () => {
    const returnTo = state.activeItem && state.activeItem.el.isConnected
      ? state.activeItem.el   // the tile of the image that was viewed last
      : lastFocused;

    lightbox.hidden = true;
    lightboxImg.removeAttribute('src');
    state.activeItem = null;
    gallery.inert = false;
    document.body.classList.remove('no-scroll');

    if (returnTo && typeof returnTo.focus === 'function') returnTo.focus();
    lastFocused = null;
  };

  const tileFromEvent = (event) =>
    event.target instanceof Element ? event.target.closest('.tile') : null;

  const openTile = (tile) => {
    const item = itemByElement.get(tile);
    if (item) openLightbox(item);
  };

  /* ==========================================================
   * Event binding
   * ========================================================== */
  const bindEvents = () => {
    // click / keyboard on a tile -> open lightbox (event delegation)
    gallery.addEventListener('click', (event) => {
      const tile = tileFromEvent(event);
      if (tile) openTile(tile);
    });

    gallery.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      const tile = tileFromEvent(event);
      if (!tile) return;
      event.preventDefault();
      openTile(tile);
    });

    // pagination links: navigate without a full reload (modified clicks keep the default behavior)
    pagination.addEventListener('click', (event) => {
      const link = event.target instanceof Element ? event.target.closest('a[data-page]') : null;
      if (!link) return;
      if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;

      event.preventDefault();
      goToPage(Number(link.dataset.page), 'push');
    });

    window.addEventListener('popstate', handlePopState);

    // dark area outside the image / close button -> close
    lightbox.addEventListener('click', (event) => {
      if (event.target === lightbox) closeLightbox();
    });
    lbClose.addEventListener('click', closeLightbox);

    // previous / next image
    lbPrev.addEventListener('click', () => showNeighbor(-1));
    lbNext.addEventListener('click', () => showNeighbor(1));

    // keyboard: Escape closes, arrow keys navigate
    document.addEventListener('keydown', (event) => {
      if (!isLightboxOpen() || event.altKey || event.ctrlKey || event.metaKey) return;

      if (event.key === 'Escape') closeLightbox();
      else if (event.key === 'ArrowLeft') showNeighbor(-1);
      else if (event.key === 'ArrowRight') showNeighbor(1);
    });

    // touch: swipe left = next image, swipe right = previous image
    let touchStart = null;

    lightbox.addEventListener('touchstart', (event) => {
      touchStart = event.touches.length === 1
        ? { x: event.touches[0].clientX, y: event.touches[0].clientY }
        : null;
    }, { passive: true });

    lightbox.addEventListener('touchend', (event) => {
      if (!touchStart) return;

      const touch = event.changedTouches[0];
      const dx = touch.clientX - touchStart.x;
      const dy = touch.clientY - touchStart.y;
      touchStart = null;

      if (Math.abs(dx) >= CONFIG.swipeDistance && Math.abs(dx) > Math.abs(dy) * 1.5) {
        showNeighbor(dx < 0 ? 1 : -1);
      }
    }, { passive: true });

    // download button (saves the full-size URL, not the preview)
    lbDownload.addEventListener('click', async () => {
      const item = state.activeItem;
      if (!item || lbDownload.getAttribute('aria-busy') === 'true') return;

      lbDownload.setAttribute('aria-busy', 'true');
      try {
        await downloadImage(item.download);
      } finally {
        lbDownload.removeAttribute('aria-busy');
      }
    });

    // responsive layout: watch the gallery width (also catches scrollbar changes)
    new ResizeObserver(handleResize).observe(gallery);
  };

  /* ==========================================================
   * Init
   * ========================================================== */
  const loadEntries = async () => {
    const res = await fetchWithTimeout(CONFIG.urlListFile, CONFIG.fetchTimeout);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return parseEntries(await res.text());
  };

  const init = async () => {
    // we restore the scroll position ourselves (always the top of a freshly loaded page)
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

    rebuildLayout();
    bindEvents();

    let entries;
    try {
      entries = await loadEntries();
    } catch {
      showMessage(MESSAGES.fetchFailed);
      return;
    }

    if (entries.length === 0) {
      showMessage(MESSAGES.noUrls);
      return;
    }

    state.entries = entries;
    state.totalPages = Math.max(1, Math.ceil(entries.length / CONFIG.perPage));

    // open the page from the URL (?page=N); 'replace' also cleans up an invalid value
    goToPage(getPageFromUrl(), 'replace');
  };

  init();
})();
</script>
</body>
</html>
