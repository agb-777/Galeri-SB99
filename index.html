<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#ececea" />
<title>Galeri SB99</title>
<script>
  /* Apply the saved theme before the first paint (prevents a light flash in dark mode).
     The storage key and colors must match THEME_KEY / THEME_COLORS in the main script. */
  (function () {
    var theme = 'light';
    try { if (localStorage.getItem('sb99-theme') === 'dark') theme = 'dark'; } catch (e) { /* storage blocked */ }
    document.documentElement.dataset.theme = theme;
    if (theme === 'dark') document.querySelector('meta[name="theme-color"]').content = '#0e0e0e';
  })();
</script>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=Syne:wght@700;800&amp;display=swap" />
<style>
  /* ================= Design tokens =================
     Monochrome on purpose: the videos bring the color.
     Light is the default; dark is switched on with <html data-theme="dark">. */
  :root {
    color-scheme: light;

    --gap: 12px;               /* space between covers and from the screen edge */
    --radius: 4px;

    --bg:            #ececea;  /* page + bars */
    --bar:           #ececea;
    --hover:         #e0e0dd;  /* hover / subtle fill */
    --placeholder:   #dcdcd9;  /* behind a video cover until it has loaded */
    --line:          #cfcfcb;  /* hairlines */
    --ink:           #131313;  /* text, current page, focus */
    --ink-muted:     #6b6b67;  /* secondary text */
    --on-ink:        #ececea;

    --overlay:       rgba(8, 8, 8, .94);

    --nav-h:         60px;     /* height of the fixed navbar (safe area is added on top) */
    --footer-h:      42px;     /* height of the fixed footer (safe area is added on top) */

    --font:    "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-display: "Syne", var(--font);
  }

  :root[data-theme="dark"] {
    color-scheme: dark;

    --bg:            #0e0e0e;
    --bar:           #0e0e0e;
    --hover:         #1d1d1d;
    --placeholder:   #1a1a1a;
    --line:          #2a2a2a;
    --ink:           #f1f1ee;
    --ink-muted:     #9a9a95;
    --on-ink:        #0e0e0e;

    --overlay:       rgba(0, 0, 0, .95);
  }

  @media (max-width: 600px) {
    :root {
      --gap: 10px;
      --nav-h: 56px;
      --footer-h: 38px;
    }
  }

  /* ================= Base ================= */
  *,
  *::before,
  *::after { box-sizing: border-box; }

  [hidden] { display: none !important; }

  html {
    background: var(--bg);
    /* The browser scrollbar is hidden: a fixed navbar/footer can never cover it, so it
       would leave a strip at the right edge. Wheel, touch, trackpad and keyboard still scroll. */
    scrollbar-width: none;
  }

  html::-webkit-scrollbar { display: none; }

  html,
  body {
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    color: var(--ink);
    font-family: var(--font);
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    /* keep the content clear of the fixed navbar and footer */
    padding-top: calc(var(--nav-h) + env(safe-area-inset-top));
    padding-bottom: calc(var(--footer-h) + env(safe-area-inset-bottom));
  }

  ::selection {
    background: var(--ink);
    color: var(--on-ink);
  }

  body.no-scroll { overflow: hidden; }

  /* ================= Navbar (fixed top) ================= */
  .site-nav {
    position: fixed;
    top: 0;
    right: 0;
    left: 0;
    z-index: 35;
    display: flex;
    align-items: center;
    gap: 28px;
    height: calc(var(--nav-h) + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) max(var(--gap), env(safe-area-inset-right)) 0 max(var(--gap), env(safe-area-inset-left));
    background: var(--bar);
    border-bottom: 1px solid var(--line);
    -webkit-tap-highlight-color: transparent;
  }

  /* site title */
  .brand {
    flex: none;
    color: var(--ink);
    font-family: var(--font-display);
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -.035em;
    line-height: 1;
    text-decoration: none;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }

  .brand:focus-visible,
  .nav-link:focus-visible,
  .nav-btn:focus-visible,
  a.page-btn:focus-visible,
  .tile:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 4px;
  }

  .nav-menu {
    display: flex;
    align-items: center;
    gap: 22px;
  }

  .nav-link {
    position: relative;
    display: inline-flex;
    align-items: center;
    height: 36px;
    color: var(--ink-muted);
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    transition: color .15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .nav-link:hover { color: var(--ink); }

  /* current page: underline that sits on the navbar's bottom line */
  .nav-link[aria-current="page"] { color: var(--ink); }

  .nav-link[aria-current="page"]::after {
    content: "";
    position: absolute;
    right: 0;
    bottom: -13px;
    left: 0;
    height: 2px;
    background: var(--ink);
  }

  /* icon buttons (hamburger + theme toggle) */
  .nav-btn {
    display: inline-flex;
    flex: none;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: background .15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .nav-btn:hover { background: var(--hover); }
  .nav-btn svg { display: block; }

  .nav-toggle { display: none; }          /* hamburger: small screens only */
  .nav-toggle .icon-x { display: none; }
  .site-nav.is-open .nav-toggle .icon-burger { display: none; }
  .site-nav.is-open .nav-toggle .icon-x { display: block; }

  .theme-toggle { margin-left: auto; }    /* pinned to the right corner */
  .theme-toggle .icon-sun { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }

  /* small screens: hamburger on the left, links in a dropdown panel under it */
  @media (max-width: 720px) {
    .site-nav { gap: 10px; }
    .nav-toggle { display: inline-flex; margin-left: -8px; }
    .brand { font-size: 23px; }

    .nav-menu {
      position: fixed;
      top: calc(var(--nav-h) + env(safe-area-inset-top));
      right: 0;
      left: 0;
      z-index: 36;
      display: none;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      padding: 4px max(var(--gap), env(safe-area-inset-left)) 12px;
      background: var(--bar);
      border-bottom: 1px solid var(--line);
    }

    .site-nav.is-open .nav-menu {
      display: flex;
      animation: menu-in .16s ease backwards;
    }

    .nav-link {
      height: 52px;
      border-bottom: 1px solid var(--line);
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.02em;
    }

    .nav-link:last-child { border-bottom: 0; }

    /* in the dropdown the current page is shown by color + a bar on its left */
    .nav-link[aria-current="page"]::after {
      top: 14px;
      right: auto;
      bottom: 14px;
      left: -12px;
      width: 3px;
      height: auto;
    }
  }

  @keyframes menu-in {
    from {
      opacity: 0;
      transform: translateY(-6px);
    }
  }

  /* visible to screen readers and search engines only */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ================= Footer (fixed) ================= */
  .site-footer {
    position: fixed;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    height: calc(var(--footer-h) + env(safe-area-inset-bottom));
    padding: 0 var(--gap) env(safe-area-inset-bottom);
    background: var(--bar);
    border-top: 1px solid var(--line);
  }

  .footer-text {
    margin: 0;
    color: var(--ink-muted);
    font-size: 13px;
  }

  /* ================= Loading bar ================= */
  .progress {
    position: fixed;
    top: calc(var(--nav-h) + env(safe-area-inset-top));
    right: 0;
    left: 0;
    z-index: 40;
    height: 2px;
    overflow: hidden;
    pointer-events: none;
  }

  .progress::before {
    content: "";
    position: absolute;
    inset: 0;
    width: 35%;
    background: var(--ink);
    animation: progress-slide 1.1s ease-in-out infinite;
  }

  @keyframes progress-slide {
    from { transform: translateX(-100%); }
    to   { transform: translateX(290%); }
  }

  /* ================= Gallery (masonry) ================= */
  #gallery {
    display: flex;
    align-items: flex-start;
    gap: var(--gap);
    width: 100%;
    padding: var(--gap);
  }

  .col {
    display: flex;
    flex: 1 1 0;
    flex-direction: column;
    gap: var(--gap);
    min-width: 0;
  }

  /* ================= Tile ================= */
  .tile {
    position: relative;
    display: block;
    flex: 0 0 auto;
    margin: 0;
    overflow: hidden;
    background: var(--placeholder);
    border-radius: var(--radius);
    outline: none;
    cursor: pointer;
    /* "backwards": the animation must not keep holding `opacity` after it ends */
    animation: tile-in .3s ease backwards;
    -webkit-tap-highlight-color: transparent;
  }

  .tile video {
    display: block;
    width: 100%;
    height: auto; /* aspect ratio comes from the media width/height attributes */
    background: var(--placeholder);
    border-radius: inherit;
    transition: filter .2s ease;
  }

  /* the video cover is only a still frame: clicks go to the tile, not the <video> */
  .tile video { pointer-events: none; }

  /* category label from url.txt: a small paper tape on the cover's bottom-left corner */
  .badge {
    position: absolute;
    bottom: 8px;
    left: 8px;
    z-index: 1;
    max-width: calc(100% - 52px);
    padding: 5px 8px 6px;
    border-radius: 3px;
    background: var(--bg);
    color: var(--ink);
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: .005em;
    line-height: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    pointer-events: none;
  }

  /* play mark, bottom-right: always visible on touch screens, grows on hover for a mouse */
  .play {
    position: absolute;
    right: 8px;
    bottom: 8px;
    z-index: 1;
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--bg);
    color: var(--ink);
    pointer-events: none;
    transition: transform .2s ease;
  }

  .play svg { width: 12px; height: 12px; margin-left: 1px; } /* a triangle looks centered when nudged right */

  @media (hover: hover) {
    .tile:hover video { filter: brightness(.82); }
    .tile:hover .play { transform: scale(1.18); }
  }

  .tile:active .play { transform: scale(.94); }

  @keyframes tile-in {
    from { opacity: 0; }
  }

  /* ================= Pagination ================= */
  .pagination {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 28px var(--gap) 36px;
  }

  .page-list {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .page-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 40px;
    height: 40px;
    padding: 0 10px;
    color: var(--ink-muted);
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    text-decoration: none;
    transition: color .15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  a.page-btn:hover { color: var(--ink); }

  /* current page: ink color + a thick bar under the number */
  .page-btn[aria-current="page"] {
    color: var(--ink);
    font-weight: 700;
  }

  .page-btn[aria-current="page"]::after {
    content: "";
    position: absolute;
    right: 10px;
    bottom: 4px;
    left: 10px;
    height: 2px;
    background: var(--ink);
  }

  .page-btn[aria-disabled="true"] {
    opacity: .35;
    pointer-events: none;
  }

  .page-gap {
    min-width: 18px;
    color: var(--ink-muted);
    text-align: center;
  }

  .page-info {
    margin: 0;
    color: var(--ink-muted);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }

  /* ================= Lightbox ================= */
  #lightbox {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(12px, 4vmin, 48px);
    background: var(--overlay);
    outline: none;
    cursor: zoom-out;
    overscroll-behavior: contain;
    container-type: size; /* lets the media use cqw/cqh units (see .lb-stage video) */
  }

  /* wide screens: reserve room on both sides so the arrows sit beside the video */
  @media (min-width: 700px) {
    #lightbox { padding-inline: 84px; }
  }

  /* wrapper that shrink-wraps the video exactly */
  .lb-stage {
    position: relative;
    display: flex;
    cursor: default;
  }

  .lb-stage video {
    display: block;
    width: auto;
    height: auto;
    /* limit = content box of the lightbox (inside its padding).
       Percentages do not work here: the wrapper height is "auto",
       so max-height: 100% would be ignored. */
    max-width: 100cqw;
    max-height: 100cqh;
    object-fit: contain;
    background: #000;
    border-radius: var(--radius);
  }

  /* round buttons (close, prev, next): same look in both themes, the overlay is always dark */
  .lb-btn {
    z-index: 2;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 1px solid rgba(255, 255, 255, .22);
    border-radius: 50%;
    background: rgba(0, 0, 0, .5);
    color: #f1f1ee;
    cursor: pointer;
    transition: background .15s ease, transform .1s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .lb-btn:hover { background: rgba(255, 255, 255, .16); }
  .lb-btn:active { transform: scale(.94); }
  .lb-btn:focus-visible { outline: 2px solid #f1f1ee; outline-offset: 3px; }

  /* close: top-right corner of the screen (important on mobile) */
  .lb-close {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
  }

  /* prev / next: vertically centered on the left and right edges */
  .lb-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
  }

  .lb-nav:active { transform: translateY(-50%) scale(.94); }

  .lb-prev { left: max(14px, env(safe-area-inset-left)); }
  .lb-next { right: max(14px, env(safe-area-inset-right)); }

  /* top-left: category of the playing video, with the position ("3 / 30") under it */
  .lb-info {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    left: max(18px, env(safe-area-inset-left));
    z-index: 2;
    max-width: calc(100% - 100px);
    color: #f1f1ee;
    pointer-events: none;
  }

  .lb-title {
    margin: 0;
    overflow: hidden;
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -.02em;
    line-height: 1.15;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .lb-counter {
    margin: 4px 0 0;
    color: rgba(241, 241, 238, .65);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }

  /* ================= Error / info message ================= */
  .message {
    width: min(560px, calc(100% - 2 * var(--gap)));
    margin: 6vh auto 0;
    padding: 20px 0 0;
    border-top: 2px solid var(--ink);
    color: var(--ink-muted);
    font-size: 15px;
    line-height: 1.7;
  }

  .message code {
    display: inline-block;
    padding: 1px 6px;
    background: var(--hover);
    border-radius: 3px;
    color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
  }

  @media (prefers-reduced-motion: reduce) {
    .tile video,
    .play,
    .page-btn,
    .nav-btn,
    .nav-link,
    .lb-btn { transition: none; }

    .tile,
    .site-nav.is-open .nav-menu { animation: none; }

    .progress::before { animation-duration: 2.4s; }
  }
</style>
</head>
<body>

<header id="site-nav" class="site-nav">
  <button id="nav-toggle" class="nav-btn nav-toggle" type="button"
          aria-label="Open menu" aria-expanded="false" aria-controls="nav-menu">
    <svg class="icon-burger" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/>
    </svg>
    <svg class="icon-x" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M6 6l12 12"/><path d="M18 6L6 18"/>
    </svg>
  </button>

  <a class="brand" href="./" data-home aria-label="Galeri SB99 - home">Galeri SB99</a>

  <nav id="nav-menu" class="nav-menu" aria-label="Main">
    <a class="nav-link" href="./" data-home aria-current="page">Home</a>
    <a class="nav-link" href="#">About</a>
    <a class="nav-link" href="#">Support Me</a>
  </nav>

  <button id="theme-toggle" class="nav-btn theme-toggle" type="button"
          aria-label="Switch to dark theme" title="Switch theme">
    <svg class="icon-moon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/>
    </svg>
    <svg class="icon-sun" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
  </button>
</header>
<div id="progress" class="progress" aria-hidden="true" hidden></div>

<h1 class="sr-only">Galeri SB99</h1>
<main id="gallery" aria-label="Video gallery" aria-busy="false"></main>

<nav id="pagination" class="pagination" aria-label="Pagination" hidden>
  <div id="page-list" class="page-list"></div>
  <p id="page-info" class="page-info"></p>
</nav>

<p id="message" class="message" role="alert" hidden></p>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="Video player" tabindex="-1" hidden>
  <div class="lb-info">
    <p id="lb-title" class="lb-title"></p>
    <p id="lb-counter" class="lb-counter" aria-live="polite"></p>
  </div>

  <button id="lb-close" class="lb-btn lb-close" type="button" aria-label="Close player" title="Close">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M6 6l12 12"/><path d="M18 6L6 18"/>
    </svg>
  </button>

  <button id="lb-prev" class="lb-btn lb-nav lb-prev" type="button" aria-label="Previous video" title="Previous">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 5l-7 7 7 7"/>
    </svg>
  </button>

  <button id="lb-next" class="lb-btn lb-nav lb-next" type="button" aria-label="Next video" title="Next">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 5l7 7-7 7"/>
    </svg>
  </button>

  <div class="lb-stage">
    <video id="lb-video" controls playsinline preload="auto"></video>
  </div>
</div>

<footer class="site-footer">
  <p class="footer-text">&copy; <span id="year">2026</span> SB99. All rights reserved.</p>
</footer>

<script>
(() => {
  'use strict';

  /* ==========================================================
   * Configuration
   * ========================================================== */
  const CONFIG = Object.freeze({
    urlListFile:     'url.txt',
    perPage:         30,       // videos per page; when a page is full, the next page is created
    defaultCategory: 'Video',  // label shown on a video that has no category in url.txt
    minColWidth:     250,      // ideal column width (px), drives the column count
    minCols:         2,
    maxCols:         9,
    concurrency:     6,        // simultaneous video loads
    fetchTimeout:    10000,    // ms, for url.txt
    videoTimeout:    20000,    // ms, per video (waiting for its first frame)
    swipeDistance:   50        // px, minimum horizontal swipe to change video
  });

  /* Static strings only (safe to render with innerHTML: no user input). */
  const MESSAGES = Object.freeze({
    fetchFailed:
      'Could not load <code>url.txt</code>.<br>' +
      'If you opened this file via <code>file://</code> (double-click), ' +
      'the browser blocks <code>fetch()</code>. Serve it from localhost instead:<br><br>' +
      '<code>python3 -m http.server 8000</code><br>' +
      'then open <code>http://localhost:8000</code>',
    noUrls:
      '<code>url.txt</code> contains no valid video URLs.<br>' +
      'One video per line:<br>' +
      '<code>https://example.com/video.mp4 | Category</code><br>' +
      'The category is optional.',
    allFailed:
      'All videos on this page failed to load. Check <code>url.txt</code> &mdash; every URL must ' +
      'point directly to a video file (not a web page) and be publicly accessible.'
  });

  const PAGE_PARAM = 'page';
  const LEGACY_PARAMS = ['type']; // old links like ?type=video are cleaned up
  const BASE_TITLE = document.title;

  /* ==========================================================
   * DOM elements
   * ========================================================== */
  const siteNav     = document.getElementById('site-nav');
  const navToggle   = document.getElementById('nav-toggle');
  const themeToggle = document.getElementById('theme-toggle');
  const themeColorMeta = document.querySelector('meta[name="theme-color"]');
  const gallery     = document.getElementById('gallery');
  const progressBar = document.getElementById('progress');
  const messageEl   = document.getElementById('message');
  const pagination  = document.getElementById('pagination');
  const pageList    = document.getElementById('page-list');
  const pageInfo    = document.getElementById('page-info');
  const siteFooter  = document.querySelector('.site-footer');
  const yearEl      = document.getElementById('year');
  const lightbox    = document.getElementById('lightbox');
  const lightboxVideo = document.getElementById('lb-video');
  const lbClose     = document.getElementById('lb-close');
  const lbPrev      = document.getElementById('lb-prev');
  const lbNext      = document.getElementById('lb-next');
  const lbCounter   = document.getElementById('lb-counter');
  const lbTitle     = document.getElementById('lb-title');

  /* ==========================================================
   * State
   * ========================================================== */
  const state = {
    entries: [],       // every video of url.txt, in file order: { url, category }
    page: 0,           // current page (1-based); 0 = nothing rendered yet
    totalPages: 1,
    pageEntries: [],   // entries of the current page
    loadToken: 0,      // bumped on every page render; results from older renders are discarded

    items: [],         // loaded tiles of the current page: { el, ratio, col, index, url, category }
    columns: [],       // .col elements
    heights: [],       // estimated height of each column
    colWidth: 1,
    gap: 10,
    galleryWidth: 0,

    activeItem: null   // item currently shown in the lightbox
  };

  const itemByElement = new WeakMap(); // tile element -> item

  /* ==========================================================
   * General utilities
   * ========================================================== */
  const clamp = (n, min, max) => Math.max(min, Math.min(max, n));

  const isHttpUrl = (value) => {
    try {
      const { protocol } = new URL(value);
      return protocol === 'http:' || protocol === 'https:';
    } catch {
      return false;
    }
  };

  /**
   * Parses url.txt. One video per line:
   *
   *   <video_url> | <category>
   *
   * - The category is optional. Without one, the label is CONFIG.defaultCategory.
   * - It may have several words ("Short Film"), so "|" is the separator.
   *   The category can also come first: "Entertainment | <video_url>".
   *   Without any "|", everything after the URL (separated by a space) is the category.
   * - Blank lines and lines starting with "#" are ignored.
   * - Duplicate URLs are dropped (the first one wins).
   * - The order of the file is kept, so every page is stable across refreshes.
   */
  const parseEntries = (text) => {
    const entries = new Map();

    for (const rawLine of text.split(/\r?\n/)) {
      const line = rawLine.trim();
      if (!line || line.startsWith('#')) continue;

      const parts = (line.includes('|') ? line.split('|') : line.split(/\s+/))
        .map((part) => part.trim())
        .filter(Boolean);

      const urlIndex = parts.findIndex(isHttpUrl);
      if (urlIndex === -1) continue;

      const url = parts[urlIndex];
      if (entries.has(url)) continue;

      const category = parts.filter((_, i) => i !== urlIndex).join(' ');
      entries.set(url, { url, category: category || CONFIG.defaultCategory });
    }

    return [...entries.values()];
  };

  const fetchWithTimeout = async (url, timeoutMs) => {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      return await fetch(url, { cache: 'no-cache', signal: controller.signal });
    } finally {
      clearTimeout(timer);
    }
  };

  /** Runs `worker` for every item with at most `limit` running in parallel. */
  const runPool = async (list, limit, worker) => {
    let cursor = 0;
    const run = async () => {
      while (cursor < list.length) {
        const item = list[cursor++];
        try {
          await worker(item);
        } catch {
          /* one failing item must not stop the others */
        }
      }
    };
    await Promise.all(Array.from({ length: Math.min(limit, list.length) }, run));
  };

  const showMessage = (html) => {
    messageEl.innerHTML = html;
    messageEl.hidden = false;
  };

  const setLoading = (isLoading) => {
    progressBar.hidden = !isLoading;
    gallery.setAttribute('aria-busy', String(isLoading));
  };

  /* ==========================================================
   * Masonry layout
   * ========================================================== */
  const readGap = () => {
    const value = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap'));
    return Number.isFinite(value) ? value : 10;
  };

  const columnCountFor = (width) =>
    clamp(Math.round(width / CONFIG.minColWidth), CONFIG.minCols, CONFIG.maxCols);

  const measureColumnWidth = (count, gap) => {
    const style = getComputedStyle(gallery);
    const padding = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
    const inner = gallery.clientWidth - padding;
    return Math.max(1, (inner - gap * (count - 1)) / count);
  };

  const itemHeight = (item) => state.colWidth / item.ratio;

  const shortestColumnIndex = () => state.heights.indexOf(Math.min(...state.heights));

  const addToColumn = (item, index) => {
    const column = state.columns[index];
    if (column.childElementCount > 0) state.heights[index] += state.gap;
    state.heights[index] += itemHeight(item);
    item.col = index;
    column.appendChild(item.el);
  };

  const place = (item) => addToColumn(item, shortestColumnIndex());

  /** Re-reads the gap, column width and gallery width. */
  const syncMetrics = (columnCount) => {
    state.gap = readGap();
    state.colWidth = measureColumnWidth(columnCount, state.gap);
    state.galleryWidth = gallery.clientWidth;
  };

  /** Rebuilds every column and re-places all tiles (used on a new page or when the column count changes). */
  const rebuildLayout = () => {
    const count = columnCountFor(gallery.clientWidth);

    state.columns = Array.from({ length: count }, () => {
      const column = document.createElement('div');
      column.className = 'col';
      return column;
    });
    state.heights = new Array(count).fill(0);
    syncMetrics(count);

    state.items.forEach((item) => place(item));

    // single replace -> no empty frame, scroll position stays intact
    gallery.replaceChildren(...state.columns);
  };

  /** Same column count, only the width changed: recompute height estimates without moving tiles. */
  const refreshMetrics = () => {
    syncMetrics(state.columns.length);
    state.heights.fill(0);

    const hasItem = new Array(state.columns.length).fill(false);
    for (const item of state.items) {
      if (hasItem[item.col]) state.heights[item.col] += state.gap;
      hasItem[item.col] = true;
      state.heights[item.col] += itemHeight(item);
    }
  };

  const handleResize = () => {
    const width = gallery.clientWidth;
    if (width === state.galleryWidth) return; // height-only changes (e.g. mobile address bar) are ignored

    if (columnCountFor(width) !== state.columns.length) rebuildLayout();
    else refreshMetrics();
  };

  /* ==========================================================
   * Video covers
   * ========================================================== */
  /**
   * Loads the cover of one video (its first frame).
   * Resolves to the <video> element, or null on failure/timeout.
   */
  const loadVideo = (entry) => new Promise((resolve) => {
    const video = document.createElement('video');
    let frameTimer = 0;

    const settle = (loaded) => {
      clearTimeout(timer);
      clearTimeout(frameTimer);
      video.onerror = video.onloadedmetadata = video.onloadeddata = null;

      const valid = loaded && video.videoWidth > 0 && video.videoHeight > 0;
      if (!valid) {
        video.removeAttribute('src'); // cancel a download that is still running
        video.load();
      }
      resolve(valid ? video : null);
    };

    const timer = setTimeout(() => settle(false), CONFIG.videoTimeout);

    video.muted = true;
    video.setAttribute('muted', '');
    video.playsInline = true;
    video.preload = 'metadata';
    video.disablePictureInPicture = true;
    video.draggable = false;

    video.onerror = () => settle(false);
    // some browsers never fire "loadeddata" without playback: accept the metadata after a short wait
    video.onloadedmetadata = () => { frameTimer = setTimeout(() => settle(true), 1500); };
    video.onloadeddata = () => settle(true);

    // "#t=0.1" makes the browser show a real frame instead of a black rectangle
    video.src = entry.url + (entry.url.includes('#') ? '' : '#t=0.1');
  });

  const createBadge = (text) => {
    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = text;
    return badge;
  };

  const createPlayIcon = () => {
    const icon = document.createElement('span');
    icon.className = 'play';
    icon.setAttribute('aria-hidden', 'true');
    icon.innerHTML =
      '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">' +
      '<path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
    return icon;
  };

  const createTile = (video, entry, index) => {
    // intrinsic width/height -> the browser derives the aspect ratio (no layout shift)
    video.width = video.videoWidth;
    video.height = video.videoHeight;

    const el = document.createElement('figure');
    el.className = 'tile';
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', 'Play video: ' + entry.category);
    el.append(video, createBadge(entry.category), createPlayIcon());

    const item = {
      el,
      ratio: video.videoWidth / video.videoHeight,
      col: -1,
      index,                      // position inside the page (url.txt order)
      url: entry.url,
      category: entry.category
    };
    itemByElement.set(el, item);
    return item;
  };

  /* ==========================================================
   * Pages & URL (?page=N)
   * ========================================================== */
  const getPageFromUrl = () => {
    const value = parseInt(new URLSearchParams(location.search).get(PAGE_PARAM), 10);
    return Number.isFinite(value) ? value : 1;
  };

  /** Builds the URL for a page while keeping any other query parameters. Page 1 gets a clean URL. */
  const buildPageUrl = (page) => {
    const params = new URLSearchParams(location.search);
    LEGACY_PARAMS.forEach((name) => params.delete(name));
    if (page <= 1) params.delete(PAGE_PARAM);
    else params.set(PAGE_PARAM, String(page));

    const query = params.toString();
    return location.pathname + (query ? '?' + query : '') + location.hash;
  };

  /** Page numbers to display, with `null` marking a gap ("..."). Example: 1 2 ... 9 10 11 ... 19 20 */
  const buildPageList = (current, total) => {
    const wanted = new Set([1, 2, current - 1, current, current + 1, total - 1, total]);
    const pages = [...wanted].filter((p) => p >= 1 && p <= total).sort((a, b) => a - b);

    const result = [];
    pages.forEach((page, i) => {
      if (i > 0) {
        const diff = page - pages[i - 1];
        if (diff === 2) result.push(page - 1); // a single hidden page is shown instead of "..."
        else if (diff > 2) result.push(null);
      }
      result.push(page);
    });
    return result;
  };

  const createPageControl = ({ page, text, label, current = false, disabled = false }) => {
    const el = document.createElement(disabled ? 'span' : 'a');
    el.className = 'page-btn';
    el.textContent = text;
    if (label) el.setAttribute('aria-label', label);

    if (disabled) {
      el.setAttribute('aria-disabled', 'true');
      return el;
    }

    el.href = buildPageUrl(page); // real URL: middle-click / "open in new tab" works
    el.dataset.page = String(page);
    if (current) el.setAttribute('aria-current', 'page');
    return el;
  };

  const renderPagination = () => {
    const { page, totalPages } = state;

    pagination.hidden = totalPages <= 1;
    if (totalPages <= 1) return;

    const controls = [
      createPageControl({
        page: page - 1, text: 'Prev', label: 'Previous page', disabled: page === 1
      })
    ];

    for (const entry of buildPageList(page, totalPages)) {
      if (entry === null) {
        const gap = document.createElement('span');
        gap.className = 'page-gap';
        gap.setAttribute('aria-hidden', 'true');
        gap.textContent = '\u2013';
        controls.push(gap);
      } else {
        controls.push(createPageControl({
          page: entry, text: String(entry), label: 'Page ' + entry, current: entry === page
        }));
      }
    }

    controls.push(createPageControl({
      page: page + 1, text: 'Next', label: 'Next page', disabled: page === totalPages
    }));

    pageList.replaceChildren(...controls);
    pageInfo.textContent =
      'Page ' + page + ' of ' + totalPages + ', ' + state.entries.length + ' videos';
  };

  const updateTitle = () => {
    document.title = state.page > 1 ? BASE_TITLE + ' - Page ' + state.page : BASE_TITLE;
  };

  /** Clears the gallery and loads every video cover of the current page. */
  const renderPage = async () => {
    const token = ++state.loadToken;
    if (isLightboxOpen()) closeLightbox();

    const start = (state.page - 1) * CONFIG.perPage;
    state.pageEntries = state.entries.slice(start, start + CONFIG.perPage);
    state.items = [];

    messageEl.hidden = true;
    rebuildLayout();
    renderPagination();
    updateTitle();
    window.scrollTo(0, 0);
    setLoading(true);

    const queue = state.pageEntries.map((entry, index) => ({ entry, index }));

    await runPool(queue, CONFIG.concurrency, async ({ entry, index }) => {
      if (token !== state.loadToken) return; // the user already moved to another page

      const video = await loadVideo(entry);
      if (!video || token !== state.loadToken) return;

      const item = createTile(video, entry, index);
      state.items.push(item);
      place(item);
    });

    if (token !== state.loadToken) return;

    setLoading(false);
    if (state.items.length === 0) showMessage(MESSAGES.allFailed);
  };

  /**
   * Shows a page.
   * mode: 'push'    -> add a history entry (normal navigation, Back button works)
   *       'replace' -> rewrite the current history entry (first load: also fixes an invalid URL)
   *       'pop'     -> browser Back / Forward: the URL is already set, only normalise it
   */
  const showPage = (requested, mode) => {
    const page = clamp(requested, 1, state.totalPages);
    if (mode !== 'replace' && page === state.page) return;

    state.page = page;

    const url = buildPageUrl(page);
    if (mode === 'push') history.pushState(null, '', url);
    else history.replaceState(null, '', url);

    renderPage();
  };

  /** Browser Back / Forward. */
  const handlePopState = () => {
    if (state.entries.length === 0) return;
    showPage(getPageFromUrl(), 'pop');
  };

  /* ==========================================================
   * Navbar & theme
   * ========================================================== */
  const THEME_KEY = 'sb99-theme';
  const THEME_COLORS = Object.freeze({ light: '#ececea', dark: '#0e0e0e' });
  const MOBILE_NAV_QUERY = '(max-width: 720px)'; // keep in sync with the CSS breakpoint

  const currentTheme = () =>
    document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';

  /** Updates everything that depends on the active theme (button label, browser UI color). */
  const syncThemeControls = () => {
    const theme = currentTheme();
    themeToggle.setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
    themeColorMeta.content = THEME_COLORS[theme];
  };

  const setTheme = (theme) => {
    document.documentElement.dataset.theme = theme;
    try {
      localStorage.setItem(THEME_KEY, theme);
    } catch {
      /* storage blocked (private mode): the theme still works for this visit */
    }
    syncThemeControls();
  };

  const isMenuOpen = () => siteNav.classList.contains('is-open');

  const setMenuOpen = (open) => {
    siteNav.classList.toggle('is-open', open);
    navToggle.setAttribute('aria-expanded', String(open));
    navToggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  };

  const bindNavbar = () => {
    navToggle.addEventListener('click', () => setMenuOpen(!isMenuOpen()));
    themeToggle.addEventListener('click', () => setTheme(currentTheme() === 'dark' ? 'light' : 'dark'));

    // links: the title and "Home" go back to page 1; "#" links are placeholders
    siteNav.addEventListener('click', (event) => {
      const link = event.target instanceof Element ? event.target.closest('a') : null;
      if (!link) return;

      const plainClick = event.button === 0 && !event.metaKey && !event.ctrlKey && !event.shiftKey && !event.altKey;

      if (link.getAttribute('href') === '#') {
        event.preventDefault(); // placeholder page (About, Support Me): stay where we are
      } else if (link.hasAttribute('data-home') && plainClick && state.entries.length > 0) {
        event.preventDefault(); // back to page 1 without a full reload
        if (state.page === 1) window.scrollTo({ top: 0, behavior: 'smooth' });
        else showPage(1, 'push');
      }

      setMenuOpen(false);
    });

    // tap outside the navbar / Escape closes the dropdown; leaving the small layout resets it.
    // Capture phase + stopPropagation: the outside tap only dismisses the menu, it does not
    // also open the video underneath.
    document.addEventListener('click', (event) => {
      if (!isMenuOpen() || siteNav.contains(event.target)) return;
      event.preventDefault();
      event.stopPropagation();
      setMenuOpen(false);
    }, true);

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && isMenuOpen()) {
        setMenuOpen(false);
        navToggle.focus();
      }
    });

    window.matchMedia(MOBILE_NAV_QUERY).addEventListener('change', () => setMenuOpen(false));
  };

  /* ==========================================================
   * Lightbox (video player)
   * ========================================================== */
  let lastFocused = null;

  const isLightboxOpen = () => !lightbox.hidden;

  /** Everything behind the lightbox: keep keyboard focus and screen readers out of it. */
  const backgroundEls = [siteNav, gallery, pagination, siteFooter];
  const setBackgroundInert = (inert) => backgroundEls.forEach((el) => { el.inert = inert; });

  /** Loaded items of the current page in url.txt order (not in load-completion order). */
  const orderedItems = () => state.items.slice().sort((a, b) => a.index - b.index);

  const neighborOf = (item, offset) => {
    const list = orderedItems();
    return list[list.indexOf(item) + offset] || null;
  };

  const updateLightboxControls = () => {
    const item = state.activeItem;
    if (!item) return;

    lbPrev.hidden = !neighborOf(item, -1);
    lbNext.hidden = !neighborOf(item, 1);
    lbTitle.textContent = item.category;
    lbCounter.textContent = (item.index + 1) + ' / ' + state.pageEntries.length;

    // an arrow that just disappeared may have held the focus: keep it inside the dialog
    if (!lightbox.contains(document.activeElement)) lightbox.focus();
  };

  const stopVideo = () => {
    lightboxVideo.pause();
    lightboxVideo.removeAttribute('src');
    lightboxVideo.load();
  };

  const showItem = (item) => {
    state.activeItem = item;
    lightboxVideo.src = item.url;

    const playing = lightboxVideo.play();
    if (playing) playing.catch(() => { /* autoplay blocked: the controls still work */ });

    updateLightboxControls();
  };

  const showNeighbor = (offset) => {
    if (!state.activeItem) return;
    const next = neighborOf(state.activeItem, offset);
    if (next) showItem(next);
  };

  const openLightbox = (item) => {
    lastFocused = document.activeElement;
    lightbox.hidden = false;
    setMenuOpen(false);
    setBackgroundInert(true);
    document.body.classList.add('no-scroll');
    lightbox.focus();
    showItem(item);
  };

  const closeLightbox = () => {
    const returnTo = state.activeItem && state.activeItem.el.isConnected
      ? state.activeItem.el   // the tile of the video that was watched last
      : lastFocused;

    lightbox.hidden = true;
    stopVideo();
    state.activeItem = null;
    setBackgroundInert(false);
    document.body.classList.remove('no-scroll');

    if (returnTo && typeof returnTo.focus === 'function') returnTo.focus();
    lastFocused = null;
  };

  const tileFromEvent = (event) =>
    event.target instanceof Element ? event.target.closest('.tile') : null;

  const openTile = (tile) => {
    const item = itemByElement.get(tile);
    if (item) openLightbox(item);
  };

  /* ==========================================================
   * Event binding
   * ========================================================== */
  const bindEvents = () => {
    bindNavbar();

    // click / keyboard on a tile -> open lightbox (event delegation)
    gallery.addEventListener('click', (event) => {
      const tile = tileFromEvent(event);
      if (tile) openTile(tile);
    });

    gallery.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      const tile = tileFromEvent(event);
      if (!tile) return;
      event.preventDefault();
      openTile(tile);
    });

    // pagination links: navigate without a full reload (modified clicks keep the default behavior)
    pagination.addEventListener('click', (event) => {
      const link = event.target instanceof Element ? event.target.closest('a[data-page]') : null;
      if (!link) return;
      if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;

      event.preventDefault();
      showPage(Number(link.dataset.page), 'push');
    });

    window.addEventListener('popstate', handlePopState);

    // dark area outside the video / close button -> close
    lightbox.addEventListener('click', (event) => {
      if (event.target === lightbox) closeLightbox();
    });
    lbClose.addEventListener('click', closeLightbox);

    // previous / next video
    lbPrev.addEventListener('click', () => showNeighbor(-1));
    lbNext.addEventListener('click', () => showNeighbor(1));

    // keyboard: Escape closes, arrow keys switch video
    document.addEventListener('keydown', (event) => {
      if (!isLightboxOpen() || event.altKey || event.ctrlKey || event.metaKey) return;

      // while the player has focus, the arrow keys seek inside the video
      const onPlayer = event.target === lightboxVideo;

      if (event.key === 'Escape') closeLightbox();
      else if (event.key === 'ArrowLeft' && !onPlayer) showNeighbor(-1);
      else if (event.key === 'ArrowRight' && !onPlayer) showNeighbor(1);
    });

    // touch: swipe left = next video, swipe right = previous video
    let touchStart = null;

    lightbox.addEventListener('touchstart', (event) => {
      // a drag on the player's seek bar must not change the video
      touchStart = event.touches.length === 1 && event.target !== lightboxVideo
        ? { x: event.touches[0].clientX, y: event.touches[0].clientY }
        : null;
    }, { passive: true });

    lightbox.addEventListener('touchend', (event) => {
      if (!touchStart) return;

      const touch = event.changedTouches[0];
      const dx = touch.clientX - touchStart.x;
      const dy = touch.clientY - touchStart.y;
      touchStart = null;

      if (Math.abs(dx) >= CONFIG.swipeDistance && Math.abs(dx) > Math.abs(dy) * 1.5) {
        showNeighbor(dx < 0 ? 1 : -1);
      }
    }, { passive: true });

    // responsive layout: watch the gallery width (also catches scrollbar changes)
    new ResizeObserver(handleResize).observe(gallery);
  };

  /* ==========================================================
   * Init
   * ========================================================== */
  const loadEntries = async () => {
    const res = await fetchWithTimeout(CONFIG.urlListFile, CONFIG.fetchTimeout);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return parseEntries(await res.text());
  };

  const init = async () => {
    yearEl.textContent = String(new Date().getFullYear()); // footer copyright year
    syncThemeControls();

    // we restore the scroll position ourselves (always the top of a freshly loaded page)
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

    rebuildLayout();
    bindEvents();

    let entries;
    try {
      entries = await loadEntries();
    } catch {
      showMessage(MESSAGES.fetchFailed);
      return;
    }

    if (entries.length === 0) {
      showMessage(MESSAGES.noUrls);
      return;
    }

    state.entries = entries;
    state.totalPages = Math.max(1, Math.ceil(entries.length / CONFIG.perPage));

    // open the page from the URL (?page=N); 'replace' also cleans up an invalid value
    showPage(getPageFromUrl(), 'replace');
  };

  init();
})();
</script>
</body>
</html>
