<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="Galeri SB99: browse and watch videos by title, cast, and category." />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#ececea" />
<title>Galeri SB99</title>
<script>
  (function () {
    var theme = 'light';
    try {
      if (localStorage.getItem('sb99-theme') === 'dark') theme = 'dark';
    } catch (error) {}
    document.documentElement.dataset.theme = theme;
    if (theme === 'dark') document.querySelector('meta[name="theme-color"]').content = '#0e0e0e';
  })();
</script>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=Bricolage+Grotesque:wght@700;800&amp;display=swap" />
<style>
  :root {
    color-scheme: light;

    --gap: 12px;
    --radius: 4px;

    --bg: #ececea;
    --bar: #ececea;
    --hover: #e0e0dd;
    --placeholder: #dcdcd9;
    --line: #cfcfcb;
    --ink: #131313;
    --ink-muted: #6b6b67;
    --on-ink: #ececea;

    --nav-h: 60px;
    --footer-h: 42px;

    --font: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-display: "Bricolage Grotesque", var(--font);
  }

  :root[data-theme="dark"] {
    color-scheme: dark;

    --bg: #0e0e0e;
    --bar: #0e0e0e;
    --hover: #1d1d1d;
    --placeholder: #1a1a1a;
    --line: #2a2a2a;
    --ink: #f1f1ee;
    --ink-muted: #9a9a95;
    --on-ink: #0e0e0e;
  }

  @media (max-width: 600px) {
    :root {
      --gap: 10px;
      --nav-h: 56px;
      --footer-h: 38px;
    }
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  [hidden] {
    display: none !important;
  }

  html {
    background: var(--bg);
  }


  html,
  body {
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    color: var(--ink);
    font-family: var(--font);
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }

  ::selection {
    background: var(--ink);
    color: var(--on-ink);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  .scroller {
    position: fixed;
    top: calc(var(--nav-h) + env(safe-area-inset-top));
    right: 0;
    bottom: calc(var(--footer-h) + env(safe-area-inset-bottom));
    left: 0;
    overflow-x: hidden;
    overflow-y: scroll;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: var(--ink-muted) var(--bg);
  }

  .site-nav {
    position: fixed;
    top: 0;
    right: 0;
    left: 0;
    z-index: 35;
    display: flex;
    align-items: center;
    gap: 28px;
    height: calc(var(--nav-h) + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) max(var(--gap), env(safe-area-inset-right)) 0 max(var(--gap), env(safe-area-inset-left));
    background: var(--bar);
    border-bottom: 1px solid var(--line);
    -webkit-tap-highlight-color: transparent;
  }

  .brand {
    flex: none;
    color: var(--ink);
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -.03em;
    line-height: 1;
    text-decoration: none;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }

  .brand:focus-visible,
  .nav-link:focus-visible,
  .search-clear:focus-visible,
  .search-submit:focus-visible,
  .search-close:focus-visible,
  .meta-link:focus-visible,
  .nav-btn:focus-visible,
  a.page-btn:focus-visible,
  .tile:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 4px;
  }

  .nav-menu {
    display: flex;
    align-items: center;
    gap: 22px;
  }

  .nav-link {
    position: relative;
    display: inline-flex;
    align-items: center;
    height: 36px;
    padding: 0;
    border: 0;
    background: none;
    color: var(--ink-muted);
    cursor: pointer;
    font-family: var(--font);
    text-align: left;
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    transition: color .15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .nav-link:hover,
  .nav-link[aria-current="page"] {
    color: var(--ink);
  }

  .nav-link[aria-current="page"]::after {
    content: "";
    position: absolute;
    right: 0;
    bottom: -13px;
    left: 0;
    height: 2px;
    background: var(--ink);
  }

  .nav-btn {
    display: inline-flex;
    flex: none;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: background .15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .nav-btn:hover {
    background: var(--hover);
  }

  .nav-btn svg {
    display: block;
  }

  .nav-toggle,
  .nav-toggle .icon-x,
  .theme-toggle .icon-sun {
    display: none;
  }

  .site-nav.is-open .nav-toggle .icon-burger {
    display: none;
  }

  .site-nav.is-open .nav-toggle .icon-x {
    display: block;
  }

  .search {
    display: flex;
    flex: 0 1 440px;
    align-items: center;
    min-width: 0;
    margin-left: auto;
  }

  .search-box {
    display: flex;
    flex: 1;
    align-items: center;
    min-width: 0;
    height: 40px;
    padding: 0 6px 0 8px;
    background: var(--hover);
    border: 1px solid transparent;
    border-radius: 20px;
    transition: border-color .15s ease;
  }

  .search-box:focus-within {
    border-color: var(--ink);
  }

  .search-submit {
    display: inline-flex;
    flex: none;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--ink-muted);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .search-submit:hover {
    background: var(--line);
    color: var(--ink);
  }

  .search-input {
    flex: 1;
    min-width: 0;
    height: 100%;
    padding: 0 8px;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 15px;
    -webkit-appearance: none;
    appearance: none;
  }

  .search-input::placeholder {
    color: var(--ink-muted);
  }

  .search-input::-webkit-search-cancel-button {
    display: none;
    -webkit-appearance: none;
  }

  .search-clear {
    display: inline-flex;
    flex: none;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--ink-muted);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .search-clear:hover {
    background: var(--line);
    color: var(--ink);
  }

  .search-toggle,
  .search-close {
    display: none;
  }

  :root[data-theme="dark"] .theme-toggle .icon-moon {
    display: none;
  }

  :root[data-theme="dark"] .theme-toggle .icon-sun {
    display: block;
  }

  @media (max-width: 720px) {
    .site-nav {
      gap: 10px;
    }

    .nav-toggle {
      display: inline-flex;
      margin-left: -8px;
    }

    .brand {
      font-size: 22px;
    }

    .search {
      flex: none;
    }

    .search-box {
      display: none;
    }

    .search-input {
      font-size: 16px;
    }

    .search-toggle {
      display: inline-flex;
    }

    .site-nav.is-searching {
      gap: 8px;
    }

    .site-nav.is-searching :is(.nav-toggle, .brand, .theme-toggle, .search-toggle) {
      display: none;
    }

    .site-nav.is-searching .search {
      flex: 1;
    }

    .site-nav.is-searching .search-box {
      display: flex;
    }

    .site-nav.is-searching .search-close {
      display: inline-flex;
    }

    .site-nav.is-searching .search-clear {
      display: none;
    }

    .nav-menu {
      position: fixed;
      top: calc(var(--nav-h) + env(safe-area-inset-top));
      right: 0;
      left: 0;
      z-index: 36;
      display: none;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      padding: 4px max(var(--gap), env(safe-area-inset-left)) 12px;
      background: var(--bar);
      border-bottom: 1px solid var(--line);
    }

    .site-nav.is-open .nav-menu {
      display: flex;
      animation: menu-in .16s ease backwards;
    }

    .nav-link {
      height: 52px;
      border-bottom: 1px solid var(--line);
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.02em;
    }

    .nav-link:last-child {
      border-bottom: 0;
    }

    .nav-link[aria-current="page"]::after {
      top: 14px;
      right: auto;
      bottom: 14px;
      left: -12px;
      width: 3px;
      height: auto;
    }
  }

  @keyframes menu-in {
    from {
      opacity: 0;
      transform: translateY(-6px);
    }
  }

  .site-footer {
    position: fixed;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    height: calc(var(--footer-h) + env(safe-area-inset-bottom));
    padding: 0 var(--gap) env(safe-area-inset-bottom);
    background: var(--bar);
    border-top: 1px solid var(--line);
  }

  .footer-text {
    margin: 0;
    color: var(--ink-muted);
    font-size: 13px;
  }

  .progress {
    position: fixed;
    top: calc(var(--nav-h) + env(safe-area-inset-top));
    right: 0;
    left: 0;
    z-index: 40;
    height: 2px;
    overflow: hidden;
    pointer-events: none;
  }

  .progress::before {
    content: "";
    position: absolute;
    inset: 0;
    width: 35%;
    background: var(--ink);
    animation: progress-slide 1.1s ease-in-out infinite;
  }

  @keyframes progress-slide {
    from { transform: translateX(-100%); }
    to { transform: translateX(290%); }
  }

  #gallery:not(.is-sections),
  .tile-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 22px var(--gap);
    width: 100%;
  }

  #gallery {
    padding: var(--gap);
  }

  a.tile {
    color: inherit;
    text-decoration: none;
  }

  .tile {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
    margin: 0;
    outline: none;
    cursor: pointer;
    animation: tile-in .3s ease backwards;
    -webkit-tap-highlight-color: transparent;
  }

  .tile-cover {
    position: relative;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: var(--placeholder);
    border-radius: var(--radius);
  }

  .tile:focus-visible .tile-cover {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }

  .tile-title {
    display: -webkit-box;
    overflow: hidden;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.35;
    overflow-wrap: anywhere;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }

  .tile :is(video, img) {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    border-radius: inherit;
    pointer-events: none;
    transition: filter .2s ease;
  }

  .cover-fallback {
    display: block;
    width: 100%;
    height: 100%;
    background: var(--placeholder);
    pointer-events: none;
  }

  @media (hover: hover) {
    .tile:hover .tile-cover :is(video, img) {
      filter: brightness(.82);
    }

    .tile:hover .tile-title {
      text-decoration: underline;
    }
  }

  @keyframes tile-in {
    from { opacity: 0; }
  }

  .pagination {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px var(--gap) 36px;
  }

  .page-list {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .page-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 40px;
    height: 40px;
    padding: 0 10px;
    color: var(--ink-muted);
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    text-decoration: none;
    transition: color .15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  a.page-btn:hover {
    color: var(--ink);
  }

  .page-btn[aria-current="page"] {
    color: var(--ink);
    font-weight: 700;
  }

  .page-btn[aria-current="page"]::after {
    content: "";
    position: absolute;
    right: 10px;
    bottom: 4px;
    left: 10px;
    height: 2px;
    background: var(--ink);
  }

  .page-btn[aria-disabled="true"] {
    opacity: .35;
    pointer-events: none;
  }

  .page-gap {
    min-width: 18px;
    color: var(--ink-muted);
    text-align: center;
  }

  .scroller:not(.is-watching) .watch {
    display: none;
  }

  .scroller.is-watching :is(#gallery, #pagination, #message, #search-status, #genre-head, #grid-probe) {
    display: none;
  }

  .search-status {
    margin: 0;
    padding: calc(var(--gap) + 6px) var(--gap) 0;
    color: var(--ink-muted);
    font-size: 15px;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }

  .watch {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 380px;
    grid-template-areas:
      "main side"
      "more more";
    gap: 28px;
    align-items: start;
    max-width: 1600px;
    margin: 0 auto;
    padding: var(--gap) var(--gap) 40px;
  }

  .watch-main {
    grid-area: main;
    min-width: 0;
  }

  .recommendations {
    grid-area: side;
    align-self: stretch;
    overflow: hidden;
    contain: size;
  }

  .recommendations-more {
    grid-area: more;
  }

  .watch-player {
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: #000;
    border-radius: var(--radius);
  }

  .watch-player.is-embed video {
    display: none;
  }

  .watch-player :is(video, iframe) {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    border: 0;
  }

  .watch-title {
    margin: 16px 0 0;
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -.02em;
    line-height: 1.2;
    outline: none;
    overflow-wrap: anywhere;
  }

  .watch-meta {
    display: grid;
    gap: 8px;
    margin: 14px 0 0;
  }

  .watch-meta-row {
    display: grid;
    grid-template-columns: 84px minmax(0, 1fr);
    gap: 12px;
    align-items: baseline;
  }

  .watch-meta dt {
    color: var(--ink-muted);
    font-size: 14px;
  }

  .watch-meta dd {
    margin: 0;
    font-size: 16px;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }

  .meta-link {
    color: inherit;
    text-decoration: underline;
    text-decoration-color: var(--line);
    text-underline-offset: 3px;
    transition: text-decoration-color .15s ease;
  }

  .meta-link:hover {
    text-decoration-color: var(--ink);
  }

  .recommendations-title {
    margin: 0 0 14px;
    font-size: 16px;
    font-weight: 700;
  }

  .recommendation-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .recommendation-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 22px var(--gap);
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .rec {
    display: flex;
    gap: 12px;
    color: var(--ink);
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }

  .rec:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 4px;
  }

  .rec-thumb {
    flex: none;
    width: 168px;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: var(--placeholder);
    border-radius: var(--radius);
  }

  .rec-thumb :is(video, img) {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    pointer-events: none;
    transition: filter .2s ease;
  }

  .rec-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
    padding-top: 2px;
  }

  .rec-title {
    display: -webkit-box;
    overflow: hidden;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
    overflow-wrap: anywhere;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }

  .rec-meta {
    color: var(--ink-muted);
    font-size: 13px;
  }

  @media (hover: hover) {
    .rec:hover .rec-thumb :is(video, img) {
      filter: brightness(.82);
    }

    .rec:hover .rec-title {
      text-decoration: underline;
    }
  }

  @media (max-width: 1000px) {
    .watch {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas:
        "main"
        "side";
      gap: 24px;
    }

    .recommendations {
      overflow: visible;
      contain: none;
    }
  }

  @media (max-width: 600px) {
    .watch-title {
      font-size: 20px;
    }

    .rec-thumb {
      width: 44%;
    }
  }

  .message {
    width: min(560px, calc(100% - 2 * var(--gap)));
    margin: 6vh auto 0;
    padding: 20px 0 0;
    border-top: 2px solid var(--ink);
    color: var(--ink-muted);
    font-size: 15px;
    line-height: 1.7;
  }

  .message code {
    display: inline-block;
    padding: 1px 6px;
    background: var(--hover);
    border-radius: 3px;
    color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
  }

  @media (prefers-reduced-motion: reduce) {

    .tile,
    .site-nav.is-open .nav-menu {
      animation: none;
    }

    .progress::before {
      animation-duration: 2.4s;
    }
  }

  /* ===== Polish layer ===== */
  :root {
    --radius: 6px;
    --ease: cubic-bezier(.2, .7, .2, 1);
    --ring: color-mix(in srgb, var(--ink) 14%, transparent);
  }

  /* Brand + nav */
  .brand {
    display: inline-block;
    transition: opacity .2s ease;
  }

  .search-box {
    transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
  }

  .search-box:focus-within {
    background: var(--bg);
    box-shadow: 0 0 0 4px var(--ring);
  }

  /* Tiles */
  .tile {
    gap: 12px;
    animation: tile-rise .55s var(--ease) backwards;
  }

  .tile:nth-child(2){ animation-delay: 35ms; }
  .tile:nth-child(3){ animation-delay: 70ms; }
  .tile:nth-child(4){ animation-delay: 105ms; }
  .tile:nth-child(5){ animation-delay: 140ms; }
  .tile:nth-child(6){ animation-delay: 175ms; }
  .tile:nth-child(7){ animation-delay: 210ms; }
  .tile:nth-child(8){ animation-delay: 245ms; }
  .tile:nth-child(9){ animation-delay: 280ms; }
  .tile:nth-child(10){ animation-delay: 315ms; }
  .tile:nth-child(11){ animation-delay: 350ms; }
  .tile:nth-child(12){ animation-delay: 385ms; }

  @keyframes tile-rise {
    from { opacity: 0; transform: translateY(12px); }
  }

  .tile-cover::after,
  .rec-thumb::after,
  .watch-player::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 10%, transparent);
    pointer-events: none;
  }

  .rec-thumb,
  .watch-player {
    position: relative;
  }

  .tile :is(video, img),
  .rec-thumb :is(video, img) {
    transition: filter .3s ease, transform .6s var(--ease);
  }

  .tile-title {
    letter-spacing: -.005em;
  }

  @media (hover: hover) {
    .brand:hover {
      opacity: .75;
    }

    .tile:hover .tile-cover :is(video, img),
    .rec:hover .rec-thumb :is(video, img) {
      filter: brightness(.88);
      transform: scale(1.035);
    }

    .tile:hover .tile-title,
    .rec:hover .rec-title {
      text-decoration: underline;

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 15l6-6 6 6" />
        </svg>
      </button>
      <div id="watch-info" class="watch-info"><div class="watch-info-inner">
      <dl id="watch-meta" class="watch-meta">
        <div id="watch-cast-row" class="watch-meta-row" hidden>
          <dt><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4.5 20c.8-4 3.8-6 7.5-6s6.7 2 7.5 6" /></svg>Cast</dt>
          <dd id="watch-cast"></dd>
        </div>
        <div id="watch-category-row" class="watch-meta-row" hidden>
          <dt><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7a1 1 0 0 1 .7.3l7.6 7.6a1 1 0 0 1 0 1.4l-7.7 7.7a1 1 0 0 1-1.4 0l-7.6-7.6a1 1 0 0 1-.3-.7z" /><circle cx="8.2" cy="8.2" r="1.3" /></svg>Category</dt>
          <dd id="watch-category"></dd>
        </div>
      </dl>
      </div></div>
    </div>

    <aside id="recommendations" class="recommendations" aria-label="Related videos" hidden>
      <h3 class="recommendations-title">Related videos</h3>
      <ul id="recommendation-list" class="recommendation-list"></ul>
    </aside>

    <section id="recommendations-more" class="recommendations-more" aria-label="More videos" hidden>
      <h3 class="recommendations-title">More videos</h3>
      <ul id="recommendation-more-list" class="recommendation-grid"></ul>
    </section>
  </section>
</div>

<footer class="site-footer">
  <p class="footer-text">Made with <span role="img" aria-label="love">&#10084;&#65039;</span> and <span role="img" aria-label="coffee">&#9749;</span></p>
</footer>

<script>
(() => {
  'use strict';

  const CONFIG = Object.freeze({
    // Change the site name here. It updates the browser tab, logo, and page heading.
    siteTitle: 'Galeri SB99',
    // Optional: order of genre sections on the home page, top to bottom (e.g. ['Drama', 'Action']).
    // Genres not listed follow in the order they first appear in url.json; videos without a genre go last.
    genreOrder: [],
    // Videos shown in each genre row on the home page (the rest are behind "View all").
    rowLimit: 12,
    dataFile: 'url.json',
    perPageByColumns: [10, 12, 15, 20, 20, 24],
    recommendations: 20,
    mobileRecommendations: 5,
    singleColumnQuery: '(max-width: 600px)',
    watchColumnsQuery: '(min-width: 1001px)',
    mobileNavQuery: '(max-width: 720px)',
    concurrency: 6,
    fetchTimeout: 10000,
    videoTimeout: 20000,
    metadataGraceMs: 1500
  });

  const THEME_KEY = 'sb99-theme';
  const INFO_KEY = 'sb99-info';
  const THEME_COLORS = Object.freeze({ light: '#ececea', dark: '#0e0e0e' });
  const PAGE_PARAM = 'page';
  const VIDEO_PARAM = 'video';
  const QUERY_PARAM = 'q';
  const VIDEO_FILE_PATTERN = /\.(mp4|m4v|webm|ogv|ogg|mov|mkv)$/i;
  const EMBED_ALLOW = 'autoplay; fullscreen; picture-in-picture; encrypted-media';
  const BASE_TITLE = CONFIG.siteTitle;

  const MESSAGES = Object.freeze({
    fetchFailed:
      'Failed to load <code>url.json</code>.<br>' +
      'If this file is opened directly via <code>file://</code> (double-click), ' +
      'the browser blocks <code>fetch()</code>. Run it through localhost:<br><br>' +
      '<code>python3 -m http.server 8000</code><br>' +
      'then open <code>http://localhost:8000</code>',
    invalidJson:
      '<code>url.json</code> is not valid JSON. Check for missing commas, quotes, or brackets.',
    noVideos:
      '<code>url.json</code> contains no valid videos.<br>' +
      'It must be a list of objects. Required: <code>url</code>, <code>title</code>, ' +
      '<code>category</code>. ' +
      'Embeds also need <code>cover</code>:<br><br>' +
      '<code>{ "url": "https://example.com/video.mp4", "title": "Example", ' +
      '"category": ["Drama"] }</code>',
    allFailed:
      'All videos on this page failed to load. Check <code>url.json</code> &mdash; every URL must ' +
      'point directly to a video file (not a web page) and be publicly accessible.'
  });

  const dom = {
    nav: document.getElementById('site-nav'),
    navToggle: document.getElementById('nav-toggle'),
    themeToggle: document.getElementById('theme-toggle'),
    themeColorMeta: document.querySelector('meta[name="theme-color"]'),
    brand: document.querySelector('.brand'),
    siteHeading: document.querySelector('#site-nav h1'),
    metaDescription: document.querySelector('meta[name="description"]'),
    genreHead: document.getElementById('genre-head'),
    genreHeadTitle: document.getElementById('genre-head-title'),
    genreHeadCount: document.getElementById('genre-head-count'),
    genreBackText: document.getElementById('genre-back-text'),
    navCats: document.getElementById('nav-cats'),
    catsToggle: document.getElementById('cats-toggle'),
    catsPanel: document.getElementById('cats-panel'),
    catsList: document.getElementById('cats-list'),
    gridProbe: document.getElementById('grid-probe'),
    searchForm: document.getElementById('search-form'),
    searchInput: document.getElementById('search-input'),
    searchClear: document.getElementById('search-clear'),
    searchToggle: document.getElementById('search-toggle'),
    searchClose: document.getElementById('search-close'),
    searchStatus: document.getElementById('search-status'),
    progress: document.getElementById('progress'),
    scroller: document.getElementById('scroller'),
    gallery: document.getElementById('gallery'),
    pagination: document.getElementById('pagination'),
    pageList: document.getElementById('page-list'),
    message: document.getElementById('message'),
    watchPlayer: document.getElementById('watch-player'),
    watchVideo: document.getElementById('watch-video'),
    watchTitle: document.getElementById('watch-title'),
    watchMeta: document.getElementById('watch-meta'),
    watchInfo: document.getElementById('watch-info'),
    playerLoading: document.getElementById('player-loading'),
    playerLoadingText: document.getElementById('player-loading-text'),
    playerRetry: document.getElementById('player-retry'),
    infoToggle: document.getElementById('info-toggle'),
    watchCastRow: document.getElementById('watch-cast-row'),
    watchCast: document.getElementById('watch-cast'),
    watchCategoryRow: document.getElementById('watch-category-row'),
    watchCategory: document.getElementById('watch-category'),
    recommendations: document.getElementById('recommendations'),
    recommendationList: document.getElementById('recommendation-list'),
    recommendationMore: document.getElementById('recommendations-more'),
    recommendationMoreList: document.getElementById('recommendation-more-list'),
    watchMain: document.getElementById('watch-main')
  };

  const state = {
    entries: [],
    query: '',
    results: null,
    genre: '',
    category: '',
    categoryList: [],
    sections: false,
    hasGenres: false,
    columns: 1,
    page: 0,
    totalPages: 1,
    perPage: 0,
    items: [],
    loadToken: 0,
    loading: false,
    gridScroll: 0,
    watching: null,
    recommended: []
  };

  const itemByElement = new WeakMap();

  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

  const isModifiedClick = (event) =>
    event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey;

  const closestFromEvent = (event, selector) =>
    event.target instanceof Element ? event.target.closest(selector) : null;

  const isHttpUrl = (value) => {
    try {
      const { protocol } = new URL(value);
      return protocol === 'http:' || protocol === 'https:';
    } catch {
      return false;
    }
  };

  const toText = (value) => (typeof value === 'string' ? value.trim() : '');

  const detectType = (url, declared) => {
    if (declared === 'video' || declared === 'embed') return declared;
    return VIDEO_FILE_PATTERN.test(new URL(url).pathname) ? 'video' : 'embed';
  };

  const uniqueList = (names) => {
    const seen = new Set();
    return names.filter((name) => {
      const key = name.toLowerCase();
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  };

  const toList = (value) => {
    const names = Array.isArray(value) ? value : typeof value === 'string' ? value.split(',') : [];
    return names.map(toText).filter(Boolean);
  };

  const toDuration = (value) => {
    let total = NaN;

    if (typeof value === 'number') {
      total = Math.round(value);
    } else if (typeof value === 'string') {
      const text = value.trim();

      if (/^\d+$/.test(text)) {
        total = Number(text);
      } else if (/^\d{1,3}(:\d{1,2}){1,2}$/.test(text)) {
        total = text.split(':').reduce((sum, part) => sum * 60 + Number(part), 0);
      }
    }

    if (!Number.isFinite(total) || total <= 0) return '';

    const hours = Math.floor(total / 3600);
    const minutes = Math.floor((total % 3600) / 60);
    const seconds = total % 60;
    const pad = (n) => String(n).padStart(2, '0');

    return hours > 0 ? hours + ':' + pad(minutes) + ':' + pad(seconds) : minutes + ':' + pad(seconds);
  };

  const createDuration = (entry) => {
    if (!entry.duration) return [];

    const badge = document.createElement('span');
    badge.className = 'duration';
    badge.dataset.duration = entry.duration;
    badge.setAttribute('aria-hidden', 'true');
    return [badge];
  };

  const normalizeText = (value) =>
    value.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

  const normalizeQuery = (value) => value.trim().replace(/\s+/g, ' ');

  const findMissingKeys = (raw, type, categories) => {
    const checks = {
      url: type !== null,
      title: (toText(raw.title) || toText(raw.code)) !== '',
      cover: type !== 'embed' || isHttpUrl(toText(raw.cover)),
      category: categories.length > 0
    };

    return Object.keys(checks).filter((key) => !checks[key]);
  };

  const parseEntries = (data) => {
    const list = Array.isArray(data) ? data : data && Array.isArray(data.videos) ? data.videos : [];
    const entries = [];

    list.forEach((raw, index) => {
      const item = raw && typeof raw === 'object' ? raw : {};
      const categories = uniqueList(toList(item.category));
      const genres = uniqueList(toList(item.genre));
      const url = toText(item.url);
      const type = isHttpUrl(url) ? detectType(url, toText(item.type).toLowerCase()) : null;
      const missing = findMissingKeys(item, type, categories);

      if (missing.length > 0) {
        console.warn('url.json item ' + (index + 1) + ' skipped, missing or invalid: ' + missing.join(', '));
        return;
      }

      const title = toText(item.title) || toText(item.code);
      const cast = toList(item.cast);
      const shownCategories = categories;

      entries.push({
        number: entries.length + 1,
        type,
        url,
        cover: isHttpUrl(toText(item.cover)) ? toText(item.cover) : '',
        poster: isHttpUrl(toText(item.cover)) ? toText(item.cover) : '',
        title,
        categories: shownCategories,
        categoryKeys: [...new Set(shownCategories.map((name) => name.trim().toLowerCase()))],
        genres,
        genreKeys: [...new Set(genres.map((name) => name.trim().toLowerCase()))],
        duration: toDuration(item.duration),
        cast,
        searchText: normalizeText([title, ...shownCategories, ...genres, ...cast].join(' '))
      });
    });

    return entries.reverse();
  };

  const findEntry = (number) => state.entries[state.entries.length - number];

  const OTHER_KEY = '_other';

  const genreLabelFor = (key) => {
    if (key === OTHER_KEY) return 'Other';

    for (const entry of state.entries) {
      const name = entry.genres.find((value) => value.trim().toLowerCase() === key);
      if (name) return name;
    }

    return key;
  };

  const categoryLabelFor = (key) => (state.categoryList.find((item) => item.key === key) || {}).label || key;

  const buildCategoryList = () => {
    const map = new Map();

    state.entries.forEach((entry) => {
      entry.categoryKeys.forEach((key) => {
        if (!map.has(key)) map.set(key, { key, label: entry.categories.find((name) => name.trim().toLowerCase() === key) || key, count: 0 });
        map.get(key).count += 1;
      });
    });

    return [...map.values()].sort((a, b) => a.label.localeCompare(b.label, undefined, { sensitivity: 'base' }));
  };

  const filterEntries = (query, genre, category) => {
    let pool = state.entries;
    if (genre) pool = pool.filter((entry) => (genre === OTHER_KEY ? entry.genreKeys.length === 0 : entry.genreKeys.includes(genre)));
    if (category) pool = pool.filter((entry) => entry.categoryKeys.includes(category));
    if (!query) return pool;

    const terms = normalizeText(query).split(' ');
    return pool.filter((entry) => terms.every((term) => entry.searchText.includes(term)));
  };

  const fetchWithTimeout = async (url, timeoutMs) => {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      return await fetch(url, { cache: 'no-cache', signal: controller.signal });
    } finally {
      clearTimeout(timer);
    }
  };

  const runPool = async (list, limit, worker) => {
    let cursor = 0;

    const run = async () => {
      while (cursor < list.length) await worker(list[cursor++]).catch(() => {});
    };

    await Promise.all(Array.from({ length: Math.min(limit, list.length) }, run));
  };

  const showMessage = (html) => {
    dom.message.innerHTML = html;
    dom.message.hidden = false;
  };

  const isWatching = () => dom.scroller.classList.contains('is-watching');

  const syncProgress = () => {
    dom.progress.hidden = !state.loading || isWatching();
  };

  const setLoading = (loading) => {
    state.loading = loading;
    dom.gallery.setAttribute('aria-busy', String(loading));
    syncProgress();
  };

  const isSingleColumn = () => window.matchMedia(CONFIG.singleColumnQuery).matches;

  const orderedItems = () => state.items.slice().sort((a, b) => a.index - b.index);

  const coverSource = (url) => url + (url.includes('#') ? '' : '#t=0.1');

  const createCoverVideo = () => {
    const video = document.createElement('video');
    video.muted = true;
    video.setAttribute('muted', '');
    video.playsInline = true;
    video.preload = 'metadata';
    video.disablePictureInPicture = true;
    video.draggable = false;
    return video;
  };

  const loadVideo = (entry) => new Promise((resolve) => {
    const video = createCoverVideo();
    let graceTimer = 0;

    const settle = (loaded) => {
      clearTimeout(timeoutTimer);
      clearTimeout(graceTimer);
      video.onerror = video.onloadedmetadata = video.onloadeddata = null;

      const valid = loaded && video.videoWidth > 0 && video.videoHeight > 0;

      if (!valid) {
        video.removeAttribute('src');
        video.load();
      }

      resolve(valid ? video : null);
    };

    const timeoutTimer = setTimeout(() => settle(false), CONFIG.videoTimeout);

    video.onerror = () => settle(false);
    video.onloadedmetadata = () => {
      graceTimer = setTimeout(() => settle(true), CONFIG.metadataGraceMs);
    };
    video.onloadeddata = () => settle(true);
    video.src = coverSource(entry.url);
  });

  const loadImage = (url) => new Promise((resolve) => {
    const image = new Image();
    image.alt = '';
    image.draggable = false;

    const timeoutTimer = setTimeout(() => settle(null), CONFIG.videoTimeout);

    const settle = (result) => {
      clearTimeout(timeoutTimer);
      image.onload = image.onerror = null;
      resolve(result);
    };

    image.onload = () => settle(image.naturalWidth > 0 ? image : null);
    image.onerror = () => settle(null);
    image.src = url;
  });

  const createCoverFallback = () => {
    const fallback = document.createElement('span');
    fallback.className = 'cover-fallback';
    return fallback;
  };

  const loadCover = async (entry) => {
    if (entry.cover) {
      const image = await loadImage(entry.cover);
      if (image) return image;
    }

    if (entry.type === 'video') return loadVideo(entry);

    return createCoverFallback();
  };

  const createTile = (media, entry, index) => {
    const cover = document.createElement('div');
    cover.className = 'tile-cover';
    cover.append(media, ...createDuration(entry));

    const title = document.createElement('div');
    title.className = 'tile-title';
    title.textContent = entry.title;

    const element = document.createElement('div');
    element.className = 'tile';
    element.tabIndex = 0;
    element.setAttribute('role', 'button');
    element.setAttribute('aria-label', 'Play video: ' + entry.title);
    element.append(cover, title);

    const item = { element, index, entry };

    itemByElement.set(element, item);
    return item;
  };

  const getPageFromUrl = () => {
    const value = parseInt(new URLSearchParams(location.search).get(PAGE_PARAM), 10);
    return Number.isFinite(value) ? value : 1;
  };

  const getVideoFromUrl = () => {
    const value = parseInt(new URLSearchParams(location.search).get(VIDEO_PARAM), 10);
    return Number.isInteger(value) && value >= 1 && value <= state.entries.length ? value : null;
  };

  const getQueryFromUrl = () =>
    normalizeQuery(new URLSearchParams(location.search).get(QUERY_PARAM) || '');

  const getGenreFromUrl = () => normalizeQuery(new URLSearchParams(location.search).get('genre') || '').toLowerCase();

  const getCategoryFromUrl = () => normalizeQuery(new URLSearchParams(location.search).get('category') || '').toLowerCase();

  const buildUrl = (page, video, query, genre = '', category = '') => {
    const params = new URLSearchParams(location.search);

    if (page <= 1) params.delete(PAGE_PARAM);
    else params.set(PAGE_PARAM, String(page));

    if (video) params.set(VIDEO_PARAM, String(video));
    else params.delete(VIDEO_PARAM);

    if (query) params.set(QUERY_PARAM, query);
    else params.delete(QUERY_PARAM);

    if (genre) params.set('genre', genre);
    else params.delete('genre');

    if (category) params.set('category', category);
    else params.delete('category');

    const search = params.toString();
    return location.pathname + (search ? '?' + search : '') + location.hash;
  };

  const normalizeUrl = (url) => {
    const current = location.pathname + location.search + location.hash;
    if (current !== url) history.replaceState(history.state, '', url);
  };

  const buildPageList = (current, total) => {
    const wanted = new Set([1, 2, current - 1, current, current + 1, total - 1, total]);
    const pages = [...wanted].filter((page) => page >= 1 && page <= total).sort((a, b) => a - b);
    const result = [];

    pages.forEach((page, index) => {
      if (index > 0) {
        const difference = page - pages[index - 1];
        if (difference === 2) result.push(page - 1);
        else if (difference > 2) result.push(null);
      }
      result.push(page);
    });

    return result;
  };

  const createPageControl = ({ page, text, label, current = false, disabled = false }) => {
    const element = document.createElement(disabled ? 'span' : 'a');
    element.className = 'page-btn';
    element.textContent = text;
    element.setAttribute('aria-label', label);

    if (disabled) {
      element.setAttribute('aria-disabled', 'true');
      return element;
    }

    element.href = buildUrl(page, null, state.query, state.genre, state.category);
    element.dataset.page = String(page);
    if (current) element.setAttribute('aria-current', 'page');
    return element;
  };

  const createPageGap = () => {
    const gap = document.createElement('span');
    gap.className = 'page-gap';
    gap.setAttribute('aria-hidden', 'true');
    gap.textContent = '–';
    return gap;
  };

  const renderPagination = () => {
    const { page, totalPages } = state;

    dom.pagination.hidden = totalPages <= 1;
    if (totalPages <= 1) return;

    const controls = [
      createPageControl({ page: page - 1, text: 'Previous', label: 'Previous page', disabled: page === 1 })
    ];

    for (const entry of buildPageList(page, totalPages)) {
      controls.push(entry === null
        ? createPageGap()
        : createPageControl({ page: entry, text: String(entry), label: 'Page ' + entry, current: entry === page }));
    }

    controls.push(
      createPageControl({ page: page + 1, text: 'Next', label: 'Next page', disabled: page === totalPages })
    );

    dom.pageList.replaceChildren(...controls);
  };

  const renderSearchStatus = () => {
    const { query, results } = state;
    const count = results.length;

    dom.searchStatus.hidden = count > 0 && !query;
    if (dom.searchStatus.hidden) return;

    if (count === 0) {
      dom.searchStatus.textContent = query
        ? 'No videos found for “' + query + '”. Try a title, cast name, or category.'
        : state.category ? 'No videos found in this category.' : 'No videos found in this genre.';
      return;
    }

    dom.searchStatus.textContent = count + (count === 1 ? ' video' : ' videos') + ' found for “' + query + '”';
  };

  const setTitle = (label = '') => {
    document.title = label ? label + ' - ' + BASE_TITLE : BASE_TITLE;
  };

  const renderPage = async () => {
    const token = ++state.loadToken;
    const start = (state.page - 1) * state.perPage;
    const queue = state.results
      .slice(start, start + state.perPage)
      .map((entry, index) => ({ entry, index }));

    state.items = [];
    dom.message.hidden = true;
    dom.gallery.classList.remove('is-sections');
    dom.gallery.replaceChildren();
    renderPagination();
    dom.scroller.scrollTo(0, 0);
    setLoading(queue.length > 0);

    await runPool(queue, CONFIG.concurrency, async ({ entry, index }) => {
      if (token !== state.loadToken) return;

      const cover = await loadCover(entry);
      if (!cover || token !== state.loadToken) return;

      const item = createTile(cover, entry, index);
      state.items.push(item);
      const next = orderedItems().find((other) => other.index > index);
      dom.gallery.insertBefore(item.element, next ? next.element : null);
    });

    if (token !== state.loadToken) return;

    setLoading(false);
    if (queue.length > 0 && state.items.length === 0) showMessage(MESSAGES.allFailed);
  };

  const buildGroups = (entries) => {
    const map = new Map();

    entries.forEach((entry) => {
      const keys = entry.genreKeys.length > 0 ? entry.genreKeys : [''];

      keys.forEach((key) => {
        if (!map.has(key)) {
          map.set(key, { key, label: key === '' ? 'Other' : genreLabelFor(key), entries: [], first: Infinity });
        }

        const group = map.get(key);
        group.entries.push(entry);
        group.first = Math.min(group.first, entry.number);
      });
    });

    const order = CONFIG.genreOrder.map((name) => String(name).trim().toLowerCase());
    const rank = (group) => (group.key === '' ? 2 : order.includes(group.key) ? 0 : 1);

    return [...map.values()].sort(
      (a, b) =>
        rank(a) - rank(b) ||
        (rank(a) === 0 ? order.indexOf(a.key) - order.indexOf(b.key) : a.first - b.first)
    );
  };

  const ROW_ICONS = {
    '-1': '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" /></svg>',
    '1': '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>'
  };

  const bindRow = (grid, prev, next) => {
    const update = () => {
      const max = grid.scrollWidth - grid.clientWidth;
      prev.hidden = next.hidden = max <= 2;
      prev.disabled = grid.scrollLeft <= 2;
      next.disabled = grid.scrollLeft >= max - 2;
    };
    const scrollBy = (direction) => {
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      grid.scrollBy({ left: direction * Math.max(240, grid.clientWidth * 0.85), behavior: reduced ? 'auto' : 'smooth' });
    };

    prev.addEventListener('click', () => scrollBy(-1));
    next.addEventListener('click', () => scrollBy(1));
    grid.addEventListener('scroll', update, { passive: true });
    new ResizeObserver(update).observe(grid);
    grid.update = update;
  };

  const createSection = (group, limit) => {
    const section = document.createElement('section');
    section.className = 'genre-section';
    section.hidden = true;
    section.setAttribute('aria-label', group.label);

    const head = document.createElement('div');
    head.className = 'genre-section-head';

    const title = document.createElement('h2');
    title.className = 'genre-title';
    title.textContent = group.label;

    const tools = document.createElement('div');
    tools.className = 'genre-tools';

    const nav = document.createElement('div');
    nav.className = 'row-nav';

    const buttons = [-1, 1].map((direction) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'row-btn';
      b.hidden = true;
      b.setAttribute('aria-label', (direction < 0 ? 'Scroll left in ' : 'Scroll right in ') + group.label);
      b.innerHTML = ROW_ICONS[String(direction)];
      return b;
    });
    nav.append(...buttons);
    tools.append(nav);

    if (group.entries.length > limit) {
      const key = group.key === '' ? OTHER_KEY : group.key;
      const more = document.createElement('a');
      more.className = 'genre-more';
      more.href = buildUrl(1, null, '', key);
      more.dataset.genre = key;
      more.textContent = 'View all (' + group.entries.length + ')';
      tools.append(more);
    }

    head.append(title, tools);

    const grid = document.createElement('div');
    grid.className = 'tile-grid tile-row';
    bindRow(grid, buttons[0], buttons[1]);

    section.append(head, grid);
    return { section, grid };
  };

  const renderHome = async () => {
    const token = ++state.loadToken;
    const limit = CONFIG.rowLimit;
    const queue = [];
    let index = 0;

    state.items = [];
    dom.message.hidden = true;
    dom.pagination.hidden = true;
    dom.gallery.classList.add('is-sections');
    dom.gallery.replaceChildren();
    dom.scroller.scrollTo(0, 0);

    for (const group of buildGroups(state.results)) {
      const { section, grid } = createSection(group, limit);
      dom.gallery.append(section);
      group.entries.slice(0, limit).forEach((entry) => queue.push({ entry, index: index++, section, grid }));
    }

    setLoading(queue.length > 0);

    await runPool(queue, CONFIG.concurrency, async ({ entry, index: position, section, grid }) => {
      if (token !== state.loadToken) return;

      const cover = await loadCover(entry);
      if (!cover || token !== state.loadToken) return;

      const item = createTile(cover, entry, position);
      item.container = grid;
      state.items.push(item);

      const next = orderedItems().find((other) => other.container === grid && other.index > position);
      grid.insertBefore(item.element, next ? next.element : null);
      section.hidden = false;
      grid.update();
    });

    if (token !== state.loadToken) return;

    setLoading(false);
    if (queue.length > 0 && state.items.length === 0) showMessage(MESSAGES.allFailed);
  };

  const LOADING_STAGES = Object.freeze([
    [0, 'Connecting to the server…'],
    [5000, 'The server is slow to respond. Please wait a moment…'],
    [15000, 'Still waiting for the server. If nothing appears, try reloading.']
  ]);

  let loadingTimers = [];

  const clearLoading = () => {
    loadingTimers.forEach(clearTimeout);
    loadingTimers = [];
    dom.playerLoading.hidden = true;
    dom.playerRetry.hidden = true;
  };

  const startLoading = (entry) => {
    clearLoading();
    dom.playerLoading.style.backgroundImage = entry.poster ? 'url(' + JSON.stringify(entry.poster) + ')' : '';
    dom.playerLoading.hidden = false;

    LOADING_STAGES.forEach(([delay, text], index) => {
      const show = () => {
        dom.playerLoadingText.textContent = text;
        dom.playerRetry.hidden = index < LOADING_STAGES.length - 1;
      };

      if (delay === 0) show();
      else loadingTimers.push(setTimeout(show, delay));
    });
  };

  const failLoading = () => {
    loadingTimers.forEach(clearTimeout);
    loadingTimers = [];
    dom.playerLoading.hidden = false;
    dom.playerLoadingText.textContent = 'The video failed to load. Check your connection or try again.';
    dom.playerRetry.hidden = false;
  };

  const stopWatchVideo = () => {
    clearLoading();
    dom.watchVideo.pause();
    dom.watchVideo.removeAttribute('src');
    dom.watchVideo.removeAttribute('poster');
    dom.watchVideo.load();
    dom.watchPlayer.querySelector('iframe')?.remove();
    dom.watchPlayer.classList.remove('is-embed');
  };

  const createEmbedFrame = (entry) => {
    const frame = document.createElement('iframe');
    frame.title = entry.title;
    frame.allow = EMBED_ALLOW;
    frame.allowFullscreen = true;
    frame.referrerPolicy = 'strict-origin-when-cross-origin';
    frame.addEventListener('load', () => {
      try {
        if (frame.contentWindow.location.href === 'about:blank') return;
      } catch {
        // cross-origin: the real embed page has loaded
      }

      clearLoading();
    });
    frame.src = entry.url;
    return frame;
  };

  const playEntry = (entry) => {
    stopWatchVideo();

    startLoading(entry);

    if (entry.type === 'embed') {
      dom.watchPlayer.classList.add('is-embed');
      dom.watchPlayer.append(createEmbedFrame(entry));
      return;
    }

    if (entry.poster) dom.watchVideo.poster = entry.poster;
    dom.watchVideo.src = entry.url;
    dom.watchVideo.play().catch(() => {});
  };

  const createMetaLink = (text) => {
    const link = document.createElement('a');
    link.className = 'meta-link';
    link.href = buildUrl(1, null, text);
    link.dataset.query = text;
    link.textContent = text;
    return link;
  };

  const joinWithCommas = (nodes) =>
    nodes.flatMap((node, index) => (index === 0 ? [node] : [' ', node]));

  const getRecommendationLimit = () =>
    isSingleColumn() ? CONFIG.mobileRecommendations : CONFIG.recommendations;

  const buildRecommendations = (entry) => {
    const others = state.entries.filter((other) => other !== entry);
    const norm = (list) => list.map((value) => value.trim().toLowerCase());
    const overlap = (a, b) => {
      const pool = new Set(norm(b));
      return norm(a).filter((value) => pool.has(value)).length;
    };

    // 1) same cast first, most shared cast members on top (stable sort keeps the original order for ties)
    const sameCast = others
      .map((other) => ({ other, score: overlap(other.cast, entry.cast) }))
      .filter((row) => row.score > 0)
      .sort((x, y) => y.score - x.score)
      .map((row) => row.other);

    // 2) then same category, 3) then same genre
    const sameCategory = others.filter(
      (other) => overlap(other.categories, entry.categories) > 0 && !sameCast.includes(other)
    );
    const sameGenre = others.filter(
      (other) =>
        overlap(other.genres, entry.genres) > 0 && !sameCast.includes(other) && !sameCategory.includes(other)
    );
    const related = [...sameCast, ...sameCategory, ...sameGenre];

    return (related.length > 0 ? related : others).slice(0, getRecommendationLimit());
  };

  const createRecommendationMeta = (text) => {
    const meta = document.createElement('span');
    meta.className = 'rec-meta';
    meta.textContent = text;
    return meta;
  };

  const createRecommendationCover = (entry) => {
    const fromVideo = () => {
      const video = createCoverVideo();
      video.src = coverSource(entry.url);
      return video;
    };

    if (!entry.cover) return entry.type === 'video' ? fromVideo() : createCoverFallback();

    const image = new Image();
    image.alt = '';
    image.draggable = false;
    image.onerror = () => image.replaceWith(entry.type === 'video' ? fromVideo() : createCoverFallback());
    image.src = entry.cover;
    return image;
  };

  const createRecommendation = (entry) => {
    const thumbnail = document.createElement('span');
    thumbnail.className = 'rec-thumb';
    thumbnail.append(createRecommendationCover(entry), ...createDuration(entry));

    const title = document.createElement('span');
    title.className = 'rec-title';
    title.textContent = entry.title;

    const info = document.createElement('span');
    info.className = 'rec-info';
    info.append(title);

    if (entry.cast.length > 0) info.append(createRecommendationMeta(entry.cast.join(', ')));

    const link = document.createElement('a');
    link.className = 'rec';
    link.href = buildUrl(1, entry.number, getQueryFromUrl());
    link.dataset.video = String(entry.number);
    link.append(thumbnail, info);

    const item = document.createElement('li');
    item.append(link);
    return item;
  };

  const createMoreCard = (entry) => {
    const cover = document.createElement('div');
    cover.className = 'tile-cover';
    cover.append(createRecommendationCover(entry), ...createDuration(entry));

    const title = document.createElement('span');
    title.className = 'tile-title';
    title.textContent = entry.title;

    const link = document.createElement('a');
    link.className = 'tile';
    link.href = buildUrl(1, entry.number, getQueryFromUrl());
    link.dataset.video = String(entry.number);
    link.append(cover, title);

    const item = document.createElement('li');
    item.append(link);
    return item;
  };

  const distributeRecommendations = () => {
    const items = state.recommended;
    dom.recommendationList.replaceChildren(...items.map((item) => item.row));
    dom.recommendationMoreList.replaceChildren();
    dom.recommendationMore.hidden = true;

    if (!isWatching() || !window.matchMedia(CONFIG.watchColumnsQuery).matches) return;

    const limit = dom.recommendations.getBoundingClientRect().bottom;
    const overflowIndex = items.findIndex((item) => item.row.getBoundingClientRect().bottom > limit);
    if (overflowIndex === -1) return;

    const overflow = items.slice(overflowIndex);
    dom.recommendationList.replaceChildren(...items.slice(0, overflowIndex).map((item) => item.row));
    dom.recommendationMoreList.replaceChildren(
      ...overflow.map((item) => (item.card ??= createMoreCard(item.entry)))
    );
    dom.recommendationMore.hidden = false;
  };

  const renderRecommendations = (entry) => {
    const list = buildRecommendations(entry);

    state.recommended = list.map((other) => ({ entry: other, row: createRecommendation(other), card: null }));
    dom.recommendations.hidden = list.length === 0;
    distributeRecommendations();
  };

  const setInfoOpen = (open, save) => {
    dom.watchInfo.classList.toggle('is-collapsed', !open);
    dom.watchInfo.inert = !open;
    dom.infoToggle.setAttribute('aria-expanded', String(open));
    dom.infoToggle.querySelector('.info-toggle-label').textContent = open ? 'Hide info' : 'Show info';
    if (!save) return;

    try {
      localStorage.setItem(INFO_KEY, open ? '1' : '0');
    } catch {
      return;
    }
  };

  const readInfoPref = () => {
    try {
      return localStorage.getItem(INFO_KEY) !== '0';
    } catch {
      return true;
    }
  };

  const renderWatchDetails = (entry) => {
    dom.watchTitle.textContent = entry.title;
    const hasInfo = entry.cast.length > 0 || entry.categories.length > 0;
    dom.infoToggle.hidden = !hasInfo;
    dom.watchInfo.hidden = !hasInfo;
    dom.watchCastRow.hidden = entry.cast.length === 0;
    dom.watchCast.replaceChildren(...joinWithCommas(entry.cast.map(createMetaLink)));
    dom.watchCategoryRow.hidden = entry.categories.length === 0;
    dom.watchCategory.replaceChildren(...joinWithCommas(entry.categories.map(createMetaLink)));
  };

  const showWatch = (number, query) => {
    if (!isWatching()) state.gridScroll = dom.scroller.scrollTop;

    const entry = findEntry(number);
    state.watching = entry;

    normalizeUrl(buildUrl(1, number, query));
    dom.scroller.classList.add('is-watching');
    syncProgress();

    playEntry(entry);

    renderWatchDetails(entry);
    renderRecommendations(entry);
    setTitle(entry.title);

    dom.scroller.scrollTo(0, 0);
    dom.watchTitle.focus({ preventScroll: true });
  };

  const countPages = () => Math.max(1, Math.ceil(state.results.length / state.perPage));

  const measurePerPage = () => {
    const tracks = getComputedStyle(dom.gridProbe).gridTemplateColumns.split(' ');
    const columns = tracks.filter((track) => track.endsWith('px')).length;
    if (columns === 0) return state.perPage || CONFIG.perPageByColumns[0];

    state.columns = columns;

    return CONFIG.perPageByColumns[Math.min(columns, CONFIG.perPageByColumns.length) - 1];
  };

  const syncPerPage = () => {
    const perPage = measurePerPage();
    if (perPage === state.perPage) return false;

    state.perPage = perPage;
    if (state.results !== null) {
      state.totalPages = countPages();
      state.page = 0;
    }
    return true;
  };

  const handleGalleryResize = () => {
    if (isWatching() || state.results === null) return;

    const firstIndex = (state.page - 1) * state.perPage;
    if (!syncPerPage()) return;

    navigate(Math.floor(firstIndex / state.perPage) + 1, null, state.query, 'replace', state.genre, state.category);
  };

  const renderGenreHead = () => {
    const show = state.genre !== '' || state.category !== '';
    dom.genreHead.hidden = !show;
    if (!show) return;

    const isGenre = state.genre !== '';
    const count = state.results.length;

    dom.genreBackText.textContent = isGenre ? 'All genres' : 'Home';
    dom.genreHeadTitle.textContent = isGenre ? genreLabelFor(state.genre) : categoryLabelFor(state.category);
    dom.genreHeadCount.textContent =
      (isGenre ? 'Genre' : 'Category') + ' · ' + count + (count === 1 ? ' video' : ' videos');
  };

  const showGrid = (query, genre, category, requestedPage) => {
    const wasWatching = isWatching();

    stopWatchVideo();
    dom.recommendationList.replaceChildren();
    dom.recommendationMoreList.replaceChildren();
    state.recommended = [];
    dom.scroller.classList.remove('is-watching');
    syncProgress();

    const sections = query === '' && genre === '' && category === '' && state.hasGenres;
    state.sections = sections;
    syncPerPage();

    if (state.results === null || query !== state.query || genre !== state.genre || category !== state.category) {
      state.query = query;
      state.genre = genre;
      state.category = category;
      state.results = filterEntries(query, genre, category);
      state.totalPages = sections ? 1 : countPages();
      state.page = 0;
      renderSearchStatus();
      renderGenreHead();
    }

    const page = sections ? 1 : clamp(requestedPage, 1, state.totalPages);
    const titleParts = [
      query && 'Search: ' + query,
      genre && genreLabelFor(genre),
      category && categoryLabelFor(category),
      page > 1 && 'Page ' + page
    ];

    normalizeUrl(buildUrl(page, null, query, genre, category));
    syncCategoryNav();
    setTitle(titleParts.filter(Boolean).join(' - '));

    if (state.page !== page) {
      state.page = page;
      if (sections) renderHome();
      else renderPage();
      return;
    }

    if (wasWatching) dom.scroller.scrollTo(0, state.gridScroll);
  };

  const syncSearchInput = (query) => {
    if (normalizeQuery(dom.searchInput.value) !== query) dom.searchInput.value = query;
    dom.searchClear.hidden = dom.searchInput.value === '';
  };

  const applyRoute = () => {
    const video = getVideoFromUrl();
    const query = getQueryFromUrl();

    syncSearchInput(query);

    if (video) showWatch(video, query);
    else showGrid(query, getGenreFromUrl(), getCategoryFromUrl(), getPageFromUrl());
  };

  const navigate = (page, video, query, mode, genre = '', category = '') => {
    const url = buildUrl(page, video, query, genre, category);

    if (mode === 'push') history.pushState(null, '', url);
    else history.replaceState(null, '', url);

    applyRoute();
  };

  const goHome = () => {
    if (!isWatching() && state.page === 1 && state.query === '' && state.genre === '' && state.category === '') {
      dom.scroller.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      navigate(1, null, '', 'push');
    }
  };

  const submitSearch = (value) => {
    const query = normalizeQuery(value);
    const currentQuery = getQueryFromUrl();

    if (!isWatching() && query === currentQuery) return;

    navigate(1, null, query, 'push');
  };

  const setSearching = (searching) => {
    dom.nav.classList.toggle('is-searching', searching);
    if (!searching) return;

    setMenuOpen(false);
    requestAnimationFrame(() => dom.searchInput.focus());
  };

  const handleSearchInput = () => {
    dom.searchClear.hidden = dom.searchInput.value === '';
  };

  const handleSearchSubmit = (event) => {
    event.preventDefault();
    submitSearch(dom.searchInput.value);
    dom.searchInput.blur();
  };

  const handleSearchClear = () => {
    dom.searchInput.value = '';
    dom.searchClear.hidden = true;
    submitSearch('');
    dom.searchInput.focus();
  };

  const handleSearchCancel = () => {
    if (dom.searchInput.value !== '') {
      dom.searchInput.value = '';
      dom.searchClear.hidden = true;
      submitSearch('');
    }
    setSearching(false);
  };

  const bindSearch = () => {
    dom.searchInput.addEventListener('input', handleSearchInput);
    dom.searchForm.addEventListener('submit', handleSearchSubmit);
    dom.searchClear.addEventListener('click', handleSearchClear);
    dom.searchToggle.addEventListener('click', () => setSearching(true));
    dom.searchClose.addEventListener('click', handleSearchCancel);
  };

  const currentTheme = () =>
    document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';

  const syncThemeControls = () => {
    const theme = currentTheme();
    dom.themeToggle.setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
    dom.themeColorMeta.content = THEME_COLORS[theme];
  };

  const saveTheme = (theme) => {
    try {
      localStorage.setItem(THEME_KEY, theme);
    } catch {
      return;
    }
  };

  const setTheme = (theme) => {
    document.documentElement.dataset.theme = theme;
    saveTheme(theme);
    syncThemeControls();
  };

  const isMenuOpen = () => dom.nav.classList.contains('is-open');

  const setMenuOpen = (open) => {
    dom.nav.classList.toggle('is-open', open);
    dom.navToggle.setAttribute('aria-expanded', String(open));
    dom.navToggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    if (!open) setCatsOpen(false);
  };

  const isCatsOpen = () => dom.catsToggle.getAttribute('aria-expanded') === 'true';

  const positionCatsPanel = () => {
    dom.catsPanel.style.left = '';
    if (dom.catsPanel.hidden || getComputedStyle(dom.catsPanel).position !== 'absolute') return;

    const margin = 12;
    const overflow = dom.catsPanel.getBoundingClientRect().right - (window.innerWidth - margin);
    if (overflow > 0) dom.catsPanel.style.left = 'calc(-14px - ' + Math.ceil(overflow) + 'px)';
  };

  const setCatsOpen = (open) => {
    dom.catsToggle.setAttribute('aria-expanded', String(open));
    dom.catsPanel.hidden = !open;
    positionCatsPanel();
  };

  const renderCategoryNav = () => {
    state.categoryList = buildCategoryList();
    dom.navCats.hidden = state.categoryList.length === 0;

    dom.catsList.replaceChildren(
      ...state.categoryList.map((item) => {
        const link = document.createElement('a');
        link.className = 'cat-chip';
        link.href = buildUrl(1, null, '', '', item.key);
        link.dataset.category = item.key;

        const label = document.createElement('span');
        label.textContent = item.label;

        const count = document.createElement('span');
        count.className = 'cat-count';
        count.textContent = '(' + item.count + ')';

        link.append(label, count);
        return link;
      })
    );
  };

  function syncCategoryNav() {
    for (const link of dom.catsList.children) {
      if (link.dataset.category === state.category) link.setAttribute('aria-current', 'true');
      else link.removeAttribute('aria-current');
    }

    dom.catsToggle.classList.toggle('is-active', state.category !== '');
  }

  const handleNavClick = (event) => {
    const link = closestFromEvent(event, 'a');
    if (!link) return;

    if (link.dataset.category !== undefined) {
      if (!isModifiedClick(event)) {
        event.preventDefault();
        navigate(1, null, '', 'push', '', link.dataset.category);
        setCatsOpen(false);
        setMenuOpen(false);
      }
      return;
    }

    if (link.getAttribute('href') === '#') {
      event.preventDefault();
    } else if (link.hasAttribute('data-home') && !isModifiedClick(event) && state.entries.length > 0) {
      event.preventDefault();
      goHome();
    }

    setMenuOpen(false);
  };

  const handleOutsideClick = (event) => {
    if (!isMenuOpen() || dom.nav.contains(event.target)) return;

    event.preventDefault();
    event.stopPropagation();
    setMenuOpen(false);
  };

  const bindNavbar = () => {
    dom.navToggle.addEventListener('click', () => setMenuOpen(!isMenuOpen()));
    dom.themeToggle.addEventListener('click', () => setTheme(currentTheme() === 'dark' ? 'light' : 'dark'));
    dom.nav.addEventListener('click', handleNavClick);
    dom.catsToggle.addEventListener('click', () => setCatsOpen(!isCatsOpen()));
    window.addEventListener('resize', positionCatsPanel);
    document.addEventListener('click', (event) => {
      if (isCatsOpen() && !dom.navCats.contains(event.target)) setCatsOpen(false);
    });
    document.addEventListener('click', handleOutsideClick, true);
    window.matchMedia(CONFIG.singleColumnQuery).addEventListener('change', () => {
      if (isWatching() && state.watching) renderRecommendations(state.watching);
    });

    window.matchMedia(CONFIG.mobileNavQuery).addEventListener('change', () => {
      setCatsOpen(false);
      setMenuOpen(false);
      setSearching(false);
    });
  };

  const openTile = (tile) => {
    const item = itemByElement.get(tile);
    if (item) navigate(1, item.entry.number, state.query, 'push');
  };

  const handleGalleryClick = (event) => {
    const more = closestFromEvent(event, 'a[data-genre]');
    if (more) {
      if (!isModifiedClick(event)) {
        event.preventDefault();
        navigate(1, null, '', 'push', more.dataset.genre);
      }
      return;
    }

    const tile = closestFromEvent(event, '.tile');
    if (tile) openTile(tile);
  };

  const handleGalleryKeydown = (event) => {
    if (event.key !== 'Enter' && event.key !== ' ') return;

    const tile = closestFromEvent(event, '.tile');
    if (!tile) return;

    event.preventDefault();
    openTile(tile);
  };

  const handlePaginationClick = (event) => {
    const link = closestFromEvent(event, 'a[data-page]');
    if (!link || isModifiedClick(event)) return;

    event.preventDefault();

    const page = Number(link.dataset.page);
    if (page !== state.page) navigate(page, null, state.query, 'push', state.genre, state.category);
  };

  const handleRecommendationClick = (event) => {
    const link = closestFromEvent(event, 'a[data-video]');
    if (!link || isModifiedClick(event)) return;

    event.preventDefault();
    navigate(1, Number(link.dataset.video), getQueryFromUrl(), 'push');
  };

  const handleMetaClick = (event) => {
    const link = closestFromEvent(event, 'a[data-query]');
    if (!link || isModifiedClick(event)) return;

    event.preventDefault();
    navigate(1, null, link.dataset.query, 'push');
  };

  const handleEscape = (event) => {
    if (event.key !== 'Escape') return;

    if (isCatsOpen()) {
      setCatsOpen(false);
      dom.catsToggle.focus();
    } else if (isMenuOpen()) {
      setMenuOpen(false);
      dom.navToggle.focus();
    } else if (dom.nav.classList.contains('is-searching')) {
      setSearching(false);
    }
  };

  const bindEvents = () => {
    bindNavbar();
    bindSearch();

    dom.gallery.addEventListener('click', handleGalleryClick);
    dom.genreHead.addEventListener('click', (event) => {
      const back = closestFromEvent(event, 'a[data-home]');
      if (!back || isModifiedClick(event)) return;

      event.preventDefault();
      goHome();
    });
    dom.gallery.addEventListener('keydown', handleGalleryKeydown);
    dom.pagination.addEventListener('click', handlePaginationClick);
    dom.recommendationList.addEventListener('click', handleRecommendationClick);
    dom.recommendationMoreList.addEventListener('click', handleRecommendationClick);
    dom.watchMeta.addEventListener('click', handleMetaClick);
    dom.playerRetry.addEventListener('click', () => {
      if (state.watching) playEntry(state.watching);
    });
    dom.watchVideo.addEventListener('loadeddata', clearLoading);
    dom.watchVideo.addEventListener('playing', clearLoading);
    dom.watchVideo.addEventListener('waiting', () => {
      if (state.watching && dom.watchVideo.getAttribute('src')) startLoading(state.watching);
    });
    dom.watchVideo.addEventListener('error', () => {
      if (dom.watchVideo.getAttribute('src')) failLoading();
    });
    dom.infoToggle.addEventListener('click', () => setInfoOpen(dom.infoToggle.getAttribute('aria-expanded') !== 'true', true));

    dom.watchVideo.addEventListener('contextmenu', (event) => event.preventDefault());

    document.addEventListener('keydown', handleEscape);
    window.addEventListener('popstate', () => {
      if (state.entries.length > 0) applyRoute();
    });
    new ResizeObserver(distributeRecommendations).observe(dom.watchMain);
    new ResizeObserver(handleGalleryResize).observe(dom.gridProbe);
  };

  const loadEntries = async () => {
    const response = await fetchWithTimeout(CONFIG.dataFile, CONFIG.fetchTimeout);
    if (!response.ok) throw new Error('HTTP ' + response.status);
    return parseEntries(await response.json());
  };

  const applySiteTitle = () => {
    document.title = BASE_TITLE;
    dom.brand.textContent = BASE_TITLE;
    dom.brand.setAttribute('aria-label', BASE_TITLE + ' - home');
    dom.siteHeading.textContent = BASE_TITLE;
    dom.metaDescription.setAttribute('content', BASE_TITLE + ': browse and watch videos by title, cast, and category.');
  };

  const init = async () => {
    applySiteTitle();
    syncThemeControls();
    setInfoOpen(readInfoPref(), false);
    bindEvents();

    try {
      state.entries = await loadEntries();
    } catch (error) {
      showMessage(error instanceof SyntaxError ? MESSAGES.invalidJson : MESSAGES.fetchFailed);
      return;
    }

    if (state.entries.length === 0) {
      showMessage(MESSAGES.noVideos);
      return;
    }

    state.hasGenres = state.entries.some((entry) => entry.genreKeys.length > 0);
    renderCategoryNav();
    applyRoute();
  };

  init();
})();
</script>
</body>
</html>
