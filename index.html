<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#ececea" />
<title>Galeri SB99</title>
<script>
  (function () {
    var theme = 'light';
    try {
      if (localStorage.getItem('sb99-theme') === 'dark') theme = 'dark';
    } catch (error) {}
    document.documentElement.dataset.theme = theme;
    if (theme === 'dark') document.querySelector('meta[name="theme-color"]').content = '#0e0e0e';
  })();
</script>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=Bricolage+Grotesque:wght@700;800&amp;display=swap" />
<style>
  :root {
    color-scheme: light;

    --gap: 12px;
    --radius: 4px;

    --bg: #ececea;
    --bar: #ececea;
    --hover: #e0e0dd;
    --placeholder: #dcdcd9;
    --line: #cfcfcb;
    --ink: #131313;
    --ink-muted: #6b6b67;
    --on-ink: #ececea;

    --nav-h: 60px;
    --footer-h: 42px;

    --font: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-display: "Bricolage Grotesque", var(--font);
  }

  :root[data-theme="dark"] {
    color-scheme: dark;

    --bg: #0e0e0e;
    --bar: #0e0e0e;
    --hover: #1d1d1d;
    --placeholder: #1a1a1a;
    --line: #2a2a2a;
    --ink: #f1f1ee;
    --ink-muted: #9a9a95;
    --on-ink: #0e0e0e;
  }

  @media (max-width: 600px) {
    :root {
      --gap: 10px;
      --nav-h: 56px;
      --footer-h: 38px;
    }
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  [hidden] {
    display: none !important;
  }

  html {
    background: var(--bg);
  }

  html,
  body {
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    color: var(--ink);
    font-family: var(--font);
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }

  ::selection {
    background: var(--ink);
    color: var(--on-ink);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  .scroller {
    position: fixed;
    top: calc(var(--nav-h) + env(safe-area-inset-top));
    right: 0;
    bottom: calc(var(--footer-h) + env(safe-area-inset-bottom));
    left: 0;
    overflow-x: hidden;
    overflow-y: scroll;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: var(--ink-muted) var(--bg);
  }

  .site-nav {
    position: fixed;
    top: 0;
    right: 0;
    left: 0;
    z-index: 35;
    display: flex;
    align-items: center;
    gap: 28px;
    height: calc(var(--nav-h) + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) max(var(--gap), env(safe-area-inset-right)) 0 max(var(--gap), env(safe-area-inset-left));
    background: var(--bar);
    border-bottom: 1px solid var(--line);
    -webkit-tap-highlight-color: transparent;
  }

  .brand {
    flex: none;
    color: var(--ink);
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -.03em;
    line-height: 1;
    text-decoration: none;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }

  .brand:focus-visible,
  .nav-link:focus-visible,
  .search-clear:focus-visible,
  .search-submit:focus-visible,
  .search-close:focus-visible,
  .meta-link:focus-visible,
  .nav-btn:focus-visible,
  a.page-btn:focus-visible,
  .tile:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 4px;
  }

  .nav-menu {
    display: flex;
    align-items: center;
    gap: 22px;
  }

  .nav-link {
    position: relative;
    display: inline-flex;
    align-items: center;
    height: 36px;
    color: var(--ink-muted);
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    transition: color .15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .nav-link:hover,
  .nav-link[aria-current="page"] {
    color: var(--ink);
  }

  .nav-link[aria-current="page"]::after {
    content: "";
    position: absolute;
    right: 0;
    bottom: -13px;
    left: 0;
    height: 2px;
    background: var(--ink);
  }

  .nav-btn {
    display: inline-flex;
    flex: none;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: background .15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .nav-btn:hover {
    background: var(--hover);
  }

  .nav-btn svg {
    display: block;
  }

  .nav-toggle,
  .nav-toggle .icon-x,
  .theme-toggle .icon-sun {
    display: none;
  }

  .site-nav.is-open .nav-toggle .icon-burger {
    display: none;
  }

  .site-nav.is-open .nav-toggle .icon-x {
    display: block;
  }

  .search {
    display: flex;
    flex: 0 1 440px;
    align-items: center;
    min-width: 0;
    margin-left: auto;
  }

  .search-box {
    display: flex;
    flex: 1;
    align-items: center;
    min-width: 0;
    height: 40px;
    padding: 0 6px 0 8px;
    background: var(--hover);
    border: 1px solid transparent;
    border-radius: 20px;
    transition: border-color .15s ease;
  }

  .search-box:focus-within {
    border-color: var(--ink);
  }

  .search-submit {
    display: inline-flex;
    flex: none;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--ink-muted);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .search-submit:hover {
    background: var(--line);
    color: var(--ink);
  }

  .search-input {
    flex: 1;
    min-width: 0;
    height: 100%;
    padding: 0 8px;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 15px;
    -webkit-appearance: none;
    appearance: none;
  }

  .search-input::placeholder {
    color: var(--ink-muted);
  }

  .search-input::-webkit-search-cancel-button {
    display: none;
    -webkit-appearance: none;
  }

  .search-clear {
    display: inline-flex;
    flex: none;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--ink-muted);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .search-clear:hover {
    background: var(--line);
    color: var(--ink);
  }

  .search-toggle,
  .search-close {
    display: none;
  }

  :root[data-theme="dark"] .theme-toggle .icon-moon {
    display: none;
  }

  :root[data-theme="dark"] .theme-toggle .icon-sun {
    display: block;
  }

  @media (max-width: 720px) {
    .site-nav {
      gap: 10px;
    }

    .nav-toggle {
      display: inline-flex;
      margin-left: -8px;
    }

    .brand {
      font-size: 23px;
    }

    .search {
      flex: none;
    }

    .search-box {
      display: none;
    }

    .search-input {
      font-size: 16px;
    }

    .search-toggle {
      display: inline-flex;
    }

    .site-nav.is-searching {
      gap: 8px;
    }

    .site-nav.is-searching :is(.nav-toggle, .brand, .theme-toggle, .search-toggle) {
      display: none;
    }

    .site-nav.is-searching .search {
      flex: 1;
    }

    .site-nav.is-searching .search-box {
      display: flex;
    }

    .site-nav.is-searching .search-close {
      display: inline-flex;
    }

    .site-nav.is-searching .search-clear {
      display: none;
    }

    .nav-menu {
      position: fixed;
      top: calc(var(--nav-h) + env(safe-area-inset-top));
      right: 0;
      left: 0;
      z-index: 36;
      display: none;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      padding: 4px max(var(--gap), env(safe-area-inset-left)) 12px;
      background: var(--bar);
      border-bottom: 1px solid var(--line);
    }

    .site-nav.is-open .nav-menu {
      display: flex;
      animation: menu-in .16s ease backwards;
    }

    .nav-link {
      height: 52px;
      border-bottom: 1px solid var(--line);
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.02em;
    }

    .nav-link:last-child {
      border-bottom: 0;
    }

    .nav-link[aria-current="page"]::after {
      top: 14px;
      right: auto;
      bottom: 14px;
      left: -12px;
      width: 3px;
      height: auto;
    }
  }

  @keyframes menu-in {
    from {
      opacity: 0;
      transform: translateY(-6px);
    }
  }

  .site-footer {
    position: fixed;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    height: calc(var(--footer-h) + env(safe-area-inset-bottom));
    padding: 0 var(--gap) env(safe-area-inset-bottom);
    background: var(--bar);
    border-top: 1px solid var(--line);
  }

  .footer-text {
    margin: 0;
    color: var(--ink-muted);
    font-size: 13px;
  }

  .progress {
    position: fixed;
    top: calc(var(--nav-h) + env(safe-area-inset-top));
    right: 0;
    left: 0;
    z-index: 40;
    height: 2px;
    overflow: hidden;
    pointer-events: none;
  }

  .progress::before {
    content: "";
    position: absolute;
    inset: 0;
    width: 35%;
    background: var(--ink);
    animation: progress-slide 1.1s ease-in-out infinite;
  }

  @keyframes progress-slide {
    from { transform: translateX(-100%); }
    to { transform: translateX(290%); }
  }

  #gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 22px var(--gap);
    width: 100%;
    padding: var(--gap);
  }

  a.tile {
    color: inherit;
    text-decoration: none;
  }

  .tile {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
    margin: 0;
    outline: none;
    cursor: pointer;
    animation: tile-in .3s ease backwards;
    -webkit-tap-highlight-color: transparent;
  }

  .tile-cover {
    position: relative;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: var(--placeholder);
    border-radius: var(--radius);
  }

  .tile:focus-visible .tile-cover {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }

  .tile-title {
    display: -webkit-box;
    overflow: hidden;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.35;
    overflow-wrap: anywhere;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }

  .tile :is(video, img) {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    border-radius: inherit;
    pointer-events: none;
    transition: filter .2s ease;
  }

  .cover-fallback {
    display: block;
    width: 100%;
    height: 100%;
    background: var(--placeholder);
    pointer-events: none;
  }

  .badge {
    position: absolute;
    bottom: 8px;
    left: 8px;
    z-index: 1;
    max-width: calc(100% - 16px);
    padding: 5px 8px 6px;
    overflow: hidden;
    border-radius: 3px;
    background: var(--bg);
    color: var(--ink);
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: .005em;
    line-height: 1;
    text-overflow: ellipsis;
    white-space: nowrap;
    pointer-events: none;
  }

  .badge[data-genre="indo"] {
    background: #d92d2d;
    color: #fff;
  }

  .badge[data-genre="korea"] {
    background: #2563eb;
    color: #fff;
  }

  .badge[data-genre="barat"] {
    background: #1f9d55;
    color: #fff;
  }

  .badge[data-genre="china"] {
    background: #f5c518;
    color: #111;
  }

  .play {
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 1;
    display: grid;
    place-items: center;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--bg);
    color: var(--ink);
    transform: translate(-50%, -50%);
    pointer-events: none;
    transition: transform .2s ease;
  }

  .play svg {
    width: 20px;
    height: 20px;
    margin-left: 2px;
  }

  @media (hover: hover) {
    .tile:hover .tile-cover :is(video, img) {
      filter: brightness(.82);
    }

    .tile:hover .tile-title {
      text-decoration: underline;
    }

    .tile:hover .play {
      transform: translate(-50%, -50%) scale(1.12);
    }
  }

  .tile:active .play {
    transform: translate(-50%, -50%) scale(.95);
  }

  @keyframes tile-in {
    from { opacity: 0; }
  }

  .pagination {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px var(--gap) 36px;
  }

  .page-list {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .page-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 40px;
    height: 40px;
    padding: 0 10px;
    color: var(--ink-muted);
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    text-decoration: none;
    transition: color .15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  a.page-btn:hover {
    color: var(--ink);
  }

  .page-btn[aria-current="page"] {
    color: var(--ink);
    font-weight: 700;
  }

  .page-btn[aria-current="page"]::after {
    content: "";
    position: absolute;
    right: 10px;
    bottom: 4px;
    left: 10px;
    height: 2px;
    background: var(--ink);
  }

  .page-btn[aria-disabled="true"] {
    opacity: .35;
    pointer-events: none;
  }

  .page-gap {
    min-width: 18px;
    color: var(--ink-muted);
    text-align: center;
  }

  .scroller:not(.is-watching) .watch {
    display: none;
  }

  .scroller.is-watching :is(#gallery, #pagination, #message, #search-status) {
    display: none;
  }

  .search-status {
    margin: 0;
    padding: calc(var(--gap) + 6px) var(--gap) 0;
    color: var(--ink-muted);
    font-size: 15px;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }

  .watch {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 380px;
    grid-template-areas:
      "main side"
      "more more";
    gap: 28px;
    align-items: start;
    max-width: 1600px;
    margin: 0 auto;
    padding: var(--gap) var(--gap) 40px;
  }

  .watch-main {
    grid-area: main;
    min-width: 0;
  }

  .recommendations {
    grid-area: side;
    align-self: stretch;
    overflow: hidden;
    contain: size;
  }

  .recommendations-more {
    grid-area: more;
  }

  .watch-player {
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: #000;
    border-radius: var(--radius);
  }

  .watch-player.is-embed video {
    display: none;
  }

  .watch-player :is(video, iframe) {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    border: 0;
  }

  .watch-title {
    margin: 16px 0 0;
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -.02em;
    line-height: 1.2;
    outline: none;
    overflow-wrap: anywhere;
  }

  .watch-meta {
    display: grid;
    gap: 8px;
    margin: 14px 0 0;
  }

  .watch-meta-row {
    display: grid;
    grid-template-columns: 84px minmax(0, 1fr);
    gap: 12px;
    align-items: baseline;
  }

  .watch-meta dt {
    color: var(--ink-muted);
    font-size: 14px;
  }

  .watch-meta dd {
    margin: 0;
    font-size: 16px;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }

  .meta-link {
    color: inherit;
    text-decoration: underline;
    text-decoration-color: var(--line);
    text-underline-offset: 3px;
    transition: text-decoration-color .15s ease;
  }

  .meta-link:hover {
    text-decoration-color: var(--ink);
  }

  .recommendations-title {
    margin: 0 0 14px;
    font-size: 16px;
    font-weight: 700;
  }

  .recommendation-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .recommendation-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 22px var(--gap);
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .rec {
    display: flex;
    gap: 12px;
    color: var(--ink);
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }

  .rec:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 4px;
  }

  .rec-thumb {
    flex: none;
    width: 168px;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: var(--placeholder);
    border-radius: var(--radius);
  }

  .rec-thumb :is(video, img) {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    pointer-events: none;
    transition: filter .2s ease;
  }

  .rec-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
    padding-top: 2px;
  }

  .rec-title {
    display: -webkit-box;
    overflow: hidden;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
    overflow-wrap: anywhere;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }

  .rec-meta {
    color: var(--ink-muted);
    font-size: 13px;
  }

  @media (hover: hover) {
    .rec:hover .rec-thumb :is(video, img) {
      filter: brightness(.82);
    }

    .rec:hover .rec-title {
      text-decoration: underline;
    }
  }

  @media (max-width: 1000px) {
    .watch {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas:
        "main"
        "side";
      gap: 24px;
    }

    .recommendations {
      overflow: visible;
      contain: none;
    }
  }

  @media (max-width: 600px) {
    .watch-title {
      font-size: 20px;
    }

    .rec-thumb {
      width: 44%;
    }
  }

  .message {
    width: min(560px, calc(100% - 2 * var(--gap)));
    margin: 6vh auto 0;
    padding: 20px 0 0;
    border-top: 2px solid var(--ink);
    color: var(--ink-muted);
    font-size: 15px;
    line-height: 1.7;
  }

  .message code {
    display: inline-block;
    padding: 1px 6px;
    background: var(--hover);
    border-radius: 3px;
    color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
  }

  @media (prefers-reduced-motion: reduce) {
    .tile :is(video, img),
    .rec-thumb :is(video, img),
    .play,
    .page-btn,
    .nav-btn,
    .nav-link,
    .search-box,
    .meta-link {
      transition: none;
    }

    .tile,
    .site-nav.is-open .nav-menu {
      animation: none;
    }

    .progress::before {
      animation-duration: 2.4s;
    }
  }
</style>
</head>
<body>

<header id="site-nav" class="site-nav">
  <button id="nav-toggle" class="nav-btn nav-toggle" type="button"
          aria-label="Open menu" aria-expanded="false" aria-controls="nav-menu">
    <svg class="icon-burger" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 7h16" /><path d="M4 12h16" /><path d="M4 17h16" />
    </svg>
    <svg class="icon-x" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M6 6l12 12" /><path d="M18 6L6 18" />
    </svg>
  </button>

<script>
(() => {
  'use strict';

  const CONFIG = Object.freeze({
    dataFile: 'url.json',
    perPageByColumns: [10, 12, 15, 20, 20, 24],
    recommendations: 20,
    mobileRecommendations: 5,
    singleColumnQuery: '(max-width: 600px)',
    watchColumnsQuery: '(min-width: 1001px)',
    mobileNavQuery: '(max-width: 720px)',
    defaultUploader: 'Admin',
    dateLocale: 'en-GB',
    concurrency: 6,
    fetchTimeout: 10000,
    videoTimeout: 20000,
    metadataGraceMs: 1500
  });

  const THEME_KEY = 'sb99-theme';
  const THEME_COLORS = Object.freeze({ light: '#ececea', dark: '#0e0e0e' });
  const PAGE_PARAM = 'page';
  const VIDEO_PARAM = 'video';
  const QUERY_PARAM = 'q';
  const GENRES = Object.freeze({ indo: 'Indo', korea: 'Korea', barat: 'Barat', china: 'China' });
  const DATE_ONLY_PATTERN = /^\d{4}-\d{2}-\d{2}$/;
  const VIDEO_FILE_PATTERN = /\.(mp4|m4v|webm|ogv|ogg|mov|mkv)$/i;
  const EMBED_ALLOW = 'autoplay; fullscreen; picture-in-picture; encrypted-media';
  const BASE_TITLE = document.title;

  const MESSAGES = Object.freeze({
    fetchFailed:
      'Could not load <code>url.json</code>.<br>' +
      'If you opened this file via <code>file://</code> (double-click), ' +
      'the browser blocks <code>fetch()</code>. Serve it from localhost instead:<br><br>' +
      '<code>python3 -m http.server 8000</code><br>' +
      'then open <code>http://localhost:8000</code>',
    invalidJson:
      '<code>url.json</code> is not valid JSON. Check for a missing comma, quote or bracket.',
    noVideos:
      '<code>url.json</code> contains no valid videos.<br>' +
      'It must be a list of objects. Only <code>url</code> is required:<br><br>' +
      '<code>{ "url": "https://example.com/video.mp4", "title": "Title", ' +
      '"genre": "Genre", "category": ["Category One", "Category Two"], ' +
      '"cast": ["Name One", "Name Two"] }</code>',
    allFailed:
      'All videos on this page failed to load. Check <code>url.json</code> &mdash; every URL must ' +
      'point directly to a video file (not a web page) and be publicly accessible.'
  });

  const dom = {
    nav: document.getElementById('site-nav'),
    navToggle: document.getElementById('nav-toggle'),
    themeToggle: document.getElementById('theme-toggle'),
    themeColorMeta: document.querySelector('meta[name="theme-color"]'),
    searchForm: document.getElementById('search-form'),
    searchInput: document.getElementById('search-input'),
    searchClear: document.getElementById('search-clear'),
    searchToggle: document.getElementById('search-toggle'),
    searchClose: document.getElementById('search-close'),
    searchStatus: document.getElementById('search-status'),
    progress: document.getElementById('progress'),
    scroller: document.getElementById('scroller'),
    gallery: document.getElementById('gallery'),
    pagination: document.getElementById('pagination'),
    pageList: document.getElementById('page-list'),
    message: document.getElementById('message'),
    watchPlayer: document.getElementById('watch-player'),
    watchVideo: document.getElementById('watch-video'),
    watchTitle: document.getElementById('watch-title'),
    watchMeta: document.getElementById('watch-meta'),
    watchGenreRow: document.getElementById('watch-genre-row'),
    watchGenre: document.getElementById('watch-genre'),
    watchCategoryRow: document.getElementById('watch-category-row'),
    watchCategory: document.getElementById('watch-category'),
    watchUploaded: document.getElementById('watch-uploaded'),
    watchCastRow: document.getElementById('watch-cast-row'),
    watchCast: document.getElementById('watch-cast'),
    recommendations: document.getElementById('recommendations'),
    recommendationList: document.getElementById('recommendation-list'),
    recommendationMore: document.getElementById('recommendations-more'),
    recommendationMoreList: document.getElementById('recommendation-more-list'),
    watchMain: document.getElementById('watch-main'),
    year: document.getElementById('year')
  };

  const state = {
    entries: [],
    query: '',
    results: null,
    page: 0,
    totalPages: 1,
    perPage: 0,
    items: [],
    loadToken: 0,
    loading: false,
    gridScroll: 0,
    watching: null,
    recommended: []
  };

  const itemByElement = new WeakMap();

  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

  const isModifiedClick = (event) =>
    event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey;

  const closestFromEvent = (event, selector) =>
    event.target instanceof Element ? event.target.closest(selector) : null;

  const isHttpUrl = (value) => {
    try {
      const { protocol } = new URL(value);
      return protocol === 'http:' || protocol === 'https:';
    } catch {
      return false;
    }
  };

  const toText = (value) => (typeof value === 'string' ? value.trim() : '');

  const formatUploaded = (uploader, value) => {
    const text = toText(value);
    const date = text ? new Date(text) : null;
    if (!date || Number.isNaN(date.getTime())) return 'by ' + uploader;

    const dateOnly = DATE_ONLY_PATTERN.test(text);
    const label = new Intl.DateTimeFormat(CONFIG.dateLocale, {
      day: 'numeric',
      month: 'short',
      year: 'numeric',
      ...(dateOnly ? { timeZone: 'UTC' } : { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
    }).format(date);

    return 'by ' + uploader + ' on ' + label;
  };

  const detectType = (url, declared) => {
    if (declared === 'video' || declared === 'embed') return declared;
    return VIDEO_FILE_PATTERN.test(new URL(url).pathname) ? 'video' : 'embed';
  };

  const uniqueList = (names) => {
    const seen = new Set();
    return names.filter((name) => {
      const key = name.toLowerCase();
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  };

  const toList = (value) => {
    const names = Array.isArray(value) ? value : typeof value === 'string' ? value.split(',') : [];
    return names.map(toText).filter(Boolean);
  };

  const normalizeText = (value) =>
    value.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

  const normalizeQuery = (value) => value.trim().replace(/\s+/g, ' ');

  const parseEntries = (data) => {
    const list = Array.isArray(data) ? data : data && Array.isArray(data.videos) ? data.videos : [];
    const entries = [];

    for (const raw of list) {
      const url = raw ? toText(raw.url) : '';
      if (!isHttpUrl(url)) continue;

      const number = entries.length + 1;
      const title = toText(raw.title) || 'Video ' + number;
      const genre = GENRES[toText(raw.genre).toLowerCase()] || '';
      const categories = uniqueList(toList(raw.category))
        .filter((name) => name.toLowerCase() !== genre.toLowerCase());
      const uploader = toText(raw.uploader) || CONFIG.defaultUploader;
      const cast = toList(raw.cast);

      entries.push({
        number,
        type: detectType(url, toText(raw.type).toLowerCase()),
        url,
        cover: isHttpUrl(toText(raw.cover)) ? toText(raw.cover) : '',
        title,
        genre,
        categories,
        uploaded: formatUploaded(uploader, raw.date),
        cast,
        searchText: normalizeText([title, genre, ...categories, ...cast].join(' '))
      });
    }

    return entries.reverse();
  };

  const findEntry = (number) => state.entries[state.entries.length - number];

  const filterEntries = (query) => {
    if (!query) return state.entries;

    const terms = normalizeText(query).split(' ');
    return state.entries.filter((entry) => terms.every((term) => entry.searchText.includes(term)));
  };

  const fetchWithTimeout = async (url, timeoutMs) => {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      return await fetch(url, { cache: 'no-cache', signal: controller.signal });
    } finally {
      clearTimeout(timer);
    }
  };

  const runPool = async (list, limit, worker) => {
    let cursor = 0;

    const run = async () => {
      while (cursor < list.length) await worker(list[cursor++]).catch(() => {});
    };

    await Promise.all(Array.from({ length: Math.min(limit, list.length) }, run));
  };

  const showMessage = (html) => {
    dom.message.innerHTML = html;
    dom.message.hidden = false;
  };

  const isWatching = () => dom.scroller.classList.contains('is-watching');

  const syncProgress = () => {
    dom.progress.hidden = !state.loading || isWatching();
  };

  const setLoading = (loading) => {
    state.loading = loading;
    dom.gallery.setAttribute('aria-busy', String(loading));
    syncProgress();
  };

  const isSingleColumn = () => window.matchMedia(CONFIG.singleColumnQuery).matches;

  const orderedItems = () => state.items.slice().sort((a, b) => a.index - b.index);

  const coverSource = (url) => url + (url.includes('#') ? '' : '#t=0.1');

  const createCoverVideo = () => {
    const video = document.createElement('video');
    video.muted = true;
    video.setAttribute('muted', '');
    video.playsInline = true;
    video.preload = 'metadata';
    video.disablePictureInPicture = true;
    video.draggable = false;
    return video;
  };

  const loadVideo = (entry) => new Promise((resolve) => {
    const video = createCoverVideo();
    let graceTimer = 0;

    const settle = (loaded) => {
      clearTimeout(timeoutTimer);
      clearTimeout(graceTimer);
      video.onerror = video.onloadedmetadata = video.onloadeddata = null;

      const valid = loaded && video.videoWidth > 0 && video.videoHeight > 0;

      if (!valid) {
        video.removeAttribute('src');
        video.load();
      }

      resolve(valid ? video : null);
    };

    const timeoutTimer = setTimeout(() => settle(false), CONFIG.videoTimeout);

    video.onerror = () => settle(false);
    video.onloadedmetadata = () => {
      graceTimer = setTimeout(() => settle(true), CONFIG.metadataGraceMs);
    };
    video.onloadeddata = () => settle(true);
    video.src = coverSource(entry.url);
  });

  const loadImage = (url) => new Promise((resolve) => {
    const image = new Image();
    image.alt = '';
    image.draggable = false;

    const timeoutTimer = setTimeout(() => settle(null), CONFIG.videoTimeout);

    const settle = (result) => {
      clearTimeout(timeoutTimer);
      image.onload = image.onerror = null;
      resolve(result);
    };

    image.onload = () => settle(image.naturalWidth > 0 ? image : null);
    image.onerror = () => settle(null);
    image.src = url;
  });

  const createCoverFallback = () => {
    const fallback = document.createElement('span');
    fallback.className = 'cover-fallback';
    return fallback;
  };

  const loadCover = async (entry) => {
    const image = entry.cover ? await loadImage(entry.cover) : null;
    if (image) return image;

    return entry.type === 'video' ? loadVideo(entry) : createCoverFallback();
  };

  const createBadge = (text) => {
    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = text;
    badge.dataset.genre = text.toLowerCase();
    return badge;
  };

  const createPlayIcon = () => {
    const icon = document.createElement('span');
    icon.className = 'play';
    icon.setAttribute('aria-hidden', 'true');
    icon.innerHTML =
      '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">' +
      '<path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
    return icon;
  };

  const createTile = (media, entry, index) => {
    const cover = document.createElement('div');
    cover.className = 'tile-cover';
    cover.append(media, ...(entry.genre ? [createBadge(entry.genre)] : []), createPlayIcon());

    const title = document.createElement('figcaption');
    title.className = 'tile-title';
    title.textContent = entry.title;

    const element = document.createElement('figure');
    element.className = 'tile';
    element.tabIndex = 0;
    element.setAttribute('role', 'button');
    element.setAttribute('aria-label', 'Play video: ' + entry.title);
    element.append(cover, title);

    const item = { element, index, entry };

    itemByElement.set(element, item);
    return item;
  };

  const getPageFromUrl = () => {
    const value = parseInt(new URLSearchParams(location.search).get(PAGE_PARAM), 10);
    return Number.isFinite(value) ? value : 1;
  };

  const getVideoFromUrl = () => {
    const value = parseInt(new URLSearchParams(location.search).get(VIDEO_PARAM), 10);
    return Number.isInteger(value) && value >= 1 && value <= state.entries.length ? value : null;
  };

  const getQueryFromUrl = () =>
    normalizeQuery(new URLSearchParams(location.search).get(QUERY_PARAM) || '');

  const buildUrl = (page, video, query) => {
    const params = new URLSearchParams(location.search);

    if (page <= 1) params.delete(PAGE_PARAM);
    else params.set(PAGE_PARAM, String(page));

    if (video) params.set(VIDEO_PARAM, String(video));
    else params.delete(VIDEO_PARAM);

    if (query) params.set(QUERY_PARAM, query);
    else params.delete(QUERY_PARAM);

    const search = params.toString();
    return location.pathname + (search ? '?' + search : '') + location.hash;
  };

  const normalizeUrl = (url) => {
    const current = location.pathname + location.search + location.hash;
    if (current !== url) history.replaceState(history.state, '', url);
  };

  const buildPageList = (current, total) => {
    const wanted = new Set([1, 2, current - 1, current, current + 1, total - 1, total]);
    const pages = [...wanted].filter((page) => page >= 1 && page <= total).sort((a, b) => a - b);
    const result = [];

    pages.forEach((page, index) => {
      if (index > 0) {
        const difference = page - pages[index - 1];
        if (difference === 2) result.push(page - 1);
        else if (difference > 2) result.push(null);
      }
      result.push(page);
    });

    return result;
  };

  const createPageControl = ({ page, text, label, current = false, disabled = false }) => {
    const element = document.createElement(disabled ? 'span' : 'a');
    element.className = 'page-btn';
    element.textContent = text;
    element.setAttribute('aria-label', label);

    if (disabled) {
      element.setAttribute('aria-disabled', 'true');
      return element;
    }

    element.href = buildUrl(page, null, state.query);
    element.dataset.page = String(page);
    if (current) element.setAttribute('aria-current', 'page');
    return element;
  };

  const createPageGap = () => {
    const gap = document.createElement('span');
    gap.className = 'page-gap';
    gap.setAttribute('aria-hidden', 'true');
    gap.textContent = '–';
    return gap;
  };

  const renderPagination = () => {
    const { page, totalPages } = state;

    dom.pagination.hidden = totalPages <= 1;
    if (totalPages <= 1) return;

    const controls = [
      createPageControl({ page: page - 1, text: 'Prev', label: 'Previous page', disabled: page === 1 })
    ];

    for (const entry of buildPageList(page, totalPages)) {
      controls.push(entry === null
        ? createPageGap()
        : createPageControl({ page: entry, text: String(entry), label: 'Page ' + entry, current: entry === page }));
    }

    controls.push(
      createPageControl({ page: page + 1, text: 'Next', label: 'Next page', disabled: page === totalPages })
    );

    dom.pageList.replaceChildren(...controls);
  };

  const renderSearchStatus = () => {
    const { query, results } = state;

    dom.searchStatus.hidden = !query;
    if (!query) return;

    const count = results.length;
    dom.searchStatus.textContent = count === 0
      ? 'No videos found for “' + query + '”. Try a title, a name from the cast, a genre or a category.'
      : count + (count === 1 ? ' video' : ' videos') + ' found for “' + query + '”';
  };

  const setTitle = (label = '') => {
    document.title = label ? label + ' - ' + BASE_TITLE : BASE_TITLE;
  };

  const renderPage = async () => {
    const token = ++state.loadToken;
    const start = (state.page - 1) * state.perPage;
    const queue = state.results
      .slice(start, start + state.perPage)
      .map((entry, index) => ({ entry, index }));

    state.items = [];
    dom.message.hidden = true;
    dom.gallery.replaceChildren();
    renderPagination();
    dom.scroller.scrollTo(0, 0);
    setLoading(queue.length > 0);

    await runPool(queue, CONFIG.concurrency, async ({ entry, index }) => {
      if (token !== state.loadToken) return;

      const cover = await loadCover(entry);
      if (!cover || token !== state.loadToken) return;

      const item = createTile(cover, entry, index);
      state.items.push(item);
      const next = orderedItems().find((other) => other.index > index);
      dom.gallery.insertBefore(item.element, next ? next.element : null);
    });

    if (token !== state.loadToken) return;

    setLoading(false);
    if (queue.length > 0 && state.items.length === 0) showMessage(MESSAGES.allFailed);
  };

  const stopWatchVideo = () => {
    dom.watchVideo.pause();
    dom.watchVideo.removeAttribute('src');
    dom.watchVideo.load();
    dom.watchPlayer.querySelector('iframe')?.remove();
    dom.watchPlayer.classList.remove('is-embed');
  };

  const createEmbedFrame = (entry) => {
    const frame = document.createElement('iframe');
    frame.title = entry.title;
    frame.allow = EMBED_ALLOW;
    frame.allowFullscreen = true;
    frame.referrerPolicy = 'strict-origin-when-cross-origin';
    frame.src = entry.url;
    return frame;
  };

  const playEntry = (entry) => {
    stopWatchVideo();

    if (entry.type === 'embed') {
      dom.watchPlayer.classList.add('is-embed');
      dom.watchPlayer.append(createEmbedFrame(entry));
      return;
    }

    dom.watchVideo.src = entry.url;
    dom.watchVideo.play().catch(() => {});
  };

  const createMetaLink = (text) => {
    const link = document.createElement('a');
    link.className = 'meta-link';
    link.href = buildUrl(1, null, text);
    link.dataset.query = text;
    link.textContent = text;
    return link;
  };

  const joinWithCommas = (nodes) =>
    nodes.flatMap((node, index) => (index === 0 ? [node] : [', ', node]));

  const getRecommendationLimit = () =>
    isSingleColumn() ? CONFIG.mobileRecommendations : CONFIG.recommendations;

  const buildRecommendations = (entry) => {
    const others = state.entries.filter((other) => other !== entry);
    const shares = (a, b) => a.some((value) => b.includes(value));
    const sameCategory = others.filter((other) => shares(other.categories, entry.categories));
    const sameGenre = others.filter(
      (other) => entry.genre !== '' && other.genre === entry.genre && !sameCategory.includes(other)
    );
    const sharedCast = others.filter(
      (other) => shares(other.cast, entry.cast) && !sameCategory.includes(other) && !sameGenre.includes(other)
    );
    const related = [...sameCategory, ...sameGenre, ...sharedCast];

    return (related.length > 0 ? related : others).slice(0, getRecommendationLimit());
  };

  const createRecommendationMeta = (text) => {
    const meta = document.createElement('span');
    meta.className = 'rec-meta';
    meta.textContent = text;
    return meta;
  };

  const createRecommendationCover = (entry) => {
    const fallbackCover = () => {
      if (entry.type !== 'video') return createCoverFallback();

      const video = createCoverVideo();
      video.src = coverSource(entry.url);
      return video;
    };

    if (!entry.cover) return fallbackCover();

    const image = new Image();
    image.alt = '';
    image.draggable = false;
    image.onerror = () => image.replaceWith(fallbackCover());
    image.src = entry.cover;
    return image;
  };

  const createRecommendation = (entry) => {
    const thumbnail = document.createElement('span');
    thumbnail.className = 'rec-thumb';
    thumbnail.append(createRecommendationCover(entry));

    const title = document.createElement('span');
    title.className = 'rec-title';
    title.textContent = entry.title;

    const info = document.createElement('span');
    info.className = 'rec-info';
    info.append(title);

    if (entry.cast.length > 0) info.append(createRecommendationMeta(entry.cast.join(', ')));

    const labels = [entry.genre, ...entry.categories].filter(Boolean);
    if (labels.length > 0) info.append(createRecommendationMeta(labels.join(', ')));

    const link = document.createElement('a');
    link.className = 'rec';
    link.href = buildUrl(1, entry.number, getQueryFromUrl());
    link.dataset.video = String(entry.number);
    link.append(thumbnail, info);

    const item = document.createElement('li');
    item.append(link);
    return item;
  };

  const createMoreCard = (entry) => {
    const cover = document.createElement('div');
    cover.className = 'tile-cover';
    cover.append(
      createRecommendationCover(entry),
      ...(entry.genre ? [createBadge(entry.genre)] : []),
      createPlayIcon()
    );

    const title = document.createElement('span');
    title.className = 'tile-title';
    title.textContent = entry.title;

    const link = document.createElement('a');
    link.className = 'tile';
    link.href = buildUrl(1, entry.number, getQueryFromUrl());
    link.dataset.video = String(entry.number);
    link.append(cover, title);

    const item = document.createElement('li');
    item.append(link);
    return item;
  };

  const distributeRecommendations = () => {
    const items = state.recommended;
    dom.recommendationList.replaceChildren(...items.map((item) => item.row));
    dom.recommendationMoreList.replaceChildren();
    dom.recommendationMore.hidden = true;

    if (!isWatching() || !window.matchMedia(CONFIG.watchColumnsQuery).matches) return;

    const limit = dom.recommendations.getBoundingClientRect().bottom;
    const overflowIndex = items.findIndex((item) => item.row.getBoundingClientRect().bottom > limit);
    if (overflowIndex === -1) return;

    const overflow = items.slice(overflowIndex);
    dom.recommendationList.replaceChildren(...items.slice(0, overflowIndex).map((item) => item.row));
    dom.recommendationMoreList.replaceChildren(
      ...overflow.map((item) => (item.card ??= createMoreCard(item.entry)))
    );
    dom.recommendationMore.hidden = false;
  };

  const renderRecommendations = (entry) => {
    const list = buildRecommendations(entry);

    state.recommended = list.map((other) => ({ entry: other, row: createRecommendation(other), card: null }));
    dom.recommendations.hidden = list.length === 0;
    distributeRecommendations();
  };

  const renderWatchDetails = (entry) => {
    dom.watchTitle.textContent = entry.title;
    dom.watchGenreRow.hidden = entry.genre === '';
    dom.watchGenre.replaceChildren(...(entry.genre ? [createMetaLink(entry.genre)] : []));
    dom.watchCategoryRow.hidden = entry.categories.length === 0;
    dom.watchCategory.replaceChildren(...joinWithCommas(entry.categories.map(createMetaLink)));
    dom.watchUploaded.textContent = entry.uploaded;
    dom.watchCastRow.hidden = entry.cast.length === 0;
    dom.watchCast.replaceChildren(...joinWithCommas(entry.cast.map(createMetaLink)));
  };

  const showWatch = (number, query) => {
    if (!isWatching()) state.gridScroll = dom.scroller.scrollTop;

    const entry = findEntry(number);
    state.watching = entry;

    normalizeUrl(buildUrl(1, number, query));
    dom.scroller.classList.add('is-watching');
    syncProgress();

    playEntry(entry);

    renderWatchDetails(entry);
    renderRecommendations(entry);
    setTitle(entry.title);

    dom.scroller.scrollTo(0, 0);
    dom.watchTitle.focus({ preventScroll: true });
  };

  const countPages = () => Math.max(1, Math.ceil(state.results.length / state.perPage));

  const measurePerPage = () => {
    const tracks = getComputedStyle(dom.gallery).gridTemplateColumns.split(' ');
    const columns = tracks.filter((track) => track.endsWith('px')).length;
    if (columns === 0) return state.perPage || CONFIG.perPageByColumns[0];

    return CONFIG.perPageByColumns[Math.min(columns, CONFIG.perPageByColumns.length) - 1];
  };

  const syncPerPage = () => {
    const perPage = measurePerPage();
    if (perPage === state.perPage) return false;

    state.perPage = perPage;
    if (state.results !== null) {
      state.totalPages = countPages();
      state.page = 0;
    }
    return true;
  };

  const handleGalleryResize = () => {
    if (isWatching() || state.results === null) return;

    const firstIndex = (state.page - 1) * state.perPage;
    if (!syncPerPage()) return;

    navigate(Math.floor(firstIndex / state.perPage) + 1, null, state.query, 'replace');
  };

  const showGrid = (query, requestedPage) => {
    const wasWatching = isWatching();

    stopWatchVideo();
    dom.recommendationList.replaceChildren();
    dom.recommendationMoreList.replaceChildren();
    state.recommended = [];
    dom.scroller.classList.remove('is-watching');
    syncProgress();
    syncPerPage();

    if (state.results === null || query !== state.query) {
      state.query = query;
      state.results = filterEntries(query);
      state.totalPages = countPages();
      state.page = 0;
      renderSearchStatus();
    }

    const page = clamp(requestedPage, 1, state.totalPages);
    const titleParts = [query && 'Search: ' + query, page > 1 && 'Page ' + page];

    normalizeUrl(buildUrl(page, null, query));
    setTitle(titleParts.filter(Boolean).join(' - '));

    if (state.page !== page) {
      state.page = page;
      renderPage();
      return;
    }

    if (wasWatching) dom.scroller.scrollTo(0, state.gridScroll);
  };

  const syncSearchInput = (query) => {
    if (normalizeQuery(dom.searchInput.value) !== query) dom.searchInput.value = query;
    dom.searchClear.hidden = dom.searchInput.value === '';
  };

  const applyRoute = () => {
    const video = getVideoFromUrl();
    const query = getQueryFromUrl();

    syncSearchInput(query);

    if (video) showWatch(video, query);
    else showGrid(query, getPageFromUrl());
  };

  const navigate = (page, video, query, mode) => {
    const url = buildUrl(page, video, query);

    if (mode === 'push') history.pushState(null, '', url);
    else history.replaceState(null, '', url);

    applyRoute();
  };

  const goHome = () => {
    if (!isWatching() && state.page === 1 && state.query === '') {
      dom.scroller.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      navigate(1, null, '', 'push');
    }
  };

  const submitSearch = (value) => {
    const query = normalizeQuery(value);
    const currentQuery = getQueryFromUrl();

    if (!isWatching() && query === currentQuery) return;

    navigate(1, null, query, 'push');
  };

  const setSearching = (searching) => {
    dom.nav.classList.toggle('is-searching', searching);
    if (!searching) return;

    setMenuOpen(false);
    requestAnimationFrame(() => dom.searchInput.focus());
  };

  const handleSearchInput = () => {
    dom.searchClear.hidden = dom.searchInput.value === '';
  };

  const handleSearchSubmit = (event) => {
    event.preventDefault();
    submitSearch(dom.searchInput.value);
    dom.searchInput.blur();
  };

  const handleSearchClear = () => {
    dom.searchInput.value = '';
    dom.searchClear.hidden = true;
    submitSearch('');
    dom.searchInput.focus();
  };

  const handleSearchCancel = () => {
    if (dom.searchInput.value !== '') {
      dom.searchInput.value = '';
      dom.searchClear.hidden = true;
      submitSearch('');
    }
    setSearching(false);
  };

  const bindSearch = () => {
    dom.searchInput.addEventListener('input', handleSearchInput);
    dom.searchForm.addEventListener('submit', handleSearchSubmit);
    dom.searchClear.addEventListener('click', handleSearchClear);
    dom.searchToggle.addEventListener('click', () => setSearching(true));
    dom.searchClose.addEventListener('click', handleSearchCancel);
  };

  const currentTheme = () =>
    document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';

  const syncThemeControls = () => {
    const theme = currentTheme();
    dom.themeToggle.setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
    dom.themeColorMeta.content = THEME_COLORS[theme];
  };

  const saveTheme = (theme) => {
    try {
      localStorage.setItem(THEME_KEY, theme);
    } catch {
      return;
    }
  };

  const setTheme = (theme) => {
    document.documentElement.dataset.theme = theme;
    saveTheme(theme);
    syncThemeControls();
  };

  const isMenuOpen = () => dom.nav.classList.contains('is-open');

  const setMenuOpen = (open) => {
    dom.nav.classList.toggle('is-open', open);
    dom.navToggle.setAttribute('aria-expanded', String(open));
    dom.navToggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  };

  const handleNavClick = (event) => {
    const link = closestFromEvent(event, 'a');
    if (!link) return;

    if (link.getAttribute('href') === '#') {
      event.preventDefault();
    } else if (link.hasAttribute('data-home') && !isModifiedClick(event) && state.entries.length > 0) {
      event.preventDefault();
      goHome();
    }

    setMenuOpen(false);
  };

  const handleOutsideClick = (event) => {
    if (!isMenuOpen() || dom.nav.contains(event.target)) return;

    event.preventDefault();
    event.stopPropagation();
    setMenuOpen(false);
  };

  const bindNavbar = () => {
    dom.navToggle.addEventListener('click', () => setMenuOpen(!isMenuOpen()));
    dom.themeToggle.addEventListener('click', () => setTheme(currentTheme() === 'dark' ? 'light' : 'dark'));
    dom.nav.addEventListener('click', handleNavClick);
    document.addEventListener('click', handleOutsideClick, true);
    window.matchMedia(CONFIG.singleColumnQuery).addEventListener('change', () => {
      if (isWatching() && state.watching) renderRecommendations(state.watching);
    });

    window.matchMedia(CONFIG.mobileNavQuery).addEventListener('change', () => {
      setMenuOpen(false);
      setSearching(false);
    });
  };

  const openTile = (tile) => {
    const item = itemByElement.get(tile);
    if (item) navigate(1, item.entry.number, state.query, 'push');
  };

  const handleGalleryClick = (event) => {
    const tile = closestFromEvent(event, '.tile');
    if (tile) openTile(tile);
  };

  const handleGalleryKeydown = (event) => {
    if (event.key !== 'Enter' && event.key !== ' ') return;

    const tile = closestFromEvent(event, '.tile');
    if (!tile) return;

    event.preventDefault();
    openTile(tile);
  };

  const handlePaginationClick = (event) => {
    const link = closestFromEvent(event, 'a[data-page]');
    if (!link || isModifiedClick(event)) return;

    event.preventDefault();

    const page = Number(link.dataset.page);
    if (page !== state.page) navigate(page, null, state.query, 'push');
  };

  const handleRecommendationClick = (event) => {
    const link = closestFromEvent(event, 'a[data-video]');
    if (!link || isModifiedClick(event)) return;

    event.preventDefault();
    navigate(1, Number(link.dataset.video), getQueryFromUrl(), 'push');
  };

  const handleMetaClick = (event) => {
    const link = closestFromEvent(event, 'a[data-query]');
    if (!link || isModifiedClick(event)) return;

    event.preventDefault();
    navigate(1, null, link.dataset.query, 'push');
  };

  const handleEscape = (event) => {
    if (event.key !== 'Escape') return;

    if (isMenuOpen()) {
      setMenuOpen(false);
      dom.navToggle.focus();
    } else if (dom.nav.classList.contains('is-searching')) {
      setSearching(false);
    }
  };

  const bindEvents = () => {
    bindNavbar();
    bindSearch();

    dom.gallery.addEventListener('click', handleGalleryClick);
    dom.gallery.addEventListener('keydown', handleGalleryKeydown);
    dom.pagination.addEventListener('click', handlePaginationClick);
    dom.recommendationList.addEventListener('click', handleRecommendationClick);
    dom.recommendationMoreList.addEventListener('click', handleRecommendationClick);
    dom.watchMeta.addEventListener('click', handleMetaClick);

    dom.watchVideo.addEventListener('contextmenu', (event) => event.preventDefault());

    document.addEventListener('keydown', handleEscape);
    window.addEventListener('popstate', () => {
      if (state.entries.length > 0) applyRoute();
    });
    new ResizeObserver(distributeRecommendations).observe(dom.watchMain);
    new ResizeObserver(handleGalleryResize).observe(dom.gallery);
  };

  const loadEntries = async () => {
    const response = await fetchWithTimeout(CONFIG.dataFile, CONFIG.fetchTimeout);
    if (!response.ok) throw new Error('HTTP ' + response.status);
    return parseEntries(await response.json());
  };

  const init = async () => {
    dom.year.textContent = String(new Date().getFullYear());
    syncThemeControls();
    bindEvents();

    try {
      state.entries = await loadEntries();
    } catch (error) {
      showMessage(error instanceof SyntaxError ? MESSAGES.invalidJson : MESSAGES.fetchFailed);
      return;
    }

    if (state.entries.length === 0) {
      showMessage(MESSAGES.noVideos);
      return;
    }

    applyRoute();
  };

  init();
})();
</script>
</body>
</html>
