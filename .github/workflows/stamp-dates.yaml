name: Stamp upload dates

on:
  push:
    paths:
      - url.json
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@v4

      - name: Stamp dates
        run: python3 stamp-dates.py url.json

      - name: Commit and rebuild site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet url.json; then
            echo "Nothing to stamp"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add url.json
          git commit -m "Stamp upload dates"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
